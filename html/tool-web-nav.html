<style>
:root{
  --wn-tw:#1e9e6a;          /* 工具哇主色 */
  --wn-jy:#f47c3c;          /* 菜鸟工具主色 */
  --wn-radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{
  /* themes.css 提供的是 --bg1 / --bg2（没有 --bg），
     这里同时兜住两种写法，深浅色主题都能铺满。 */
  background:var(--bg1,var(--bg,#f8f6fc));
}
body{
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--text,#1e1a2e);
  background:linear-gradient(180deg,var(--bg1,var(--bg,#f8f6fc)) 0%,var(--bg2,#ede9f7) 100%);
  background-attachment:fixed;   /* 渐变跟着视口，内容再长底色也不断 */
  min-height:100vh;             /* 短页面也铺满一屏 */
  -webkit-tap-highlight-color:transparent;
  padding:0 0 90px;
}
.wn-wrap{max-width:1120px;margin:0 auto;padding:0 18px}

/* ---------------- 顶部标题 ---------------- */
.wn-hero{padding:34px 0 6px;position:relative}
/* 右侧给工具槽（返回 / 主题 / 语言，共 3 个 44px 钮）留位，
   标题和副标题不会被按钮压到 */
.wn-hero-txt{min-width:0;padding-right:170px}
.wn-hero h1{
  margin:0 0 6px;font-size:clamp(1.45rem,4.2vw,2.1rem);font-weight:800;letter-spacing:-.02em;
}
.wn-hero p{margin:0;color:var(--muted,#6b7280);font-size:.92rem}

/* ---------------- 返回键 ----------------
   nav-kit 只负责「该不该显示」，按钮本体得页面自己提供；
   dock-kit 的 findBack() 认 a.back-btn / a.tb-back / a.back / a.ui.back / a.gk-back。
   用类名 back-btn（工具页通用写法），窄屏时会被收进工具坞。 */
.back-btn{
  flex:0 0 auto;width:44px;height:44px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line,rgba(0,0,0,.1));background:var(--card,#fff);color:var(--text,#1e1a2e);
  text-decoration:none;box-shadow:var(--shadow,0 2px 10px rgba(0,0,0,.06));
  transition:transform .16s ease,border-color .16s ease,color .16s ease;
}
.back-btn svg{width:19px;height:19px;display:block}
.back-btn:hover{transform:translateX(-2px);border-color:var(--accent,#6e56cf);color:var(--accent,#6e56cf)}
.back-btn:active{transform:translateX(0) scale(.94)}
.back-btn:focus-visible{outline:2px solid var(--accent,#6e56cf);outline-offset:2px}
/* 在工具槽里排第一：返回 → 主题 → 语言 → 全屏（dock-kit 的全站顺序） */
.kb-tools > [data-kb-slot="back"]{order:0}
.wn-hero b{color:var(--accent,#1e7a4c)}

/* ---------------- 两个来源卡片（页面顶部先展示这两个链接） ---------------- */
.wn-sources{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:22px 0 4px;
}
.wn-src{
  display:flex;align-items:center;gap:14px;text-decoration:none;
  padding:18px;border-radius:var(--wn-radius);
  background:var(--card,#fff);
  border:1px solid var(--line,rgba(0,0,0,.08));
  box-shadow:var(--shadow,0 2px 10px rgba(0,0,0,.05));
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.wn-src:hover{transform:translateY(-2px);border-color:var(--c);box-shadow:var(--shadow,0 10px 28px -12px rgba(0,0,0,.28))}
.wn-src:active{transform:translateY(0)}
.wn-src[data-s="tw"]{--c:var(--wn-tw)}
.wn-src[data-s="jy"]{--c:var(--wn-jy)}
.wn-logo{
  flex:0 0 46px;width:46px;height:46px;border-radius:13px;flex:0 0 46px;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--c) 14%,transparent);
  color:var(--c);font-weight:800;font-size:1.15rem;overflow:hidden;position:relative;
}
.wn-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wn-src-txt{min-width:0;flex:1}
.wn-src-txt b{display:block;font-size:1.02rem;color:var(--text,#1e1a2e);letter-spacing:.01em}
.wn-host{display:block;font-size:.76rem;color:var(--c);font-weight:600;margin:1px 0 3px}
.wn-src-txt p{margin:0;font-size:.8rem;color:var(--muted,#6b7280);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wn-src-n{
  flex:0 0 auto;align-self:flex-start;font-size:.75rem;font-weight:700;
  color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);
  padding:5px 9px;border-radius:999px;white-space:nowrap;
}

/* ---------------- 搜索 + 筛选 ---------------- */
.wn-bar{position:sticky;top:0;z-index:20;margin:22px 0 0;padding:12px 0 10px;
  background:color-mix(in srgb,var(--bg1,var(--bg,#f8f6fc)) 88%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line,rgba(0,0,0,.07));
}
.wn-search{position:relative;display:flex;align-items:center}
.wn-search svg{position:absolute;left:13px;width:17px;height:17px;color:var(--muted,#9aa3af);pointer-events:none}
.wn-search input{
  width:100%;height:42px;padding:0 40px 0 39px;border-radius:999px;
  border:1px solid var(--line,rgba(0,0,0,.12));
  background:var(--card,#fff);color:var(--text,#1e1a2e);font-size:.95rem;outline:none;
  transition:border-color .18s ease,box-shadow .18s ease;
}
.wn-search input:focus{
  border-color:var(--accent,#1e7a4c);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#1e7a4c) 18%,transparent);
}
.wn-clear{
  position:absolute;right:8px;width:26px;height:26px;border:0;border-radius:50%;cursor:pointer;
  background:var(--ghost-active,rgba(0,0,0,.06));color:var(--muted,#6b7280);font-size:15px;line-height:1;
  display:none;
}
.wn-clear.on{display:block}

.wn-chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wn-chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  padding:6px 12px;border-radius:999px;font-size:.82rem;white-space:nowrap;
  border:1px solid var(--line,rgba(0,0,0,.1));background:var(--card,#fff);color:var(--muted,#6b7280);
  transition:all .16s ease;
}
.chip:hover{border-color:var(--c,var(--accent,#1e7a4c));color:var(--text,#1e1a2e)}
.chip.on{background:var(--c,var(--accent,#1e7a4c));border-color:var(--c,var(--accent,#1e7a4c));color:#fff}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--accent,#1e7a4c));flex:0 0 7px}
.chip.on .dot{background:rgba(255,255,255,.85)}
.chip .n{opacity:.65;font-size:.75rem;font-variant-numeric:tabular-nums}
.chip[data-s="tw"]{--c:var(--wn-tw)}
.chip[data-s="jy"]{--c:var(--wn-jy)}

/* ---------------- 分类区块 ---------------- */
.wn-cat{margin:30px 0 0}
.wn-cat-head{display:flex;align-items:baseline;gap:9px;margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line,rgba(0,0,0,.07))}
.wn-cat-head h2{margin:0;font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:8px}
.wn-cat-head .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.wn-cat-head .n{font-size:.78rem;color:var(--muted,#9aa3af);font-weight:600;font-variant-numeric:tabular-nums}
.wn-cat-head .src{
  font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em;
}
.wn-cat[data-s="tw"] .src{background:color-mix(in srgb,var(--wn-tw) 14%,transparent);color:var(--wn-tw)}
.wn-cat[data-s="jy"] .src{background:color-mix(in srgb,var(--wn-jy) 15%,transparent);color:var(--wn-jy)}

/* ---------------- 工具卡片 ---------------- */
.wn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:10px}
.wn-item{
  display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0;
  padding:11px 12px;border-radius:12px;
  background:var(--card,#fff);border:1px solid var(--line,rgba(0,0,0,.07));
  transition:transform .16s ease,border-color .16s ease,background .16s ease;
}
.wn-item:hover{transform:translateY(-2px);border-color:var(--hue,var(--accent,#1e7a4c));background:color-mix(in srgb,var(--hue,#1e7a4c) 5%,var(--card,#fff))}
.wn-item:active{transform:translateY(0)}
.wn-ic{
  position:relative;flex:0 0 34px;width:34px;height:34px;border-radius:10px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--hue,#7c8cf8) 16%,transparent);
  color:var(--hue,#7c8cf8);font-weight:700;font-size:.92rem;
}
.wn-ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.wn-ic img[data-ok]{opacity:1}
.wn-txt{min-width:0;flex:1}
.wn-txt b{display:block;font-size:.88rem;font-weight:600;color:var(--text,#1e1a2e);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wn-txt i{display:block;font-style:normal;font-size:.75rem;color:var(--muted,#9aa3af);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wn-go{flex:0 0 auto;color:var(--muted,#c3c9d2);font-size:.95rem}

.wn-empty{
  display:none;margin:56px auto;text-align:center;color:var(--muted,#9aa3af);font-size:.92rem;
  padding:40px 20px;border:1px dashed var(--line,rgba(0,0,0,.12));border-radius:var(--wn-radius);
}
.wn-empty.on{display:block}

.wn-foot{margin:40px 0 0;padding:20px 0;text-align:center;font-size:.78rem;color:var(--muted,#9aa3af);border-top:1px solid var(--line,rgba(0,0,0,.07))}
.wn-foot a{color:var(--accent,#1e7a4c)}

@media (max-width:760px){
  /* 窄屏工具槽在页头右上角，给标题留出 56px，工具钮不会压到文字 */
  .wn-hero-txt{padding-right:56px}
}
@media (max-width:600px){
  /* ---------- 工具坞 ---------- */
  /* ① 开关固定在右下角：dock-kit 的 .dk 是 flex column、DOM 顺序 toggle→items，
        展开时按钮列排在开关**下面**，坞整体变高，开关就被顶到上面 156px ——
        「点开的那个位置」上已经不是按钮了，看着就是位置不对。
        改成 column-reverse：开关恒定在右下角，按钮列向上生长。 */
  .dk{flex-direction:column-reverse !important}

  /* ② 坞固定在右下角，不做避让。
        dock-kit 的避让（place/overlapsFixed）把 sticky 元素当固定浮层，
        而 sticky 的 rect 是「当前滚动位置」下的实际位置：
        未滚动时 .wn-bar 躺在文档中间（top≈388），展开后的坞顶（495）只擦到 3px，
        却被连续避让 6 次（每次 52px），坞被推到屏幕中间 183px —— 
        这就是「程序坞点开之后位置不太对」的真正原因。
        本页唯一的 sticky 是顶部吸顶搜索条，吸顶后位于 0~110，
        与右下角的坞本来就不冲突，所以这里直接钉死坞的 bottom。 */
  .dk.dk-bottom{bottom:calc(18px + env(safe-area-inset-bottom)) !important}
}
@media (max-width:560px){
  .wn-wrap{padding:0 13px}
  .wn-grid{grid-template-columns:1fr 1fr;gap:8px}
  .wn-item{padding:9px 10px;gap:9px}
  .wn-ic{flex:0 0 30px;width:30px;height:30px;border-radius:9px;font-size:.84rem}
  .wn-txt b{font-size:.82rem}
  .wn-txt i{display:none}
  .wn-go{display:none}
  .wn-src{padding:14px}
  .wn-src-n{display:none}
}
</style>

  var SRC_NAME = { tw: '工具哇', jy: '菜鸟工具' };
  var HUES = [0,47,94,141,188,235,282,329,16,63,110,157,204,251,298,345,32,79,126,173,220,267,314,1];

  var input = document.getElementById('wnQ');
  var clearBtn = document.getElementById('wnClear');
  var chipsBox = document.getElementById('wnChips');
  var list = document.getElementById('wnList');
  var empty = document.getElementById('wnEmpty');

  var srcFilter = '';     /* '' | 'tw' | 'jy' */
  var catFilter = -1;     /* 分类索引，-1 = 全部 */
  var query = '';

  /* ---------- 每个分类一条记录，配好色相 ---------- */
  var recs = CATS.map(function (c, i) {
    return {
      src: c[0], name: c[1], items: c[2], hue: HUES[i] || 200,
      text: c[2].map(function (it) { return (it[0] + ' ' + (it[1] || '') + ' ' + c[1]).toLowerCase(); })
    };
  });

  /* ---------- 筛选条 ---------- */
  function buildChips() {
    var html = '<button class="chip on" data-kind="src" data-v="" style="--c:var(--accent,#1e7a4c)">全部来源</button>';
    html += '<button class="chip" data-kind="src" data-v="tw" data-s="tw"><span class="dot"></span>工具哇</button>';
    html += '<button class="chip" data-kind="src" data-v="jy" data-s="jy"><span class="dot"></span>菜鸟工具</button>';
    html += '<span style="flex:0 0 14px"></span>';
    recs.forEach(function (r, i) {
      html += '<button class="chip" data-kind="cat" data-v="' + i + '" data-s="' + r.src + '" style="--hue:hsl(' + r.hue + ' 62% 46%)">'
        + r.name + '<span class="n">' + r.items.length + '</span></button>';
    });
    chipsBox.innerHTML = html;
  }

  chipsBox.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    if (b.dataset.kind === 'src') {
      srcFilter = b.dataset.v;
      if (srcFilter && recs[catFilter] && recs[catFilter].src !== srcFilter) catFilter = -1;
    } else {
      var v = parseInt(b.dataset.v, 10);
      catFilter = (catFilter === v) ? -1 : v;
    }
    syncChips();
    render();
  });

  function syncChips() {
    Array.prototype.forEach.call(chipsBox.querySelectorAll('.chip'), function (b) {
      var on = b.dataset.kind === 'src'
        ? (b.dataset.v === srcFilter)
        : (parseInt(b.dataset.v, 10) === catFilter);
      b.classList.toggle('on', on);
    });
  }

  /* ---------- 渲染 ---------- */
  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function firstChar(s) {
    var t = (s || '').trim();
    if (!t) return '#';
    var m = t.match(/[\u4e00-\u9fa5]/);
    if (m) return m[0];
    return t.charAt(0).toUpperCase();
  }
  function card(it, hue) {
    if (!it || !it[2]) return '';
    var icon = it[3]
      ? '<img loading="lazy" src="' + esc(it[3]) + '" alt="" onload="this.dataset.ok=1" onerror="this.remove()">'
      : '';
    var sub = it[1] || String(it[2]).replace(/^https?:\/\//, '').replace(/^www\./, '');
    return '<a class="wn-item" style="--hue:hsl(' + hue + ' 62% 46%)" href="' + esc(it[2]) + '" target="_blank" rel="noopener noreferrer">'
      + '<span class="wn-ic">' + esc(firstChar(it[0])) + icon + '</span>'
      + '<span class="wn-txt"><b>' + esc(it[0]) + '</b><i>' + esc(sub) + '</i></span>'
      + '<span class="wn-go">›</span></a>';
  }

  function visible() {
    var out = [];
    recs.forEach(function (r, i) {
      if (srcFilter && r.src !== srcFilter) return;
      if (catFilter >= 0 && i !== catFilter) return;
      var items = r.items;
      if (query) {
        items = items.filter(function (it, k) { return r.text[k].indexOf(query) !== -1; });
      }
      if (!items.length) return;
      out.push({ r: r, items: items });
    });
    return out;
  }

  function render() {
    var groups = visible();
    list.innerHTML = '';
    if (!groups.length) {
      empty.classList.add('on');
      return;
    }
    empty.classList.remove('on');

    groups.forEach(function (g) {
      var sec = document.createElement('section');
      sec.className = 'wn-cat';
      sec.dataset.s = g.r.src;
      sec.style.setProperty('--hue', 'hsl(' + g.r.hue + ' 62% 46%)');
      var head = document.createElement('div');
      head.className = 'wn-cat-head';
      head.innerHTML = '<h2><span class="dot" style="background:hsl(' + g.r.hue + ' 62% 46%)"></span>'
        + esc(g.r.name) + '</h2>'
        + '<span class="src">' + SRC_NAME[g.r.src] + '</span>'
        + '<span class="n">' + g.items.length + ' 个</span>';
      sec.appendChild(head);

      var grid = document.createElement('div');
      grid.className = 'wn-grid';
      grid.innerHTML = g.items.map(function (it) { return card(it, g.r.hue); }).join('');
      sec.appendChild(grid);
      list.appendChild(sec);
    });
  }

  /* ---------- 搜索 ---------- */
  var timer = null;
  input.addEventListener('input', function () {
    clearBtn.classList.toggle('on', !!input.value);
    clearTimeout(timer);
    timer = setTimeout(function () {
      query = input.value.trim().toLowerCase();
      render();
    }, 120);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { input.value = ''; query = ''; clearBtn.classList.remove('on'); render(); }
  });
  clearBtn.addEventListener('click', function () {
    input.value = ''; query = ''; clearBtn.classList.remove('on'); render(); input.focus();
  });

  buildChips();
  render();

  /* Ctrl/⌘ + K 聚焦搜索 */
  document.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey) || (e.key !== 'k' && e.key !== 'K')) return;
    e.preventDefault(); input.focus(); input.select();
  });
})();
</script>
