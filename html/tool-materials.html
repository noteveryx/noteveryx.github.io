<style>
/* ---------------- 素材卡片 ---------------- */
.ms-video {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #0b0d16;
  border-radius: 12px;
  overflow: hidden;
}
.ms-video > video {
  width: 100%;
  height: 100%;
  display: block;
  background: #0b0d16;
}
.ms-play {
  position: absolute;
  inset: 0;
  margin: auto;
  width: 62px;
  height: 62px;
  border: none;
  border-radius: 50%;
  background: rgba(20, 22, 34, .62);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  color: #fff;
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .14s ease, background-color .2s;
}
.ms-play:hover { transform: scale(1.06); background: rgba(20, 22, 34, .78); }
.ms-state {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 8px 12px;
  font-size: 11.5px;
  color: #fff;
  background: linear-gradient(to top, rgba(0, 0, 0, .62), rgba(0, 0, 0, 0));
  pointer-events: none;
}
.ms-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.ms-name {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ms-meta { font-size: 11.5px; color: var(--muted); }

/* ---------------- 图片网格 ---------------- */
.ms-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
  gap: 10px;
}
.ms-cell {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  overflow: hidden;
  background: var(--bg1);
  border: 1px solid var(--line);
  cursor: pointer;
}
.ms-cell > img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.ms-cell .ms-cap {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 16px 8px 6px;
  font-size: 11px;
  color: #fff;
  background: linear-gradient(to top, rgba(0, 0, 0, .68), rgba(0, 0, 0, 0));
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ms-act {
  position: absolute;
  top: 6px;
  right: 6px;
  display: flex;
  gap: 5px;
}
.ms-act button {
  width: 27px;
  height: 27px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, .3);
  background: rgba(14, 16, 26, .58);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  color: #fff;
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
}
.ms-act button:active { transform: scale(.92); }
/* 桌面端悬浮才显示按钮，手机没有 hover，常驻才点得到 */
@media (hover: hover) {
  .ms-act { opacity: 0; transition: opacity .16s ease; }
  .ms-cell:hover .ms-act, .ms-cell:focus-within .ms-act { opacity: 1; }
}

/* ---------------- 大图预览 ---------------- */
.ms-light {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: rgba(6, 8, 14, .88);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  cursor: zoom-out;
}
.ms-light img {
  max-width: 100%;
  max-height: 100%;
  border-radius: 10px;
  box-shadow: 0 24px 70px rgba(0, 0, 0, .6);
}
.ms-light .ms-close {
  position: absolute;
  top: 14px;
  right: 16px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, .3);
  background: rgba(14, 16, 26, .6);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
}
.ms-empty {
  padding: 40px 16px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}
/* 内置视频：外层已经有卡片了，这里只负责排版 */
.ms-video-card { margin-bottom: 0; }

/* ---------------- 串行加载：总进度条 ----------------
   12 张图一次只放一张出去，加完再放下一张 —— 进度条一格一格地涨。
   轨道 → 渐变填充 + 内部流光条纹 + 跟着进度走的光点，数字用补间平滑跳。 */
.ms-prog {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 2px 0 12px;
  max-height: 40px;
  transition: opacity .45s ease, max-height .45s ease, margin .45s ease;
}
.ms-prog.gone {
  opacity: 0;
  max-height: 0;
  margin-top: 0;
  margin-bottom: 0;
  overflow: hidden;
}
.ms-prog-track {
  position: relative;
  flex: 1;
  min-width: 0;
  height: 8px;
  border-radius: 999px;
  background: var(--bg1);
  border: 1px solid var(--line);
}
.ms-prog-fill {
  position: absolute;
  inset: 0;
  border-radius: 999px;
  transform: scaleX(0);
  transform-origin: left center;
  overflow: hidden;
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent2)));
  box-shadow: 0 0 12px -2px var(--accent-ghost-line);
  transition: transform .45s cubic-bezier(.2, .8, .25, 1), background .3s ease;
}
/* 填充条里斜着扫过的流光 */
.ms-prog-fill::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: linear-gradient(115deg, transparent 22%, rgba(255, 255, 255, .5) 50%, transparent 78%);
  background-size: 220% 100%;
  animation: ms-flow 1.1s linear infinite;
}
@keyframes ms-flow {
  from { background-position: 180% 0; }
  to { background-position: -80% 0; }
}
/* 跟着进度走的光点 */
.ms-prog-dot {
  position: absolute;
  top: 50%;
  left: 0;
  width: 14px;
  height: 14px;
  margin-left: -7px;
  border-radius: 50%;
  background: var(--card);
  border: 3px solid var(--accent);
  box-shadow: 0 0 0 4px var(--accent-ghost-bg), 0 0 14px var(--accent-ghost-line);
  opacity: 0;
  transform: translateY(-50%) scale(.55);
  transition: left .45s cubic-bezier(.2, .8, .25, 1), opacity .3s ease, transform .3s ease;
}
.ms-prog.live .ms-prog-dot {
  opacity: 1;
  transform: translateY(-50%) scale(1);
}
.ms-prog-text {
  flex: 0 0 auto;
  min-width: 118px;
  text-align: right;
  font: 700 11.5px/1.4 ui-monospace, Menlo, Consolas, monospace;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.ms-prog.done .ms-prog-fill {
  background: linear-gradient(90deg, #16a34a, #22c55e);
  box-shadow: 0 0 14px -2px rgba(34, 197, 94, .6);
}
.ms-prog.done .ms-prog-dot {
  border-color: #16a34a;
  box-shadow: 0 0 0 4px rgba(34, 197, 94, .16), 0 0 14px rgba(34, 197, 94, .55);
}
.ms-prog.done .ms-prog-text { color: #16a34a; }

/* ---------------- 骨架屏 + 入场 ----------------
   没加载完的格子显示一道来回扫的微光；图片到位后淡入并轻微放大收住。 */
.ms-cell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  /* 两层：上面是扫过的微光，下面是占位底色。
     只留微光的话，浅色主题下底色和页面背景一样，
     未加载的格子看着就是一片空白（分不清「在加载」和「没图」）。 */
  background:
    linear-gradient(100deg, transparent 18%, rgba(255, 255, 255, .22) 48%, transparent 78%),
    var(--bg1);
  background-size: 220% 100%;
  animation: ms-shimmer 1.5s linear infinite;
  opacity: 1;
  transition: opacity .35s ease;
}
.ms-cell.ready::before {
  opacity: 0;
  animation: none;
}
@keyframes ms-shimmer {
  from { background-position: 160% 0; }
  to { background-position: -60% 0; }
}
.ms-cell > img {
  opacity: 0;
  transform: scale(1.05);
  transition: opacity .5s ease, transform .7s cubic-bezier(.2, .8, .25, 1);
}
.ms-cell.ready > img {
  opacity: 1;
  transform: none;
}
/* 加载失败的格子：img 已经被脚本藏掉了，这里补一个占位，
   别让浏览器自带的破图图标露出来 */
.ms-cell.failed::after {
  content: "⚠";
  position: absolute;
  inset: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 11px;
  background: var(--bg1);
}
/* 图片到位时整格弹一下 */
.ms-cell.pop {
  animation: ms-pop .55s cubic-bezier(.2, .9, .3, 1.15);
}
@keyframes ms-pop {
  from { opacity: 0; transform: translateY(12px) scale(.86); }
  to { opacity: 1; transform: none; }
}
/* 骨架扫光要盖在图上、但不能盖住底部标题和角标按钮 */
.ms-cell > .ms-cap,
.ms-cell > .ms-act { z-index: 2; }

/* 窄屏：进度条和读数挤在一行会把数字压扁，改成上下两行 */
@media (max-width: 520px) {
  .ms-prog {
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
  }
  .ms-prog-text {
    text-align: left;
    min-width: 0;
  }
}

/* 系统开了「减少动效」就只留进度，不做流动和弹入 */
@media (prefers-reduced-motion: reduce) {
  .ms-prog-fill::after,
  .ms-cell::before { animation: none; }
  .ms-cell.pop { animation: none; }
  .ms-cell > img,
  .ms-prog-fill,
  .ms-prog-dot,
  .ms-prog { transition: none; }
}
</style>

<script>
(function () {
  'use strict';
  var el = function () { return ToolBox.el.apply(null, arguments); };
  var STORE_KEY = 'tb_materials';

  /* ---------------- 数据 ---------------- */
  function blank() { return { videos: [], images: [] }; }
  function load() {
    try {
      var d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (d && Array.isArray(d.videos) && Array.isArray(d.images)) return d;
    } catch (e) { }
    return blank();
  }
  var data = load();
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) { }
  }

  /* ---------------- 内置素材 ----------------
     来自 basic_app 的「我的素材」页（sytalentsystem / xoll/Wl），
     直接写死一份：打开页面就能看到，不用先粘贴链接。
     只读展示，不进 localStorage —— 用户自己加的列表和内置素材分开。
     视频地址统一改成 https（原来那条是 http，https 页面里会被浏览器按混合内容拦掉）。 */
  var BUILTIN = {
    images: [
      { name: '素材 1', url: 'https://xoss.shengshitong.com/sytalentsystem/xoll/Wl/c12ed6a291cd4aef8f9ee56b8d9e0336.jpg?Expires=17897248110&OSSAccessKeyId=tTPeUWQpanCDiu1a&Signature=LAKlHr%2FrF3yeRjm0X%2BPFanMykS0%3D' },
      { name: '素材 2', url: 'https://xoss.shengshitong.com/sytalentsystem/xoll/Wl/4f7a340dddb54a81bd4719ea7858dabc.jpg?Expires=17897248131&OSSAccessKeyId=tTPeUWQpanCDiu1a&Signature=DdXTiiE%2FvdzhXrW1trOa6z%2Bgw%2BE%3D' },
      { name: '素材 3', url: 'https://xoss.shengshitong.com/sytalentsystem/xoll/Wl/17aa028014ce494b9d915dea648be224.jpg?Expires=17897248145&OSSAccessKeyId=tTPeUWQpanCDiu1a&Signature=qXD2VtP5A671aFWnx5uFmj8rAUw%3D' },
      { name: '素材 4', url: 'https://xoss.shengshitong.com/sytalentsystem/xoll/Wl/f4c336e0dcc348189e7f77d2ad4f9e04.jpg?Expires=17897248161&OSSAccessKeyId=tTPeUWQpanCDiu1a&Signature=uGfKlp18waDKNgEeOA2ZbNV4JBc%3D' },
      { name: '素材 5', url: 'https://xoss.shengshitong.com/sytalentsystem/xoll/Wl/0103d312e9c84a9e964370b97065956f.jpg?Expires=17897248178&OSSAccessKeyId=tTPeUWQpanCDiu1a&Signature=hdRu7RFZDtItCrRTZdFmEHDQOiI%3D' },
      { name: '素材 6', url: 'https://xoss.shengshitong.com/sytalentsystem/xoll/Wl/751892567fee48358dff2b680d43fc8e.jpg?Expires=17897248193&OSSAccessKeyId=tTPeUWQpanCDiu1a&Signature=hHbLtcAZB3Llhld0lylwkDbv8eM%3D' },
      { name: '素材 7', url: 'https://xoss.shengshitong.com/sytalentsystem/xoll/Wl/2363a9ffb9fe4e7db740c974cd5521ad.jpg?Expires=17897248210&OSSAccessKeyId=tTPeUWQpanCDiu1a&Signature=CR5HkpJgERD5EnF7UeUX5drVxUo%3D' },
      { name: '素材 8', url: 'https://xoss.shengshitong.com/sytalentsystem/xoll/Wl/70651bf0fd9a4d799f5db67646683550.jpg?Expires=17897248226&OSSAccessKeyId=tTPeUWQpanCDiu1a&Signature=vyFaFMdsD0WGj%2FTyjBTYdsVO%2BxQ%3D' },
      { name: '素材 9', url: 'https://xoss.shengshitong.com/sytalentsystem/xoll/Wl/0976f941a633468ea6882db20c8b11d8.jpg?Expires=17897248242&OSSAccessKeyId=tTPeUWQpanCDiu1a&Signature=RbftmlcdRLTlCAZZ1hp%2FT7gy%2FzQ%3D' },
      { name: '素材 10', url: 'https://xoss.shengshitong.com/sytalentsystem/xoll/Wl/0f7550e84e57479b8d90ebdb8a8709e2.jpg?Expires=17897248303&OSSAccessKeyId=tTPeUWQpanCDiu1a&Signature=LrBfPIhKlZ%2FpV7hqsVOP9jct%2FNE%3D' },
      { name: '素材 11', url: 'https://xoss.shengshitong.com/sytalentsystem/xoll/Wl/2e55fb5c6b574a6fb33e4b980cd8f4dc.jpg?Expires=17897248318&OSSAccessKeyId=tTPeUWQpanCDiu1a&Signature=LwzGe0Uo4cHcSnl6dS0z9ELANjU%3D' },
      { name: '素材 12', url: 'https://xoss.shengshitong.com/sytalentsystem/xoll/Wl/e0707b08dd6e4b15bdf8c4bb5a556069.jpg?Expires=17898746790&OSSAccessKeyId=tTPeUWQpanCDiu1a&Signature=%2B0x%2FcpdyrTGjD1mpK7fkBGKkrqw%3D' }
    ],
    videos: [
      {
        name: '视频素材 1',
        url: 'https://xoss.shengshitong.com/bizlicense/house/Wl/bfea75fc258647f8b9d622f17c7b949c.mp4?Expires=17899812372&OSSAccessKeyId=pF8xeN6gBdseylbD&Signature=%2Fy6fRl5KQRhWOGnF9DC%2FAcl3qcQ%3D'
      }
    ]
  };

  /* 按扩展名猜类型：图片扩展名 → 图片，视频扩展名 → 视频，
     认不出来（无扩展名、带签名参数的地址）按视频算 —— 这页主要就是放 m3u8 的，
     真放错了可以在「类型」里手动指定 */
  function kindOf(url) {
    var u = url.split('?')[0].split('#')[0].toLowerCase();
    if (/\.(jpe?g|png|gif|webp|avif|bmp|svg)$/.test(u)) return 'image';
    return 'video';
  }
  /* mode: auto | video | image */
  function resolveKind(url, mode) {
    if (mode === 'video') return 'video';
    if (mode === 'image') return 'image';
    return kindOf(url);
  }

  /* 统一添加：分类、去重、落库。返回本次新增的条目（分开给两个列表增量渲染用） */
  function addUrls(text, mode) {
    var lines = String(text || '').split(/[\n\r]+/).map(function (s) { return s.trim(); })
      .filter(function (s) { return s && /^https?:\/\//i.test(s); });
    var out = { videos: [], images: [] };
    if (!lines.length) { ToolBox.toast('请先粘贴至少一个 http(s) 链接'); return out; }
    lines.forEach(function (u) {
      var kind = resolveKind(u, mode);
      if (kind === 'image') {
        if (!data.images.some(function (x) { return x.url === u; })) {
          var im = { url: u, name: nameOf(u, '图片', data.images.length) };
          data.images.push(im);
          out.images.push(im);
        }
      } else {
        if (!data.videos.some(function (x) { return x.url === u; })) {
          var vd = { url: u, name: nameOf(u, '视频', data.videos.length), duration: '' };
          data.videos.push(vd);
          out.videos.push(vd);
        }
      }
    });
    save();
    return out;
  }

  /* 两个列表的刷新函数：切标签页时用得上 */
  var refresh = { video: null, image: null };

  function nameOf(url, prefix, idx) {
    var clean = url.split('?')[0].split('#')[0];
    var last = clean.split('/').pop() || '';
    last = decodeURIComponent(last).replace(/\.[a-z0-9]+$/i, '');
    /* 光秃秃的数字（如 .../240/240）没什么信息量，换成「图片 3」这种 */
    if (!last || /^\d+$/.test(last) || last.length < 2) last = '';
    /* OSS 上那种一串哈希文件名（uuid）当标题没意义 */
    if (/^[0-9a-f]{16,}$/i.test(last)) last = '';
    return last || (prefix + ' ' + (idx + 1));
  }
  function fmtTime(sec) {
    if (!sec || !isFinite(sec)) return '';
    var s = Math.round(sec);
    var m = Math.floor(s / 60);
    var h = Math.floor(m / 60);
    s = s % 60;
    return h ? h + ':' + String(m % 60).padStart(2, '0') + ':' + String(s).padStart(2, '0')
      : m + ':' + String(s).padStart(2, '0');
  }

  /* ---------------- 通用动作 ---------------- */
  function downloadRemote(url, filename) {
    fetch(url, { mode: 'cors' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.blob();
    }).then(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
      ToolBox.toast('已开始下载');
    }).catch(function () {
      /* 源站不允许跨域时，浏览器会忽略 download 属性，只能退回新窗口 */
      window.open(url, '_blank', 'noopener');
      ToolBox.toast('源站不允许跨域下载，已在新标签打开');
    });
  }

  function copyLink(url) {
    ToolBox.copy(url);
    ToolBox.toast('链接已复制');
  }

  /* ---------------- m3u8 播放 ---------------- */
  var hlsList = [];
  function attachVideo(video, url, onState) {
    var isHls = /\.m3u8(\?|#|$)/i.test(url);
    /* Safari 原生就能播 m3u8，不需要 hls.js */
    if (isHls && video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      onState('原生播放中');
      return null;
    }
    if (!isHls) {
      video.src = url;
      onState('');
      return null;
    }
    if (!window.Hls || !window.Hls.isSupported()) {
      onState('当前浏览器不支持 m3u8 播放，可点「新窗口」用外部播放器打开');
      return null;
    }
    var hls = new window.Hls({ enableWorker: true, lowLatencyMode: false });
    hlsList.push(hls);
    hls.on(window.Hls.Events.ERROR, function (e, data) {
      if (!data || !data.fatal) return;
      if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR) {
        onState('加载失败：多半是源站跨域（CORS）不允许');
      } else if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) {
        onState('解码失败，尝试恢复中…');
        hls.recoverMediaError();
      } else {
        onState('播放失败：' + (data.details || '未知错误'));
      }
    });
    hls.loadSource(url);
    hls.attachMedia(video);
    onState('加载中…');
    return hls;
  }
  /* 只销毁「已经不在页面里」的播放器上的 hls：
     重建列表时，正在播的那条会被换掉（该销毁），
     但增量添加新卡片不该打断已在播的视频 */
  function destroyHls() {
    hlsList = hlsList.filter(function (h) {
      var media = h && h.media;
      if (media && media.isConnected) return true;
      try { h.destroy(); } catch (e) { }
      return false;
    });
  }

  function videoCard(item, onChange, builtin) {

    var card = el('div', {

    video.addEventListener('loadedmetadata', function () {
      item.duration = fmtTime(video.duration);

    });

    play.addEventListener('click', function () {
      play.style.display = 'none';

    });

    var row = el('div', { class: 'ms-row' });

        save();
        onChange();
      });

  /* ---------------- 串行加载器 ----------------
     一次只放一张图出去，等它 load/error 之后再放下一张。
     十几张图一起塞进浏览器会互相抢带宽，进度条也是一下冲到头看不出过程；
     串行之后才是一格一格地涨。
     job 回调里才去设 img.src，release 用来放行队列。 */
  var IMG_GAP = 300;   /* 每张之间的节奏间隔（毫秒） */
  function serialLoader(budgetMs, gapMs) {
    var q = [], busy = false, waiting = false;
    var startedAt = 0, gapWaited = 0, lastEnd = 0;
    budgetMs = budgetMs || 20000;
    gapMs = gapMs || IMG_GAP;
    function pump() {
      if (busy || waiting || !q.length) return;
      /* 每张之间留一点间隔。
         一来「一张一张来」才看得见 —— 命中缓存或图本来就很小的时候，
         十几张几乎一瞬间就完事，进度条直冲 100%，整个过程根本看不见；
         二来给补间留出跑完的时间，进度条才是一级一级往上爬，
         而不是一口气冲到头。
         间隔不够时**不要动队列** —— 让 job 留在队里，等间隔到了再来取。
         （早先写的是「先 shift 取出来、再判断间隔」，落在间隔等待里的那个 job
           既没执行也没放回去，就凭空丢了：十二张里有六张被丢掉，
           页面就成了「隔一张显示一张」。） */
      var wait = gapMs - (Date.now() - lastEnd);
      if (wait > 0) {
        waiting = true;
        var gapStart = Date.now();
        setTimeout(function () {
          waiting = false;
          gapWaited += Date.now() - gapStart;
          pump();
        }, wait);
        return;
      }
      var job = q.shift();
      if (!job) return;
      /* 整体预算到了就不再一张一张地等，剩下的图一次性放行。
         串行的本意是「别让十几张图互相抢带宽、进度条一格一格地涨」，
         可真碰上慢网，等十几张轮完就太久了 —— 宁可晚点全出来，也别一直卡着。
         预算只算真正下载的时间：上面那段人为的间隔等待不算在内，
         否则慢网下光间隔就把预算耗光了，节奏全乱。 */
      if (startedAt && Date.now() - startedAt - gapWaited > budgetMs) {
        var rest = q.splice(0, q.length);
        rest.forEach(function (j) { try { j(function () { }); } catch (e) { } });
        q = [];
        job(function () { });
        return;
      }
      busy = true;
      var released = false;
      function release() {
        if (released) return;
        released = true;
        busy = false;
        lastEnd = Date.now();
        pump();
      }
      job(release);
    }
    return {
      push: function (job) {
        /* 空队列 → 视为新一轮，重新起算 */
        if (!busy && !q.length && !waiting) { startedAt = Date.now(); gapWaited = 0; }
        q.push(job);
        pump();
      }
    };
  }

  /* ---------------- 总进度条 ----------------
     填充条用 scaleX 推进，光点跟着进度走，右边是「3 / 12 · 25%」。
     百分比用补间平滑逼近目标值，不是一格一格地硬跳。 */
  function progressBar() {
    var node = el('div', {
      class: 'ms-prog', role: 'progressbar',
      'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': '0'
    });
    var track = el('div', { class: 'ms-prog-track' });
    var fill = el('div', { class: 'ms-prog-fill' });
    var dot = el('div', { class: 'ms-prog-dot' });
    var text = el('div', { class: 'ms-prog-text', text: '准备中…' });
    track.appendChild(fill);
    track.appendChild(dot);
    node.appendChild(track);
    node.appendChild(text);

    var shown = 0, target = 0, raf = 0;
    var total = 0, done = 0, failed = 0, finished = false;

    function paint() {
      fill.style.transform = 'scaleX(' + shown + ')';
      dot.style.left = (shown * 100) + '%';
      node.setAttribute('aria-valuenow', String(Math.round(shown * 100)));
      if (finished) return;
      text.textContent = done + ' / ' + total + '  ·  ' + Math.round(shown * 100) + '%';
    }
    function tick() {
      raf = 0;
      var d = target - shown;
      if (Math.abs(d) < .002) { shown = target; paint(); return; }
      shown += d * .2;
      paint();
      raf = requestAnimationFrame(tick);
    }
    function set(p) {
      target = Math.max(0, Math.min(1, p));
      if (!raf) raf = requestAnimationFrame(tick);
    }
    function finish() {
      finished = true;
      node.classList.add('done');
      node.classList.remove('live');
      /* 精确落到 100%：补间的最后几帧不一定跑得完
         （页面转后台、标签页被冻结、截图工具的虚拟时间预算耗尽都会打断 rAF），
         进度条停在 96% 上很显眼，这里直接定死。 */
      shown = 1;
      target = 1;
      paint();
      text.textContent = failed
        ? '✓ ' + (total - failed) + ' 张已就绪 · ' + failed + ' 张失败'
        : '✓ ' + total + ' 张已就绪';
      /* 报完喜就收起来，把版面还给素材本身 */
      setTimeout(function () { node.classList.add('gone'); }, 2400);
    }
    return {
      node: node,
      /* 开跑：清掉上一轮的状态，重新计数 */
      start: function (n) {
        total = n; done = 0; failed = 0; finished = false;
        shown = 0; target = 0;
        node.classList.remove('done', 'gone');
        node.classList.add('live');
        paint();
        text.textContent = '0 / ' + total + '  ·  0%';
      },
      /* 增量添加时把总数补上。
         上一轮如果已经收工（进度条收起、置灰），这一轮又来新图，
         得把它重新唤醒并从「已完成的那几格」接着往下走，
         不然进度会从 100% 突然掉回去。 */
      extend: function (n) {
        total += n;
        if (finished) {
          finished = false;
          node.classList.remove('done', 'gone');
          node.classList.add('live');
          shown = target = total ? done / total : 0;
          paint();
        }
      },
      /* 一张落地（成功失败都算，占掉一格） */
      step: function (ok) {
        done++;
        if (!ok) failed++;
        set(total ? done / total : 1);
        /* 立刻同步一次：分子（几 / 几）是真实进度，不能押在 rAF 上 ——
           标签页切到后台时 rAF 会停，进度条会僵在那儿不认账。
           百分比仍由补间平滑追赶，两边各管各的。 */
        paint();
        if (total && done >= total) finish();
      }
    };
  }

  /* ---------------- 图片素材 ---------------- */

  function renderImages(panel) {
    var box = addBox('每行一个图片链接，例如：\nhttps://example.com/cover.jpg',
      '图片直接引用远程地址，不会上传本地文件；点缩略图可看大图。');
    panel.appendChild(box.card);

    var listCard = el('div', { class: 'tb-card' });
    var listBody = el('div', { class: 'tb-col' });
    listCard.appendChild(listBody);
    panel.appendChild(listCard);

    box.btnAdd.addEventListener('click', function () {
      var r = addUrls(box.ta.value, box.typeSel.value);
      var n = r.videos.length + r.images.length;
      if (!n) return;
      box.ta.value = '';
      ToolBox.toast('已添加 ' + n + ' 条');
      appendImages(r.images);
      if (refresh.video) refresh.video();
    });
    box.btnClear.addEventListener('click', function () {
      if (!data.videos.length && !data.images.length) { ToolBox.toast('列表本来就是空的'); return; }
      data = blank();
      save();
      renderList();
      if (refresh.video) refresh.video();
      ToolBox.toast('已清空');
    });

    var titleEl = el('div', { class: 'tb-card-title' });
    var grid = el('div', { class: 'ms-grid' });
    var prog = null;    /* 用户自己的列表：空的时候不显示进度条 */
    var queue = null;   /* 整个列表共用一条串行队列 */
    function updateTitle() { titleEl.textContent = '图片素材（' + data.images.length + '）'; }

    function renderList() {
      listBody.innerHTML = '';
      listBody.appendChild(titleEl);
      updateTitle();
      if (!data.images.length) {
        listBody.appendChild(el('div', { class: 'ms-empty', text: '还没有图片素材，粘贴一个图片链接试试' }));
        prog = null;
        queue = null;
        return;
      }
      grid.innerHTML = '';
      /* 列表重建就换一条新队列：老队列里还挂着旧卡片的 job，
         那些卡片已经不在页面里了，队列会一直等下去 */
      queue = serialLoader();
      prog = progressBar();
      listBody.appendChild(prog.node);
      prog.start(data.images.length);
      /* 局部抓一份：旧卡片晚到的 load 事件只能影响它自己那条进度条 */
      var myQueue = queue, myProg = prog;
      data.images.forEach(function (item) {
        grid.appendChild(imageCell(item, renderList, null, {
          queue: myQueue,
          onSettled: function (ok) { myProg.step(ok); }
        }));
      });
      listBody.appendChild(grid);
    }
    /* 增量添加：已经加载好的不动，新来的接着往下排 */
    function appendImages(items) {
      updateTitle();
      if (!items.length) return;
      if (!queue) { renderList(); return; }   /* 之前是空列表，整个重画 */
      var empty = listBody.querySelector('.ms-empty');
      if (empty) empty.parentNode.removeChild(empty);
      if (!grid.parentNode) listBody.appendChild(grid);
      prog.extend(items.length);
      var myProg = prog;
      items.forEach(function (item) {
        grid.appendChild(imageCell(item, renderList, null, {
          queue: queue,
          onSettled: function (ok) { myProg.step(ok); }
        }));
      });
    }
    refresh.image = renderList;
    renderList();
    panel.appendChild(builtinImagesPanel());
  }

  function imageCell(item, onChange, builtin, opt) {
    opt = opt || {};
    var cell = el('div', { class: 'ms-cell' });
    /* src 不在这里设：走串行队列的话要等轮到它才发请求，
       免得十几张图一上来就互相抢带宽 */
    var img = el('img', { alt: item.name, referrerpolicy: 'no-referrer', decoding: 'async' });
    cell.appendChild(img);
    var cap = el('div', { class: 'ms-cap', text: item.name });
    cell.appendChild(cap);

    var act = el('div', { class: 'ms-act' });
    var bView = el('button', { type: 'button', title: '看大图', 'aria-label': '看大图' });
    bView.textContent = '👁';
    var bDl = el('button', { type: 'button', title: '下载', 'aria-label': '下载' });
    bDl.textContent = '⬇';
    bView.addEventListener('click', function (e) { e.stopPropagation(); openLight(item.url, item.name); });
    bDl.addEventListener('click', function (e) {
      e.stopPropagation();
      downloadRemote(item.url, item.name + '.jpg');
    });
    act.appendChild(bView);
    act.appendChild(bDl);
    if (!builtin) {
      var bDel = el('button', { type: 'button', title: '删除', 'aria-label': '删除' });
      bDel.textContent = '✕';
      bDel.addEventListener('click', function (e) {
        e.stopPropagation();
        data.images = data.images.filter(function (x) { return x.url !== item.url; });
        save();
        onChange();
      });
      act.appendChild(bDel);
    }
    cell.appendChild(act);

    /* 落地（成功或失败）统一在这儿收口：骨架光撤掉、格子弹一下、进度走一格 */
    var settled = false;
    function settle(ok) {
      if (settled) return;
      settled = true;
      cell.classList.add('ready');
      cell.classList.add('pop');
      if (!ok) {
        /* 加载失败时把 img 藏掉：留着会露出浏览器自带的破图图标，很难看 */
        img.style.display = 'none';
        cell.classList.add('failed');
        cap.textContent = item.name + ' · 加载失败';
      }
      if (opt.onSettled) opt.onSettled(ok);
    }

    if (opt.queue) {
      opt.queue.push(function (release) {
        var released = false;
        function releaseOnce() { if (!released) { released = true; release(); } }
        img.addEventListener('load', function () { settle(true); releaseOnce(); }, { once: true });
        img.addEventListener('error', function () { settle(false); releaseOnce(); }, { once: true });
        /* 远程地址有可能挂住：8 秒没动静就先放行队列，
           免得后面的图永远轮不上。 */
        setTimeout(function () {
          releaseOnce();
          /* 这一格也必须收尾。
             以前只放行队列不收尾 —— 图挂住的那一格会永远停在骨架屏上，
             图片的 opacity 一直是 0，看上去就是一个空白格子（「隔一张显示一张」）。
             这里判成超时，给个明确的样子；图要是随后才到，
             load 事件会把它救回来重新显示。 */
          if (!settled) {
            settled = true;
            cell.classList.add('ready');
            cell.classList.add('pop');
            cell.classList.add('failed');
            cap.textContent = item.name + ' · 加载超时';
            /* img 不藏：迟到的图还能直接显示出来（撤掉失败态即可） */
            img.addEventListener('load', function () {
              img.style.display = '';
              cell.classList.remove('failed');
              cap.textContent = item.name;
            }, { once: true });
            /* 迟到的失败：把 img 藏掉，别露破图图标 */
            img.addEventListener('error', function () {
              img.style.display = 'none';
            }, { once: true });
            if (opt.onSettled) opt.onSettled(false);
          }
        }, 8000);
        img.src = item.url;
      });
    } else {
      img.addEventListener('load', function () { settle(true); }, { once: true });
      img.addEventListener('error', function () { settle(false); }, { once: true });
      img.loading = 'lazy';
      img.src = item.url;
    }

    cell.addEventListener('click', function () { openLight(item.url, item.name); });
    return cell;
  }

  /* ---------------- 内置素材区块 ----------------
     写死的那批素材，只读展示：可以看大图、复制、下载、也可以一键收进「我的素材」。 */
  function builtinImagesPanel() {
    var card = el('div', { class: 'tb-card' });
    var head = el('div', { class: 'tb-row' });
    var title = el('div', { class: 'tb-card-title', text: '内置素材（' + BUILTIN.images.length + '）', style: 'flex:1' });
    var bAll = el('button', { class: 'tb-btn sm', type: 'button', text: '全部加入我的素材' });
    head.appendChild(title);
    head.appendChild(bAll);
    card.appendChild(head);
    card.appendChild(el('p', {
      class: 'tb-hint',
      text: '来自 basic_app「我的素材」页的那批图，写死在内置里，不占你的素材列表；点缩略图看大图。'
    }));
    var grid = el('div', { class: 'ms-grid', style: 'margin-top:12px' });
    /* 这 12 张走串行队列：一张一张来，进度条一格一格地涨 */
    var prog = progressBar();
    card.appendChild(prog.node);
    var queue = serialLoader();
    var myProg = prog;
    prog.start(BUILTIN.images.length);
    BUILTIN.images.forEach(function (item) {
      grid.appendChild(imageCell(item, null, true, {
        queue: queue,
        onSettled: function (ok) { myProg.step(ok); }
      }));
    });
    card.appendChild(grid);
    bAll.addEventListener('click', function () {
      var text = BUILTIN.images.map(function (x) { return x.url; }).join('\n');
      var r = addUrls(text, 'image');
      ToolBox.toast(r.images.length ? '已加入 ' + r.images.length + ' 张' : '这些已经在你的素材里了');
      if (refresh.image) refresh.image();
    });
    return card;
  }

  function builtinVideosPanel() {
    var card = el('div', { class: 'tb-card' });
    card.appendChild(el('div', { class: 'tb-card-title', text: '内置素材（' + BUILTIN.videos.length + '）' }));
    card.appendChild(el('p', {
      class: 'tb-hint',
      text: '内置的那条视频素材，点播放即可；地址已改成 https，https 页面里不会被当混合内容拦掉。'
    }));
    BUILTIN.videos.forEach(function (item) {
      card.appendChild(videoCard(item, null, true));
    });
    return card;
  }

  /* ---------------- 大图预览 ---------------- */
  function openLight(url, name) {
    var mask = el('div', { class: 'ms-light' });
    var img = el('img', { src: url, alt: name || '' });
    var close = el('button', { class: 'ms-close', type: 'button', 'aria-label': '关闭' });
    close.textContent = '✕';
    mask.appendChild(img);
    mask.appendChild(close);
    function shut() {
      document.removeEventListener('keydown', onKey);
      if (mask.parentNode) mask.parentNode.removeChild(mask);
    }
    function onKey(e) { if (e.key === 'Escape') shut(); }
    close.addEventListener('click', shut);
    mask.addEventListener('click', function (e) { if (e.target === mask) shut(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(mask);
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
  ToolBox.mount(document.getElementById('tbRoot'), {
      title: '素材库',
      sub: '粘贴 m3u8 / 图片链接，本地预览、复制、下载',
      storageKey: 'tb_materials_tab',
      tabs: [
        { id: 'video', name: '视频素材', render: renderVideos },
        { id: 'image', name: '图片素材', render: renderImages }
      ]
    });
    /* 切走标签页时把视频停掉，别在后台一直拉流；同时刷新这一页的列表 */
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (t && t.classList && t.classList.contains('tb-tab')) {
        var id = t.getAttribute('data-tab');
        setTimeout(function () {
          var vids = document.querySelectorAll('.ms-video video');
          Array.prototype.forEach.call(vids, function (v) { try { v.pause(); } catch (err) { } });
          if (refresh[id]) refresh[id]();
        }, 0);
      }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<div class="kb-tools kb-tools-float" data-kb-tools></div>
</body>
</html>
