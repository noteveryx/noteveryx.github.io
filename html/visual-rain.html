<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f18">
<link rel="icon" type="image/png" href="../assets/image/favicon-round.png">
<link rel="apple-touch-icon" href="../assets/image/logo.png">
<title>雨夜玻璃</title>
<link rel="stylesheet" href="../assets/css/palette-kit.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#0b0f18;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#fff;-webkit-font-smoothing:antialiased;cursor:crosshair;touch-action:none;
    user-select:none;-webkit-user-select:none;
  }
  canvas{position:fixed;inset:0;display:block;width:100%;height:100%;}
  .ui{position:fixed;z-index:5;opacity:1;transition:opacity .55s cubic-bezier(.3,.8,.3,1);}
  body.idle .ui{opacity:.15;}
  body.idle .ui:hover{opacity:1;}
  .back{
    top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));
    width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(12,16,24,.42);border:1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;text-decoration:none;
    transition:background-color .2s ease,transform .12s ease;
  }
  .back:hover{background:rgba(20,26,38,.7);}
  .back:active{transform:scale(.94);}
  .back svg{width:15px;height:15px;display:block;}
  .tools{right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;}
  .label{
    left:calc(18px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));
    font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.5);
    pointer-events:none;user-select:none;
  }
  .label b{font-weight:600;letter-spacing:.18em;color:rgba(255,255,255,.85);}
</style>
  <script src="../assets/js/fs-kit.js" defer></script>
</head>
<body>
<canvas id="cv"></canvas>

<a class="ui back" href="../x.html" title="返回" aria-label="返回">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</a>

<div class="ui tools">
  <div class="pk" id="pk" data-pk="rain" data-placement="left"></div>
</div>

<div class="ui label" id="label">Rain · <b>雨夜玻璃</b></div>

<script src="../assets/js/palette-kit.js"></script>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d', { alpha: false });
  var bgCv = document.createElement('canvas');   // 背景霓虹层（静态，只在尺寸/配色变化时重绘）
  var bgCtx = bgCv.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  var drops = [];       // 挂在玻璃上的水珠
  var runners = [];     // 下滑的水珠（带尾迹）
  var ripples = [];     // 敲击玻璃的涟漪
  var t = 0;

  var baseColor = '#5b7cfa';
  var derived = [];

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var running = false, rafId = 0, lastT = 0;

  /* ---------------- 配色 ---------------- */
  function setPalette(hex) {
    baseColor = hex;
    var rgb = window.PaletteKit.hex2rgb(hex) || { r: 91, g: 124, b: 250 };
    var hsl = window.PaletteKit.rgb2hsl(rgb.r, rgb.g, rgb.b);
    derived = [
      window.PaletteKit.hsl2rgb(hsl.h, Math.min(0.7, hsl.s), 0.55),      // 主霓虹
      window.PaletteKit.hsl2rgb((hsl.h + 40) % 360, Math.min(0.7, hsl.s), 0.5),
      window.PaletteKit.hsl2rgb((hsl.h + 320) % 360, Math.min(0.6, hsl.s * 0.9), 0.45),
      window.PaletteKit.hsl2rgb(hsl.h, Math.min(0.5, hsl.s * 0.7), 0.12)  // 底色
    ];
    paintBg();
    var lbl = document.getElementById('label');
    if (lbl) lbl.innerHTML = 'Rain · <b>' + hex.toUpperCase() + '</b>';
  }

  function paintBg() {
    var W2 = bgCv.width = Math.round(W * DPR);
    var H2 = bgCv.height = Math.round(H * DPR);
    bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var deep = derived[3];
    bgCtx.fillStyle = 'rgb(' + deep.r + ',' + deep.g + ',' + deep.b + ')';
    bgCtx.fillRect(0, 0, W, H);

    // 窗外霓虹光斑（模糊感靠多层低透明度径向渐变叠加）
    var lights = [
      { x: .22, y: .34, r: .42, c: derived[0] },
      { x: .74, y: .58, r: .38, c: derived[1] },
      { x: .48, y: .82, r: .34, c: derived[2] },
      { x: .88, y: .22, r: .28, c: derived[0] }
    ];
    bgCtx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < lights.length; i++) {
      var L = lights[i];
      var g = bgCtx.createRadialGradient(L.x * W, L.y * H, 0, L.x * W, L.y * H, L.r * W);
      g.addColorStop(0, 'rgba(' + L.c.r + ',' + L.c.g + ',' + L.c.b + ',.55)');
      g.addColorStop(0.5, 'rgba(' + L.c.r + ',' + L.c.g + ',' + L.c.b + ',.18)');
      g.addColorStop(1, 'rgba(' + L.c.r + ',' + L.c.g + ',' + L.c.b + ',0)');
      bgCtx.fillStyle = g;
      bgCtx.fillRect(0, 0, W, H);
    }
    bgCtx.globalCompositeOperation = 'source-over';
  }

  /* ---------------- 尺寸 ---------------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bgCv.width = cv.width; bgCv.height = cv.height;
    paintBg();
    seed();
    if (!running) render();
  }

  function seed() {
    drops.length = 0;
    runners.length = 0;
    var n = Math.round(Math.max(70, Math.min(170, (W * H) / 7000)));
    for (var i = 0; i < n; i++) {
      drops.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 1.4 + Math.random() * 3.4,
        sp: 0.12 + Math.random() * 0.5,
        wob: Math.random() * 6.28
      });
    }
  }

  /* ---------------- 绘制 ---------------- */
  function render() {
    // 背景
    ctx.drawImage(bgCv, 0, 0, W, H);

    // 玻璃上的静态水珠
    var i, d;
    for (i = 0; i < drops.length; i++) {
      d = drops[i];
      ctx.beginPath();
      ctx.ellipse(d.x, d.y, d.r, d.r * 1.25, 0, 0, 6.2832);
      ctx.fillStyle = 'rgba(255,255,255,.10)';
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(d.x - d.r * 0.3, d.y - d.r * 0.4, d.r * 0.32, d.r * 0.32, 0, 0, 6.2832);
      ctx.fillStyle = 'rgba(255,255,255,.42)';
      ctx.fill();
    }

    // 下滑的水珠 + 尾迹
    for (i = runners.length - 1; i >= 0; i--) {
      var r = runners[i];
      r.y += r.v * 0.016;
      r.v += 0.035;
      r.trail.unshift(r.y);
      if (r.trail.length > 26) r.trail.pop();
      if (r.y > H + 30) { runners.splice(i, 1); continue; }

      // 尾迹
      ctx.beginPath();
      for (var k = 0; k < r.trail.length; k++) {
        var yy = r.trail[k];
        var xx = r.x + Math.sin((yy - r.y) * 0.02 + r.wob) * 1.6;
        if (k === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.strokeStyle = 'rgba(255,255,255,.22)';
      ctx.lineWidth = r.r * 1.1;
      ctx.lineCap = 'round';
      ctx.stroke();

      // 珠体
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, r.r, r.r * 1.35, 0, 0, 6.2832);
      ctx.fillStyle = 'rgba(255,255,255,.26)';
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(r.x - r.r * 0.3, r.y - r.r * 0.5, r.r * 0.3, r.r * 0.3, 0, 0, 6.2832);
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.fill();
    }

    // 敲击涟漪
    for (i = ripples.length - 1; i >= 0; i--) {
      var rp = ripples[i];
      rp.age += 0.016;
      if (rp.age > 1.1) { ripples.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rp.age * 90, 0, 6.2832);
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.35 * (1 - rp.age / 1.1)).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  function loop(now) {
    rafId = requestAnimationFrame(loop);
    var dt = lastT ? Math.min((now - lastT) / 1000, 0.05) : 0.016;
    lastT = now;
    t += dt;

    // 偶尔有水珠开始下滑
    if (Math.random() < 0.035 && runners.length < 22) {
      var d0 = drops[Math.floor(Math.random() * drops.length)];
      runners.push({
        x: d0.x, y: d0.y, v: 0.4 + Math.random() * 0.8,
        r: d0.r * 0.9, trail: [], wob: Math.random() * 6.28
      });
    }
    render();
  }

  function start() { if (running) return; running = true; lastT = 0; rafId = requestAnimationFrame(loop); }
  function stop() { running = false; cancelAnimationFrame(rafId); }

  /* ---------------- 交互：敲玻璃 ---------------- */
  cv.addEventListener('pointerdown', function (e) {
    var r = cv.getBoundingClientRect();
    ripples.push({ x: e.clientX - r.left, y: e.clientY - r.top, age: 0 });
    // 附近的雨珠被震落
    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      var dx = d.x - (e.clientX - r.left), dy = d.y - (e.clientY - r.top);
      if (dx * dx + dy * dy < 120 * 120 && Math.random() < 0.5) {
        runners.push({ x: d.x, y: d.y, v: 0.8 + Math.random(), r: d.r * 0.85, trail: [], wob: Math.random() * 6.28 });
      }
    }
  });

  /* ---------------- 闲置淡出 ---------------- */
  var idleTimer = null;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 3000);
  }
  ['pointermove', 'pointerdown', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, wake, { passive: true });
  });
  wake();

  /* ---------------- 启动 ---------------- */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop(); else if (!reduceMotion) start();
  });
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 220); });

  var pk = window.PaletteKit.mount(document.getElementById('pk'), {
    value: '#5b7cfa',
    onChange: function (c) { setPalette(c); }
  });
  setPalette(pk.get());
  resize();
  if (!reduceMotion) start();
})();
</script>
</body>
</html>
