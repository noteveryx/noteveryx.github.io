<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#87b7e8">
<link rel="icon" type="image/png" href="../assets/image/favicon-round.png">
<link rel="apple-touch-icon" href="../assets/image/logo.png">
<title>实时天光</title>
<link rel="stylesheet" href="../assets/css/palette-kit.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#fff;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  }
  canvas{position:fixed;inset:0;display:block;width:100%;height:100%;}
  .ui{position:fixed;z-index:5;opacity:1;transition:opacity .55s cubic-bezier(.3,.8,.3,1);}
  body.idle .ui{opacity:.15;}
  body.idle .ui:hover{opacity:1;}
  .back{
    top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));
    width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;text-decoration:none;
    transition:background-color .2s ease,transform .12s ease;
  }
  .back:hover{background:rgba(255,255,255,.3);}
  .back:active{transform:scale(.94);}
  .back svg{width:15px;height:15px;display:block;}
  .tools{right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;}
  .label{
    left:calc(18px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.55);
    pointer-events:none;user-select:none;
  }
  .label b{font-weight:600;letter-spacing:.14em;color:rgba(255,255,255,.9);}
  .clock{
    right:calc(16px + env(safe-area-inset-right));top:calc(16px + env(safe-area-inset-top));
    text-align:right;pointer-events:none;
  }
  .clock .t{font-size:30px;font-weight:200;letter-spacing:.02em;line-height:1;
    text-shadow:0 2px 18px rgba(0,0,0,.3);}
  .clock .d{font-size:12px;opacity:.72;margin-top:5px;letter-spacing:.06em;}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<a class="ui back" href="../x.html" title="返回" aria-label="返回">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</a>

<div class="ui tools">
  <div class="pk" id="pk" data-pk="sky" data-placement="left"></div>
</div>

<div class="ui clock" id="clock">
  <div class="t" id="time">--:--</div>
  <div class="d" id="phase">—</div>
</div>

<div class="ui label" id="label">Sky · <b>实时天光</b></div>

<script src="../assets/js/palette-kit.js"></script>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d', { alpha: false });
  var W = 0, H = 0, DPR = 1;
  var t = 0;
  var running = false, rafId = 0, lastT = 0;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 调色板控制的是「太阳/月亮」与整体色调偏移 */
  var accentHex = '#ffd166';
  var tint = 0;          // 0 = 跟随时段，1 = 强制用调色板主色

  /* ---------------- 时段配色 ---------------- */
  var PHASES = [
    { name: '深夜',   top: '#05070f', mid: '#0a1224', bot: '#141d33', sun: '#dfe6f5', star: 1, elev: -0.4 },
    { name: '黎明',   top: '#2b3a63', mid: '#7a5a78', bot: '#f0a97c', sun: '#ffb27a', star: 0.45, elev: 0.05 },
    { name: '清晨',   top: '#6fa8dc', mid: '#b9dcf0', bot: '#ffe6c9', sun: '#fff2d0', star: 0, elev: 0.22 },
    { name: '上午',   top: '#4b8fd6', mid: '#8fc0ea', bot: '#d9ecfb', sun: '#fffbe8', star: 0, elev: 0.42 },
    { name: '正午',   top: '#2f7fd4', mid: '#6bb0ee', bot: '#cfe8fb', sun: '#ffffff', star: 0, elev: 0.72 },
    { name: '午后',   top: '#3f86c9', mid: '#8fb8dd', bot: '#f0dfc4', sun: '#fff0cf', star: 0, elev: 0.45 },
    { name: '黄昏',   top: '#2c3e6b', mid: '#c76a6a', bot: '#f7b267', sun: '#ff9d5c', star: 0.15, elev: 0.08 },
    { name: '夜晚',   top: '#04060e', mid: '#0a1020', bot: '#121b30', sun: '#e8eeff', star: 0.9, elev: -0.25 }
  ];

  function phaseOf(hour) {
    if (hour < 4.5) return 0;
    if (hour < 6.5) return 1;
    if (hour < 8.5) return 2;
    if (hour < 11) return 3;
    if (hour < 14) return 4;
    if (hour < 17) return 5;
    if (hour < 19.2) return 6;
    if (hour < 21) return 7;
    return 0;
  }

  /* 在两个时段之间插值（跨天也要平滑） */
  function mixHex(a, b, k) {
    var ca = window.PaletteKit.hex2rgb(a), cb = window.PaletteKit.hex2rgb(b);
    if (!ca || !cb) return a;
    var r = ca.r + (cb.r - ca.r) * k;
    var g = ca.g + (cb.g - ca.g) * k;
    var bl = ca.b + (cb.b - ca.b) * k;
    return window.PaletteKit.rgb2hex(r, g, bl);
  }

  var stars = [];
  function seedStars() {
    stars.length = 0;
    var n = Math.round(Math.max(60, Math.min(220, (W * H) / 8000)));
    for (var i = 0; i < n; i++) {
      stars.push({ x: Math.random(), y: Math.random() * 0.62, r: Math.random() * 1.3 + 0.3, ph: Math.random() * 6.28, sp: 0.4 + Math.random() * 1.2 });
    }
  }

  function currentPalette() {
    var now = new Date();
    var hour = now.getHours() + now.getMinutes() / 60;
    var p = PHASES[phaseOf(hour)];
    var ph = phaseOf(hour);

    // 相邻时段过渡：每个时段前后 0.75 小时内渐变
    var next = PHASES[(ph + 1) % PHASES.length];
    var k = 0;
    var edge = (hour - (now.getHours() - 0.5)) % 1;   // 粗略：不在边界就不混
    var blend = 0;
    var startHour = [0, 4.5, 6.5, 8.5, 11, 14, 17, 19.2][ph];
    var endHour = [4.5, 6.5, 8.5, 11, 14, 17, 19.2, 24][ph];
    if (hour - startHour < 0.6) blend = (0.6 - (hour - startHour)) / 0.6;
    else if (endHour - hour < 0.6) blend = (0.6 - (endHour - hour)) / 0.6;
    blend = Math.max(0, Math.min(0.6, blend));

    var pal = {
      top: mixHex(p.top, next.top, blend),
      mid: mixHex(p.mid, next.mid, blend),
      bot: mixHex(p.bot, next.bot, blend),
      sun: mixHex(p.sun, next.sun, blend),
      star: p.star + (next.star - p.star) * blend,
      elev: p.elev + (next.elev - p.elev) * blend,
      name: blend > 0.3 ? (next.name === '深夜' ? p.name : next.name) : p.name
    };
    if (tint) {
      pal.sun = accentHex;
      pal.top = mixHex(pal.top, accentHex, 0.18);
      pal.mid = mixHex(pal.mid, accentHex, 0.14);
    }
    return pal;
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    seedStars();
    if (!running) render();
  }

  function render() {
    var pal = currentPalette();

    // 天空渐变
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, pal.top);
    g.addColorStop(0.55, pal.mid);
    g.addColorStop(1, pal.bot);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 星星
    if (pal.star > 0.02) {
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var tw = 0.55 + 0.45 * Math.sin(t * s.sp + s.ph);
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, 6.2832);
        ctx.fillStyle = 'rgba(255,255,255,' + (pal.star * tw * 0.85).toFixed(3) + ')';
        ctx.fill();
      }
    }

    // 太阳 / 月亮：沿弧线走
    var arcX = W * 0.5 + Math.cos((t * 0.06) % 6.2832) * W * 0.3;
    var elev = pal.elev + Math.sin(t * 0.06) * 0.06;
    var sunY = H * (0.78 - elev * 0.62);
    var R = Math.min(W, H) * 0.085;

    // 光晕
    var gg = ctx.createRadialGradient(arcX, sunY, 0, arcX, sunY, R * 5);
    gg.addColorStop(0, pal.sun);
    gg.addColorStop(0.16, hexA(pal.sun, 0.45));
    gg.addColorStop(1, hexA(pal.sun, 0));
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = gg;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';

    // 圆面
    ctx.beginPath();
    ctx.arc(arcX, sunY, R, 0, 6.2832);
    ctx.fillStyle = pal.sun;
    ctx.fill();

    // 云：几层横向柔光带
    ctx.globalCompositeOperation = 'lighter';
    for (var c = 0; c < 5; c++) {
      var cy = H * (0.18 + c * 0.13) + Math.sin(t * 0.05 + c) * 8;
      var cw = W * (0.35 + 0.12 * ((c * 7) % 3));
      var cx = W * (0.2 + 0.15 * ((c * 5) % 4)) + Math.sin(t * 0.02 + c * 1.7) * 40;
      var cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cw);
      cg.addColorStop(0, hexA(pal.bot, 0.16));
      cg.addColorStop(1, hexA(pal.bot, 0));
      ctx.fillStyle = cg;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.globalCompositeOperation = 'source-over';

    // 地平线
    var hg = ctx.createLinearGradient(0, H * 0.86, 0, H);
    hg.addColorStop(0, hexA(pal.bot, 0));
    hg.addColorStop(1, hexA(pal.top, 0.55));
    ctx.fillStyle = hg;
    ctx.fillRect(0, H * 0.86, W, H * 0.14);
  }

  function hexA(hex, a) {
    var c = window.PaletteKit.hex2rgb(hex);
    if (!c) return 'rgba(0,0,0,' + a + ')';
    return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')';
  }

  function loop(now) {
    rafId = requestAnimationFrame(loop);
    var dt = lastT ? Math.min((now - lastT) / 1000, 0.05) : 0.016;
    lastT = now;
    t += dt;
    render();
  }
  function start() { if (running) return; running = true; lastT = 0; rafId = requestAnimationFrame(loop); }
  function stop() { running = false; cancelAnimationFrame(rafId); }

  /* ---------------- 时钟 ---------------- */
  function updateClock() {
    var now = new Date();
    var hh = now.getHours(), mm = now.getMinutes();
    var timeEl = document.getElementById('time');
    var phaseEl = document.getElementById('phase');
    if (timeEl) timeEl.textContent = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
    if (phaseEl) {
      var p = currentPalette();
      var wk = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][now.getDay()];
      phaseEl.textContent = p.name + ' · ' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + wk;
    }
  }

  /* ---------------- 闲置淡出 ---------------- */
  var idleTimer = null;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 3000);
  }
  ['pointermove', 'pointerdown', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, wake, { passive: true });
  });
  wake();

  /* ---------------- 启动 ---------------- */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop(); else if (!reduceMotion) start();
  });
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 220); });
  setInterval(updateClock, 1000);

  var pk = window.PaletteKit.mount(document.getElementById('pk'), {
    value: '#ffd166',
    onChange: function (c) {
      accentHex = c;
      tint = true;
      var lbl = document.getElementById('label');
      if (lbl) lbl.innerHTML = 'Sky · <b>' + c.toUpperCase() + '</b>';
      if (!running) render();
    }
  });
  accentHex = pk.get();

  resize();
  updateClock();
  if (!reduceMotion) start(); else render();
})();
</script>
</body>
</html>
