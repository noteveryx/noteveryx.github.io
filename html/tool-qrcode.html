<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f9fd">
<link rel="icon" type="image/png" href="../assets/image/favicon-round.png">
<link rel="apple-touch-icon" href="../assets/image/logo.png">
<title>二维码生成</title>
<link rel="stylesheet" href="../assets/css/theme-kit.css">
<link rel="stylesheet" href="../assets/css/themes.css">
<link rel="stylesheet" href="../assets/css/toolbox.css">
<style>
/* 原生调色盘按钮：伪装成色块，点击唤起系统取色器 */
.tb-color {
  width: 38px;
  height: 36px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: none;
  cursor: pointer;
  flex: 0 0 auto;
  transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
}
.tb-color:hover { transform: scale(1.05); border-color: var(--accent); }
.tb-color::-webkit-color-swatch-wrapper { padding: 3px; }
.tb-color::-webkit-color-swatch { border: none; border-radius: 7px; }
.tb-color::-moz-color-swatch { border: none; border-radius: 7px; }
</style>
<script>try{var t=localStorage.getItem('tk_theme');document.documentElement.setAttribute('data-theme',['emerald','midnight','sunset','violet','ink'].indexOf(t)>-1?t:'violet')}catch(e){}</script>
<script src="../assets/js/theme-kit.js" defer></script>
<script src="../assets/js/toolbox.js" defer></script>
<script src="../assets/js/qrcode.js" defer></script>
</head>
<body class="tb-page">
<div id="tbRoot"></div>

<script>
(function () {
  'use strict';
  var el = function () { return ToolBox.el.apply(null, arguments); };

  function boot() {
    ToolBox.mount(document.getElementById('tbRoot'), {
      title: '二维码生成',
      sub: '纯本地生成，链接不会经过任何服务器',
      storageKey: 'tb_qrcode',
      tabs: [{ id: 'main', name: '二维码', render: renderMain }]
    });
  }

  function renderMain(panel) {
    var cfg = { dark: '#000000', light: '#ffffff', margin: 4, size: 320 };
    try {
      var s = JSON.parse(localStorage.getItem('tb_qrcode_cfg') || '{}');
      for (var k in s) if (Object.prototype.hasOwnProperty.call(s, k)) cfg[k] = s[k];
    } catch (e) { }
    function save() {
      try { localStorage.setItem('tb_qrcode_cfg', JSON.stringify(cfg)); } catch (e) { }
    }

    /* ---------- 输入 ---------- */
    var card = el('div', { class: 'tb-card' });
    card.appendChild(el('div', { class: 'tb-card-title', text: '内容' }));

    var input = el('textarea', { class: 'tb-ta mono', placeholder: '输入网址或文本…', spellcheck: 'false' });
    input.style.minHeight = '84px';
    card.appendChild(input);

    /* 常用网址 */
    var quick = el('div', { class: 'tb-seg', style: 'margin-top:10px' });
    [
      { label: '本站', url: 'https://noteveryx.github.io/x.html' },
      { label: '主页', url: 'https://noteveryx.github.io' },
      { label: '当前页面', url: '' }
    ].forEach(function (q) {
      var b = el('button', { type: 'button', text: q.label });
      b.addEventListener('click', function () {
        input.value = q.url || location.href;
        generate();
      });
      quick.appendChild(b);
    });
    card.appendChild(quick);
    panel.appendChild(card);

    /* ---------- 预览 ---------- */
    var prevCard = el('div', { class: 'tb-card' });
    prevCard.appendChild(el('div', { class: 'tb-card-title', text: '预览' }));
    var box = el('div', { class: 'tb-preview', style: 'padding:16px' });
    var canvas = el('canvas', { style: 'max-width:100%;display:block;border-radius:8px' });
    box.appendChild(canvas);
    prevCard.appendChild(box);
    var info = el('p', { class: 'tb-hint', style: 'margin-top:8px' });
    prevCard.appendChild(info);
    panel.appendChild(prevCard);

    /* ---------- 参数 ---------- */
    var pc = el('div', { class: 'tb-card' });
    pc.appendChild(el('div', { class: 'tb-card-title', text: '外观' }));

    var g = el('div', { class: 'tb-grid c2' });

    function colorField(label, key) {
      var f = el('div', { class: 'tb-field' });
      f.appendChild(el('label', { text: label }));
      var row = el('div', { class: 'tb-row tight' });
      var inp = el('input', { class: 'tb-in mono', type: 'text', value: cfg[key], maxlength: '7', style: 'flex:1' });
      var sw = el('input', { class: 'tb-color', type: 'color', value: cfg[key], title: '点击打开调色盘', 'aria-label': label + '调色盘' });
      function apply(v) {
        if (!/^#[0-9a-fA-F]{6}$/.test(v)) { ToolBox.toast('请输入 6 位 HEX 色值'); inp.value = cfg[key]; return; }
        cfg[key] = v;
        inp.value = v;
        sw.value = v;
        save();
        generate();
      }
      inp.addEventListener('change', function () { apply(inp.value.trim()); });
      // 原生调色盘：直接唤起系统取色器
      sw.addEventListener('input', function () { apply(sw.value); });
      sw.addEventListener('change', function () { apply(sw.value); });
      row.appendChild(inp);
      row.appendChild(sw);
      f.appendChild(row);
      return f;
    }
    g.appendChild(colorField('前景色（码点）', 'dark'));
    g.appendChild(colorField('背景色', 'light'));
    pc.appendChild(g);

    var margin = el('input', { type: 'range', min: '0', max: '10', value: String(cfg.margin), style: 'width:100%' });
    var mLabel = el('span', { class: 'tb-hint', text: '四周留白 ' + cfg.margin + ' 个模块' });
    margin.addEventListener('input', function () {
      cfg.margin = parseInt(margin.value, 10);
      mLabel.textContent = '四周留白 ' + cfg.margin + ' 个模块';
      save();
      generate();
    });
    var mf = el('div', { class: 'tb-field', style: 'margin-top:12px' });
    mf.appendChild(el('label', { text: '边距' }));
    mf.appendChild(margin);
    mf.appendChild(mLabel);
    pc.appendChild(mf);

    var size = el('input', { type: 'range', min: '160', max: '720', value: String(cfg.size), style: 'width:100%' });
    var sLabel = el('span', { class: 'tb-hint', text: '尺寸 ' + cfg.size + ' px' });
    size.addEventListener('input', function () {
      cfg.size = parseInt(size.value, 10);
      sLabel.textContent = '尺寸 ' + cfg.size + ' px';
      save();
      generate();
    });
    var sf = el('div', { class: 'tb-field', style: 'margin-top:12px' });
    sf.appendChild(el('label', { text: '输出尺寸' }));
    sf.appendChild(size);
    sf.appendChild(sLabel);
    pc.appendChild(sf);
    panel.appendChild(pc);

    /* ---------- 导出 ---------- */
    var ac = el('div', { class: 'tb-card' });
    ac.appendChild(el('div', { class: 'tb-card-title', text: '导出' }));
    var bar = el('div', { class: 'tb-row' });
    var btnPng = el('button', { class: 'tb-btn primary', type: 'button', text: '下载 PNG' });
    var btnSvg = el('button', { class: 'tb-btn', type: 'button', text: '下载 SVG' });
    var btnCopy = el('button', { class: 'tb-btn', type: 'button', text: '复制图片' });
    var btnCopyText = el('button', { class: 'tb-btn', type: 'button', text: '复制内容' });
    bar.appendChild(btnPng);
    bar.appendChild(btnSvg);
    bar.appendChild(btnCopy);
    bar.appendChild(btnCopyText);
    ac.appendChild(bar);
    panel.appendChild(ac);

    /* ---------- 生成 ---------- */
    function generate() {
      var text = input.value.trim();
      if (!text) {
        info.textContent = '输入内容后自动生成';
        return;
      }
      try {
        // 先编码拿到模块数，再据此算每个模块该画多少像素（整数，避免缩放糊边）
        var qr = QRCode.encode(text, { margin: cfg.margin });
        var moduleSize = Math.max(1, Math.floor(cfg.size / (qr.size + cfg.margin * 2)));
        QRCode.toCanvas(canvas, text, {
          margin: cfg.margin, dark: cfg.dark, light: cfg.light,
          scale: moduleSize, dpr: Math.min(window.devicePixelRatio || 1, 3)
        });
        info.innerHTML = '版本 <b>' + qr.version + '</b> · 模块 <b>' + qr.size + '×' + qr.size +
          '</b> · 纠错等级 <b>M</b> · 内容 <b>' + new TextEncoder().encode(text).length + '</b> 字节';
      } catch (e) {
        info.innerHTML = '<span style="color:#dc2626">生成失败：' + ToolBox.esc(e.message) + '</span>';
      }
    }

    /* ---------- 事件 ---------- */
    input.addEventListener('input', ToolBox.debounce(generate, 200));

    btnPng.addEventListener('click', function () {
      if (!input.value.trim()) { ToolBox.toast('请先输入内容'); return; }
      canvas.toBlob(function (b) {
        if (!b) { ToolBox.toast('导出失败'); return; }
        var url = URL.createObjectURL(b);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'qrcode.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
        ToolBox.toast('已开始下载');
      }, 'image/png');
    });

    btnSvg.addEventListener('click', function () {
      if (!input.value.trim()) { ToolBox.toast('请先输入内容'); return; }
      try {
        var svg = QRCode.toSVG(input.value.trim(), {
          margin: cfg.margin, dark: cfg.dark, light: cfg.light, size: cfg.size
        });
        var blob = new Blob([svg], { type: 'image/svg+xml' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'qrcode.svg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
        ToolBox.toast('已开始下载');
      } catch (e) {
        ToolBox.toast('生成失败：' + e.message);
      }
    });

    btnCopy.addEventListener('click', function () {
      if (!input.value.trim()) { ToolBox.toast('请先输入内容'); return; }
      canvas.toBlob(function (b) {
        if (!b) { ToolBox.toast('复制失败'); return; }
        if (!navigator.clipboard || !navigator.clipboard.write || typeof ClipboardItem === 'undefined') {
          ToolBox.toast('当前浏览器不支持复制图片，请用下载');
          return;
        }
        navigator.clipboard.write([new ClipboardItem({ 'image/png': b })])
          .then(function () { ToolBox.toast('图片已复制到剪贴板'); })
          .catch(function () { ToolBox.toast('复制失败，请用下载'); });
      }, 'image/png');
    });

    btnCopyText.addEventListener('click', function () {
      if (!input.value.trim()) { ToolBox.toast('请先输入内容'); return; }
      ToolBox.copy(input.value.trim());
      ToolBox.toast('已复制内容');
    });

    /* ---------- 初始 ---------- */
    input.value = 'https://noteveryx.github.io/x.html';
    generate();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
