<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<link rel="icon" type="image/png" href="../assets/image/favicon-round.png">
<link rel="apple-touch-icon" href="../assets/image/logo.png">
<title>粒子引力场</title>
<link rel="stylesheet" href="../assets/css/palette-kit.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#05060c;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#fff;-webkit-font-smoothing:antialiased;cursor:crosshair;touch-action:none;
    user-select:none;-webkit-user-select:none;
  }
  canvas{position:fixed;inset:0;display:block;width:100%;height:100%;}
  .ui{position:fixed;z-index:5;opacity:1;transition:opacity .55s cubic-bezier(.3,.8,.3,1);}
  body.idle .ui{opacity:.15;}
  body.idle .ui:hover{opacity:1;}
  .back{
    top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));
    width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(12,16,24,.42);border:1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;text-decoration:none;
    transition:background-color .2s ease,transform .12s ease;
  }
  .back:hover{background:rgba(20,26,38,.7);}
  .back:active{transform:scale(.94);}
  .back svg{width:15px;height:15px;display:block;}
  .tools{right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;}
  .label{
    left:calc(18px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));
    font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.5);
    pointer-events:none;user-select:none;
  }
  .label b{font-weight:600;letter-spacing:.16em;color:rgba(255,255,255,.9);}
</style>
  <script src="../assets/js/fs-kit.js" defer></script>
</head>
<body>
<canvas id="cv"></canvas>

<a class="ui back" href="../x.html" title="返回" aria-label="返回">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</a>

<div class="ui tools">
  <div class="pk" id="pk" data-pk="constellation" data-placement="left"></div>
  <button class="btn" id="burstBtn" type="button" title="炸开（B）" style="width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(12,16,24,.42);color:#fff;font-size:16px;line-height:1;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);">✷</button>
</div>

<div class="ui label" id="label">Constellation · <b>粒子引力场</b></div>

<script src="../assets/js/palette-kit.js"></script>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d', { alpha: false });
  var W = 0, H = 0, DPR = 1;

  var pts = [];
  var links = [];
  var attract = { x: -999, y: -999, on: false };
  var baseColor = '#7cc4ff';
  var rgb = { r: 124, g: 196, b: 255 };

  var running = false, rafId = 0, lastT = 0;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function setColor(hex) {
    baseColor = hex;
    rgb = window.PaletteKit.hex2rgb(hex) || rgb;
    var lbl = document.getElementById('label');
    if (lbl) lbl.innerHTML = 'Constellation · <b>' + hex.toUpperCase() + '</b>';
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var n = Math.round(Math.max(60, Math.min(190, (W * H) / 7000)));
    pts.length = 0;
    for (var i = 0; i < n; i++) {
      pts.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
        r: 0.9 + Math.random() * 1.6
      });
    }
    if (!running) render();
  }

  function burst() {
    var cx = W / 2, cy = H / 2;
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      var dx = p.x - cx, dy = p.y - cy;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      p.vx += dx / d * 9;
      p.vy += dy / d * 9;
    }
  }

  function render() {
    ctx.fillStyle = 'rgba(5,6,12,.28)';       // 拖尾
    ctx.fillRect(0, 0, W, H);

    // 指针吸引
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      if (attract.on) {
        var dx = attract.x - p.x, dy = attract.y - p.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < 420 * 420) {
          var d = Math.sqrt(d2) || 1;
          var f = (1 - d / 420) * 0.85;
          p.vx += dx / d * f;
          p.vy += dy / d * f;
        }
      }
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
      if (p.y < -20) p.y = H + 20; else if (p.y > H + 20) p.y = -20;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',.9)';
      ctx.fill();
    }

    // 近邻连线（O(n²)，n ≤ 190 可接受）
    ctx.lineWidth = 1;
    for (var a = 0; a < pts.length; a++) {
      for (var b = a + 1; b < pts.length; b++) {
        var p1 = pts[a], p2 = pts[b];
        var dx = p1.x - p2.x, dy = p1.y - p2.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < 130 * 130) {
          var alpha = (1 - d2 / (130 * 130)) * 0.5;
          ctx.strokeStyle = 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + alpha.toFixed(3) + ')';
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }
    }

    // 指针光晕
    if (attract.on) {
      var g = ctx.createRadialGradient(attract.x, attract.y, 0, attract.x, attract.y, 150);
      g.addColorStop(0, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',.22)');
      g.addColorStop(1, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0)');
      ctx.fillStyle = g;
      ctx.fillRect(attract.x - 150, attract.y - 150, 300, 300);
    }
  }

  function loop(now) {
    rafId = requestAnimationFrame(loop);
    var dt = lastT ? Math.min((now - lastT) / 1000, 0.05) : 0.016;
    lastT = now;
    render();
  }
  function start() { if (running) return; running = true; lastT = 0; rafId = requestAnimationFrame(loop); }
  function stop() { running = false; cancelAnimationFrame(rafId); }

  /* ---------------- 交互 ---------------- */
  cv.addEventListener('pointermove', function (e) {
    attract.x = e.clientX; attract.y = e.clientY; attract.on = true;
  }, { passive: true });
  cv.addEventListener('pointerdown', function (e) {
    attract.x = e.clientX; attract.y = e.clientY; attract.on = true;
    burst();
  });
  cv.addEventListener('pointerleave', function () { attract.on = false; });

  var burstBtn = document.getElementById('burstBtn');
  if (burstBtn) burstBtn.addEventListener('click', burst);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'b' || e.key === 'B') burst();
  });

  /* ---------------- 闲置淡出 ---------------- */
  var idleTimer = null;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 3000);
  }
  ['pointermove', 'pointerdown', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, wake, { passive: true });
  });
  wake();

  /* ---------------- 启动 ---------------- */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop(); else if (!reduceMotion) start();
  });
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 220); });

  var pk = window.PaletteKit.mount(document.getElementById('pk'), {
    value: '#7cc4ff',
    onChange: function (c) { setColor(c); }
  });
  setColor(pk.get());
  resize();
  if (!reduceMotion) start(); else render();
})();
</script>
</body>
</html>
