<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101828">
<link rel="icon" type="image/png" href="../assets/image/favicon-round.png">
<link rel="apple-touch-icon" href="../assets/image/logo.png">
<title>雪落</title>
<link rel="stylesheet" href="../assets/css/palette-kit.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#fff;-webkit-font-smoothing:antialiased;cursor:crosshair;touch-action:none;
    user-select:none;-webkit-user-select:none;
  }
  canvas{position:fixed;inset:0;display:block;width:100%;height:100%;}
  .ui{position:fixed;z-index:5;opacity:1;transition:opacity .55s cubic-bezier(.3,.8,.3,1);}
  body.idle .ui{opacity:.4;}
  body.idle .ui:hover{opacity:1;}
  .back{
    top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));
    width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;text-decoration:none;
    transition:background-color .2s ease,transform .12s ease;
  }
  .back:hover{background:rgba(255,255,255,.26);}
  .back:active{transform:scale(.94);}
  .back svg{width:15px;height:15px;display:block;}
  .tools{right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;}
  .label{
    left:calc(18px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));
    font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.55);
    pointer-events:none;user-select:none;
  }
  .label b{font-weight:600;letter-spacing:.18em;color:rgba(255,255,255,.9);}
  /* 工具按钮：与调色球 / 保存按钮统一成同一种圆形玻璃按钮 */
  .tool-btn{
    width:38px;height:38px;padding:0;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.22);
    background:rgba(14,16,26,.55);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    color:rgba(255,255,255,.92);cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    box-shadow:0 2px 10px rgba(0,0,0,.28);
    transition:transform .16s cubic-bezier(.2,.9,.3,1),opacity .2s,color .2s,border-color .2s,background .2s;
  }
  .tool-btn:hover{color:#fff;border-color:rgba(255,255,255,.45);background:rgba(14,16,26,.78);transform:scale(1.06);}
  .tool-btn:active{transform:scale(.93);}
  .tool-btn:focus-visible{outline:2px solid rgba(255,255,255,.6);outline-offset:2px;}
  .tool-btn svg{width:19px;height:19px;display:block;pointer-events:none;}
  .tool-btn.pop svg{animation:pop .55s cubic-bezier(.2,.9,.3,1);}
  @keyframes pop{
    0%{transform:scale(.5) rotate(-50deg);opacity:.35;}
    55%{transform:scale(1.25) rotate(12deg);opacity:1;}
    100%{transform:none;}
  }
  /* 点击瞬间的一圈微光，给出即时反馈 */
  .flash{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .6s ease;}
  .flash.on{opacity:1;transition:none;}
  /* 轻提示 */
  .toast{
    left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);
    padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:600;
    background:rgba(14,16,26,.92);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.92);
    opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
</style>
  <script src="../assets/js/fs-kit.js" defer></script>
</head>
<body>
<canvas id="cv"></canvas>

<a class="ui back" href="../x.html" title="返回" aria-label="返回">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</a>

<div class="ui tools">
  <div class="pk" id="pk" data-pk="snow" data-placement="left"></div>
  <button class="tool-btn" id="burstBtn" type="button" title="下一场大雪" aria-label="下一场大雪">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2v20M2 12h20"/>
      <path d="m20 16-4-4 4-4"/>
      <path d="m4 8 4 4-4 4"/>
      <path d="m16 4-4 4-4-4"/>
      <path d="m8 20 4-4 4 4"/>
    </svg>
  </button>
</div>

<div class="flash" id="flash"></div>
<div class="ui toast" id="toast" role="status"></div>

<div class="ui label" id="label">Snow · <b>雪落</b></div>

<script src="../assets/js/palette-kit.js"></script>
<script src="../assets/js/save-kit.js"></script>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d', { alpha: false });
  var W = 0, H = 0, DPR = 1, t = 0;
  var flakes = [];
  var running = false, rafId = 0, lastT = 0;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var snowHex = '#ffffff';
  var bgHex = '#101828';
  var bgRGB = [16, 24, 40];

  /* ---------------- 配色 ---------------- */
  function setPalette(hex) {
    snowHex = hex;
    var rgb = window.PaletteKit.hex2rgb(hex) || { r: 255, g: 255, b: 255 };
    var hsl = window.PaletteKit.rgb2hsl(rgb.r, rgb.g, rgb.b);
    // 背景 = 主色的极深版本（带一点冷调）
    var b = window.PaletteKit.hsl2rgb((hsl.h + 200) % 360, Math.min(0.45, hsl.s * 0.55), 0.075);
    bgRGB = [b.r, b.g, b.b];
    var lbl = document.getElementById('label');
    if (lbl) lbl.innerHTML = 'Snow · <b>' + hex.toUpperCase() + '</b>';
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    seed();
    if (!running) render();
  }

  /* 三层视差：远小慢、近大快 */
  function seed() {
    flakes.length = 0;
    var total = Math.round(Math.max(120, Math.min(380, (W * H) / 3400)));
    for (var i = 0; i < total; i++) {
      var layer = i % 3;                       // 0 远 1 中 2 近
      flakes.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: [0.9, 1.7, 2.9][layer] * (0.7 + Math.random() * 0.7),
        vy: [10, 22, 42][layer] * (0.7 + Math.random() * 0.7),
        amp: [7, 12, 20][layer] * (0.6 + Math.random() * 0.8),
        ph: Math.random() * 6.28,
        sp: [0.5, 0.8, 1.2][layer] * (0.7 + Math.random() * 0.6),
        layer: layer,
        rot: Math.random() * 6.28,
        vr: (Math.random() - 0.5) * 0.6
      });
    }
  }

  function burst() {
    for (var i = 0; i < 90; i++) {
      flakes.push({
        x: Math.random() * W,
        y: -Math.random() * H * 0.5,
        r: 1.4 + Math.random() * 3,
        vy: 40 + Math.random() * 90,
        amp: 10 + Math.random() * 20,
        ph: Math.random() * 6.28,
        sp: 0.8 + Math.random(),
        layer: 1 + (i % 2),
        rot: Math.random() * 6.28,
        vr: (Math.random() - 0.5) * 1.2
      });
    }
    // 连点时别让雪片无限堆积
    if (flakes.length > 1400) flakes.splice(0, flakes.length - 1400);
  }

  function render() {
    // 背景：主色极深色 + 上方一点点光
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgb(' + Math.round(bgRGB[0] * 1.5) + ',' + Math.round(bgRGB[1] * 1.5) + ',' + Math.round(bgRGB[2] * 1.5) + ')');
    g.addColorStop(1, 'rgb(' + bgRGB[0] + ',' + bgRGB[1] + ',' + bgRGB[2] + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var sc = window.PaletteKit.hex2rgb(snowHex) || { r: 255, g: 255, b: 255 };
    var i, f;
    for (i = 0; i < flakes.length; i++) {
      f = flakes[i];
      var alpha = [0.35, 0.6, 0.9][f.layer];
      var x = f.x + Math.sin(t * f.sp + f.ph) * f.amp;
      var y = f.y;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(f.rot);
      ctx.beginPath();
      ctx.arc(0, 0, f.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(' + sc.r + ',' + sc.g + ',' + sc.b + ',' + alpha + ')';
      ctx.fill();
      ctx.restore();
    }
  }

  function loop(now) {
    rafId = requestAnimationFrame(loop);
    var dt = lastT ? Math.min((now - lastT) / 1000, 0.05) : 0.016;
    lastT = now;
    t += dt;

    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      f.y += f.vy * dt;
      f.rot += f.vr * dt;
      if (f.vx) { f.x += f.vx * dt; f.vx *= 0.92; }
      if (f.y > H + 10) {
        f.y = -10 - Math.random() * 40;
        f.x = Math.random() * W;
      }
    }
    pushSnow();
    render();
  }
  function start() { if (running) return; running = true; lastT = 0; rafId = requestAnimationFrame(loop); }
  function stop() { running = false; cancelAnimationFrame(rafId); }

  /* ---------------- 交互：手指拨开雪 ---------------- */
  var mx = -999, my = -999;
  cv.addEventListener('pointermove', function (e) {
    mx = e.clientX; my = e.clientY;
  }, { passive: true });
  cv.addEventListener('pointerdown', function (e) { mx = e.clientX; my = e.clientY; }, { passive: true });
  cv.addEventListener('pointerleave', function () { mx = -999; my = -999; });

  function pushSnow() {
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      var dx = f.x - mx, dy = f.y - my;
      var d2 = dx * dx + dy * dy;
      if (d2 < 160 * 160) {
        var d = Math.sqrt(d2) || 1;
        var force = (160 - d) / 160 * 260;
        f.x += dx / d * force * 0.016;
        f.y += dy / d * force * 0.016;
        f.vx = (f.vx || 0) + dx / d * force * 0.05;
      }
    }
  }

  /* ---------------- 大雪按钮：点击反馈 ---------------- */
  var burstBtn = document.getElementById('burstBtn');
  var flashEl = document.getElementById('flash');
  var toastEl = document.getElementById('toast');
  var toastTimer = 0;

  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  function flashAt(x, y) {
    if (!flashEl) return;
    var sc = window.PaletteKit.hex2rgb(snowHex) || { r: 255, g: 255, b: 255 };
    flashEl.style.background = 'radial-gradient(circle at ' + Math.round(x) + 'px ' + Math.round(y) + 'px,' +
      'rgba(' + sc.r + ',' + sc.g + ',' + sc.b + ',.3),transparent 52%)';
    flashEl.classList.add('on');
    setTimeout(function () { flashEl.classList.remove('on'); }, 50);
  }

  if (burstBtn) {
    burstBtn.addEventListener('click', function () {
      if (reduceMotion || !running) {
        toast('系统开启了「减弱动态效果」');
        return;
      }
      burst();
      burstBtn.classList.remove('pop');
      void burstBtn.offsetWidth;          // 重启动画
      burstBtn.classList.add('pop');
      var r = burstBtn.getBoundingClientRect();
      flashAt(r.left + r.width / 2, r.top + r.height / 2);
    });
  }

  /* ---------------- 闲置淡出 ---------------- */
  var idleTimer = null;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 3000);
  }
  ['pointermove', 'pointerdown', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, wake, { passive: true });
  });
  wake();

  /* ---------------- 启动 ---------------- */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop(); else if (!reduceMotion) start();
  });
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 220); });

  var pk = window.PaletteKit.mount(document.getElementById('pk'), {
    value: '#e8f2ff',
    onChange: function (c) { setPalette(c); }
  });
  setPalette(pk.get());
  resize();
  if (!reduceMotion) start();
})();
</script>
<script>
  /* 统一「保存为壁纸」入口：导出当前画面，分辨率 = CSS 尺寸 × devicePixelRatio */
  SaveKit.mountButton({
    canvas: document.getElementById('cv'),
    filename: 'snow',
    container: document.querySelector('.ui.tools'),
    title: '保存为壁纸'
  });
</script>
</body>
</html>
