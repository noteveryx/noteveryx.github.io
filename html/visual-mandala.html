<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<link rel="icon" type="image/png" href="../assets/image/favicon-round.png">
<link rel="apple-touch-icon" href="../assets/image/logo.png">
<title>曼陀罗</title>
<link rel="stylesheet" href="../assets/css/palette-kit.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    overflow:hidden;overscroll-behavior:none;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:#faf7f2;
    touch-action:none;           /* 画布即交互，禁止页面滚动/缩放 */
    user-select:none;-webkit-user-select:none;
  }
  body.ink{background:#12161c;}
  canvas{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:crosshair;}

  .ui{position:fixed;z-index:5;opacity:1;transition:opacity .55s cubic-bezier(.3,.8,.3,1);}
  body.idle .ui{opacity:.14;}
  body.idle .ui:hover,body.idle .ui:focus-within{opacity:1;}

  .back{
    top:calc(12px + env(safe-area-inset-top));
    left:calc(12px + env(safe-area-inset-left));
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.09);
    box-shadow:0 2px 10px rgba(0,0,0,.07);
    color:#3a4048;text-decoration:none;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    transition:transform .12s ease,border-color .2s ease;
  }
  body.ink .back{background:rgba(20,25,33,.6);border-color:rgba(255,255,255,.14);color:#dfe6ee;}
  .back:hover{border-color:#8a93a0;}
  .back:active{transform:scale(.94);}
  .back svg{width:15px;height:15px;display:block;}

  /* 色板：右侧竖排（调色板组件） */
  .palette{
    right:calc(12px + env(safe-area-inset-right));
    top:50%;transform:translateY(-50%);
    z-index:6;
  }

  /* 底部工具条 */
  .bar{
    left:50%;bottom:calc(14px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    display:flex;align-items:center;gap:6px;
    max-width:calc(100vw - 24px);
    padding:7px;border-radius:16px;
    background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.08);
    box-shadow:0 4px 18px rgba(0,0,0,.09);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    overflow-x:auto;scrollbar-width:none;
  }
  body.ink .bar{background:rgba(20,25,33,.8);border-color:rgba(255,255,255,.12);}
  .bar::-webkit-scrollbar{display:none;}
  .tool{
    flex:0 0 auto;height:34px;min-width:34px;padding:0 10px;
    display:flex;align-items:center;justify-content:center;gap:5px;
    border:none;border-radius:10px;background:transparent;
    color:#4a525c;font-family:inherit;font-size:12.5px;font-weight:600;
    cursor:pointer;outline:none;white-space:nowrap;
    transition:background-color .15s ease,transform .12s ease;
  }
  body.ink .tool{color:#c3ccd6;}
  .tool:hover{background:rgba(0,0,0,.06);}
  body.ink .tool:hover{background:rgba(255,255,255,.08);}
  .tool:active{transform:scale(.93);}
  .tool:focus-visible{outline:2px solid #6aa;outline-offset:1px;}
  .tool b{font-weight:700;}
  .tool .dot{width:13px;height:13px;border-radius:50%;background:#1a1a1a;border:1px solid rgba(0,0,0,.2);}
  .sep{flex:0 0 auto;width:1px;height:20px;background:rgba(0,0,0,.1);}
  body.ink .sep{background:rgba(255,255,255,.14);}
  .tool.primary{background:#22303c;color:#fff;}
  .tool.primary:hover{background:#2c3d4d;}
  body.ink .tool.primary{background:#3d5872;}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<a class="ui back" href="../x.html" title="返回" aria-label="返回">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</a>

<div class="ui palette pk" id="pk" data-pk="mandala" data-placement="left"></div>

<div class="ui bar" id="bar">
  <button class="tool" id="symBtn" type="button" title="切换对称重数"><span>对称</span><b id="symN">×8</b></button>
  <button class="tool" id="wBtn" type="button" title="切换笔宽"><span>笔宽</span><i class="dot" id="wDot"></i></button>
  <i class="sep"></i>
  <button class="tool" id="undoBtn" type="button" title="撤销（Z）">撤销</button>
  <button class="tool" id="clearBtn" type="button" title="清空画布">清空</button>
  <button class="tool" id="autoBtn" type="button" title="随机画一朵">随机一朵</button>
  <button class="tool" id="bgBtn" type="button" title="纸 / 墨切换"><span id="bgText">墨</span></button>
  <i class="sep"></i>
  <button class="tool primary" id="saveBtn" type="button" title="保存 PNG">保存</button>
</div>

<script src="../assets/js/palette-kit.js"></script>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d', { alpha: false });
  var symBtn = document.getElementById('symBtn');
  var symNEl = document.getElementById('symN');
  var wBtn = document.getElementById('wBtn');
  var wDot = document.getElementById('wDot');
  var undoBtn = document.getElementById('undoBtn');
  var clearBtn = document.getElementById('clearBtn');
  var autoBtn = document.getElementById('autoBtn');
  var bgBtn = document.getElementById('bgBtn');
  var bgText = document.getElementById('bgText');
  var saveBtn = document.getElementById('saveBtn');
  var paletteEl = document.getElementById('pk');

  var W = 0, H = 0, DPR = 1;
  var inkMode = false;

  var SYMS = [6, 8, 12, 16];
  var symIdx = 1;
  function symN() { return SYMS[symIdx]; }

  /* 笔宽三档（相对屏幕短边的比例系数） */
  var WIDTHS = [0.6, 1, 2];
  var wIdx = 1;

  /* 笔色：由调色板决定，不写死 */
  var penColor = '#22242a';
  function setPenColor(hex) { penColor = hex; }

  var snapLimit = 6;
  var snaps = [];                 // 撤销快照 {data: ImageData}

  var drawing = false;
  var last = null;                // 上一笔端点 {x, y}
  var autoTimer = 0;

  /* ---------------- 基础绘制 ---------------- */
  function bgColor() { return inkMode ? '#12161c' : '#faf7f2'; }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    paintBg();
  }

  function paintBg() {
    ctx.fillStyle = bgColor();
    ctx.fillRect(0, 0, W, H);
  }

  function penWidth() {
    return Math.max(1.2, Math.min(W, H) / 210) * WIDTHS[wIdx];
  }

  function curColor() {
    return penColor;
  }

  /* 画一段线（含所有旋转 + 镜像副本） */
  function drawSeg(x1, y1, x2, y2, color, width, n, mirror) {
    var cx = W / 2, cy = H / 2;
    var dx1 = x1 - cx, dy1 = y1 - cy;
    var dx2 = x2 - cx, dy2 = y2 - cy;
    var step = Math.PI * 2 / n;

    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = 0.5;

    for (var k = 0; k < n; k++) {
      var a = k * step;
      var ca = Math.cos(a), sa = Math.sin(a);

      // 正转副本
      ctx.beginPath();
      ctx.moveTo(dx1 * ca - dy1 * sa + cx, dx1 * sa + dy1 * ca + cy);
      ctx.lineTo(dx2 * ca - dy2 * sa + cx, dx2 * sa + dy2 * ca + cy);
      ctx.stroke();

      // 镜像副本（更繁复的万花筒效果）
      if (mirror) {
        ctx.beginPath();
        ctx.moveTo(dx1 * ca + dy1 * sa + cx, dx1 * sa - dy1 * ca + cy);
        ctx.lineTo(dx2 * ca + dy2 * sa + cx, dx2 * sa - dy2 * ca + cy);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  /* ---------------- 撤销 ---------------- */
  function pushSnap() {
    if (snaps.length >= snapLimit) snaps.shift();
    snaps.push({ data: ctx.getImageData(0, 0, cv.width, cv.height) });
    if (undoBtn) undoBtn.style.opacity = '1';
  }

  function undo() {
    var s = snaps.pop();
    if (!s) return;
    ctx.putImageData(s.data, 0, 0);
  }

  /* ---------------- 交互 ---------------- */
  function pos(e) {
    var r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  cv.addEventListener('pointerdown', function (e) {
    stopAuto();
    cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
    pushSnap();
    drawing = true;
    last = pos(e);
    // 单点也留下痕迹
    drawSeg(last.x, last.y, last.x + 0.01, last.y + 0.01, curColor(), penWidth(), symN(), true);
  });

  cv.addEventListener('pointermove', function (e) {
    if (!drawing) return;
    var p = pos(e);
    drawSeg(last.x, last.y, p.x, p.y, curColor(), penWidth(), symN(), true);
    last = p;
  });

  function endStroke() { drawing = false; last = null; }
  cv.addEventListener('pointerup', endStroke);
  cv.addEventListener('pointercancel', endStroke);
  cv.addEventListener('pointerleave', function () { if (drawing) endStroke(); });

  /* ---------------- 控件 ---------------- */
  if (symBtn) symBtn.addEventListener('click', function () {
    symIdx = (symIdx + 1) % SYMS.length;
    if (symNEl) symNEl.textContent = '×' + SYMS[symIdx];
  });

  if (wBtn) wBtn.addEventListener('click', function () {
    wIdx = (wIdx + 1) % WIDTHS.length;
    if (wDot) wDot.style.transform = 'scale(' + (0.6 + WIDTHS[wIdx] * 0.45) + ')';
  });

  if (undoBtn) undoBtn.addEventListener('click', undo);

  if (clearBtn) clearBtn.addEventListener('click', function () {
    stopAuto();
    snaps.length = 0;
    paintBg();
  });

  /* 随机一朵：用极坐标随机生成若干花瓣状笔画 */
  function randomFlower() {
    stopAuto();
    pushSnap();
    var cx = W / 2, cy = H / 2;
    var R = Math.min(W, H) * 0.36;
    var petals = 5 + Math.floor(Math.random() * 4);
    var col = window.PaletteKit.random();      // 随机取一个颜色

    var wd = penWidth() * (1 + Math.random() * 1.4);
    var n = symN();

    for (var pi = 0; pi < petals; pi++) {
      var r0 = R * (0.12 + Math.random() * 0.25);
      var r1 = R * (0.55 + Math.random() * 0.45);
      var a0 = Math.random() * Math.PI * 2;
      var sweep = (0.35 + Math.random() * 0.8) * (Math.random() < 0.5 ? 1 : -1);
      var pts = [];
      var segs = 14;
      for (var s = 0; s <= segs; s++) {
        var tt = s / segs;
        var rr = r0 + (r1 - r0) * Math.sin(tt * Math.PI);       // 花瓣形：中途鼓出
        var aa = a0 + sweep * tt;
        pts.push({ x: cx + Math.cos(aa) * rr, y: cy + Math.sin(aa) * rr });
      }
      for (s = 1; s < pts.length; s++) {
        drawSeg(pts[s - 1].x, pts[s - 1].y, pts[s].x, pts[s].y, col, wd, n, true);
      }
      // 花瓣尖端补一个点
      var tip = pts[pts.length - 1];
      drawSeg(tip.x, tip.y, tip.x + 0.01, tip.y + 0.01, col, wd * 1.2, n, true);
    }
  }
  if (autoBtn) autoBtn.addEventListener('click', randomFlower);

  /* 自动绘制：随机一朵，带逐笔动画 */
  function stopAuto() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = 0; }
  }

  if (bgBtn) bgBtn.addEventListener('click', function () {
    inkMode = !inkMode;
    document.body.classList.toggle('ink', inkMode);
    if (bgText) bgText.textContent = inkMode ? '纸' : '墨';
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', inkMode ? '#12161c' : '#faf7f2');
    snaps.length = 0;      // 底色变了，旧快照不再适用
    paintBg();
  });

  /* 色板：调色板组件 */
  function buildPalette() {
    if (!paletteEl) return;
    var pk = window.PaletteKit.mount(paletteEl, {
      value: '#22242a',
      onChange: function (c) { setPenColor(c); }
    });
    setPenColor(pk.get());
  }

  /* ---------------- 保存 PNG ---------------- */
  if (saveBtn) saveBtn.addEventListener('click', function () {
    try {
      var OUT = 2000;
      var out = document.createElement('canvas');
      out.width = OUT; out.height = OUT;
      var octx = out.getContext('2d');
      octx.fillStyle = bgColor();
      octx.fillRect(0, 0, OUT, OUT);
      // 屏幕内容等比贴到正方形中央
      var scale = Math.min(OUT / cv.width, OUT / cv.height);
      var dw = cv.width * scale, dh = cv.height * scale;
      octx.drawImage(cv, (OUT - dw) / 2, (OUT - dh) / 2, dw, dh);

      var name = 'mandala-' + new Date().toISOString().slice(0, 10) + '-' + Date.now() % 10000 + '.png';
      if (out.toBlob) {
        out.toBlob(function (blob) {
          if (!blob) return;
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = name;
          document.body.appendChild(a);
          a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
        }, 'image/png');
      } else {
        var a2 = document.createElement('a');
        a2.href = out.toDataURL('image/png');
        a2.download = name;
        document.body.appendChild(a2);
        a2.click();
        a2.remove();
      }
    } catch (e) { /* 忽略导出异常 */ }
  });

  /* ---------------- 键盘 ---------------- */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'z' || e.key === 'Z') undo();
    else if (e.key === 's' || e.key === 'S') { if (symBtn) symBtn.click(); }
    else if (e.key === 'r' || e.key === 'R') randomFlower();
  });

  /* ---------------- 闲置淡出 ---------------- */
  var idleTimer = null;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 3200);
  }
  ['pointermove', 'pointerdown', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, wake, { passive: true });
  });
  wake();

  /* ---------------- 启动 ---------------- */
  window.addEventListener('resize', function () {
    // 画布内容会丢，先快照再恢复
    var keep = snaps.length ? null : null;
    var old = null;
    try { old = ctx.getImageData(0, 0, cv.width, cv.height); } catch (e) { }
    resize();
    if (old && old.width === cv.width && old.height === cv.height) {
      ctx.putImageData(old, 0, 0);
    }
  }, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 240); });

  buildPalette();
  resize();
  // 开场自动画一朵，展示效果
  setTimeout(randomFlower, 400);
})();
</script>
</body>
</html>
