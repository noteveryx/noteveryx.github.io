<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<link rel="icon" type="image/png" href="../assets/image/favicon-round.png">
<link rel="apple-touch-icon" href="../assets/image/logo.png">
<title>噪声壁纸</title>
<link rel="stylesheet" href="../assets/css/palette-kit.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#0d0d12;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#fff;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  }
  canvas{position:fixed;inset:0;display:block;width:100%;height:100%;}
  .ui{position:fixed;z-index:5;opacity:1;transition:opacity .55s cubic-bezier(.3,.8,.3,1);}
  body.idle .ui{opacity:.15;}
  body.idle .ui:hover{opacity:1;}
  .back{
    top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));
    width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(12,16,24,.42);border:1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;text-decoration:none;
    transition:background-color .2s ease,transform .12s ease;
  }
  .back:hover{background:rgba(20,26,38,.7);}
  .back:active{transform:scale(.94);}
  .back svg{width:15px;height:15px;display:block;}
  .tools{
    right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px;align-items:center;
  }
  .btn{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(12,16,24,.42);border:1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;cursor:pointer;
    font-family:inherit;font-size:15px;line-height:1;outline:none;padding:0;
    transition:background-color .2s ease,transform .12s ease;
  }
  .btn:hover{background:rgba(20,26,38,.7);}
  .btn:active{transform:scale(.93);}
  .label{
    left:calc(18px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));
    font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.55);
    pointer-events:none;user-select:none;
  }
  .label b{font-weight:600;letter-spacing:.16em;color:rgba(255,255,255,.9);}
</style>
  <script src="../assets/js/fs-kit.js" defer></script>
</head>
<body>
<canvas id="cv"></canvas>

<a class="ui back" href="../x.html" title="返回" aria-label="返回">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</a>

<div class="ui tools">
  <div class="pk" id="pk" data-pk="noise" data-placement="left"></div>
  <button class="btn" id="regenBtn" type="button" title="换一张（R）">↻</button>
  <button class="btn" id="saveBtn" type="button" title="保存 PNG">⤓</button>
</div>

<div class="ui label" id="label">Noise · <b>噪声壁纸</b></div>

<script src="../assets/js/palette-kit.js"></script>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d', { alpha: false });
  var W = 0, H = 0;

  /* 低分辨率生成 + 分形噪声（value noise 多倍频），再放大铺满屏幕 */
  var GW = 320, GH = 200;              // 生成尺寸（4:3 比例，与手机壁纸接近）
  var grid = [];                       // 随机格点
  var GRID = 8;                        // 噪声格子密度

  var baseHex = '#7c5cff';
  var rgb = { r: 124, g: 92, b: 255 };
  var octaves = 4;
  var scale = 3.2;

  function setColor(hex) {
    baseHex = hex;
    rgb = window.PaletteKit.hex2rgb(hex) || rgb;
    var lbl = document.getElementById('label');
    if (lbl) lbl.innerHTML = 'Noise · <b>' + hex.toUpperCase() + '</b>';
    generate();
  }

  function makeGrid() {
    grid.length = 0;
    for (var i = 0; i <= GRID; i++) {
      grid[i] = [];
      for (var j = 0; j <= GRID; j++) grid[i][j] = Math.random();
    }
  }

  function smooth(t) { return t * t * (3 - 2 * t); }

  /* value noise：双线性 + smoothstep */
  function noise(x, y) {
    var gx = x * GRID, gy = y * GRID;
    var x0 = Math.floor(gx), y0 = Math.floor(gy);
    var fx = smooth(gx - x0), fy = smooth(gy - y0);
    var a = grid[x0 % GRID][y0 % GRID];
    var b = grid[(x0 + 1) % GRID][y0 % GRID];
    var c = grid[x0 % GRID][(y0 + 1) % GRID];
    var d = grid[(x0 + 1) % GRID][(y0 + 1) % GRID];
    var top = a + (b - a) * fx;
    var bot = c + (d - c) * fx;
    return top + (bot - top) * fy;
  }

  function fbm(x, y) {
    var v = 0, amp = 0.5, f = 1, norm = 0;
    for (var o = 0; o < octaves; o++) {
      v += noise(x * f, y * f) * amp;
      norm += amp;
      amp *= 0.52;
      f *= 2;
    }
    return v / norm;
  }

  var buf = document.createElement('canvas');
  var bctx = buf.getContext('2d');

  function generate() {
    makeGrid();
    buf.width = GW; buf.height = GH;
    var img = bctx.createImageData(GW, GH);
    var d = img.data;
    var hsl = window.PaletteKit.rgb2hsl(rgb.r, rgb.g, rgb.b);

    for (var y = 0; y < GH; y++) {
      for (var x = 0; x < GW; x++) {
        var n = fbm(x / GW * scale, y / GH * scale);
        // 加一点边缘暗角
        var dx = x / GW - 0.5, dy = y / GH - 0.5;
        var vig = 1 - Math.min(1, Math.sqrt(dx * dx + dy * dy) * 1.5) * 0.55;
        n = Math.pow(Math.max(0, Math.min(1, n * vig)), 1.25);

        var hue = (hsl.h + (n - 0.5) * 90 + 360) % 360;
        var c = window.PaletteKit.hsl2rgb(hue, Math.min(1, hsl.s * (0.5 + n * 0.9)), Math.min(0.96, n * 0.85 + 0.04));
        var i = (y * GW + x) * 4;
        d[i] = c.r; d[i + 1] = c.g; d[i + 2] = c.b; d[i + 3] = 255;
      }
    }
    bctx.putImageData(img, 0, 0);
    paint();
  }

  function paint() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    // 铺满屏幕（保持比例，居中裁切）
    var s = Math.max(cv.width / GW, cv.height / GH);
    var dw = GW * s, dh = GH * s;
    ctx.drawImage(buf, (cv.width - dw) / 2, (cv.height - dh) / 2, dw, dh);

    // 细腻颗粒
    ctx.globalAlpha = 0.05;
    for (var i = 0; i < 2600; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? '#fff' : '#000';
      ctx.fillRect(Math.random() * cv.width, Math.random() * cv.height, 1.4, 1.4);
    }
    ctx.globalAlpha = 1;
  }

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    paint();
  }

  var regenBtn = document.getElementById('regenBtn');
  if (regenBtn) regenBtn.addEventListener('click', generate);
  document.addEventListener('keydown', function (e) { if (e.key === 'r' || e.key === 'R') generate(); });

  var saveBtn = document.getElementById('saveBtn');
  if (saveBtn) saveBtn.addEventListener('click', function () {
    try {
      var out = document.createElement('canvas');
      out.width = 1440; out.height = 2880;    // 竖版 2x，适合当手机壁纸
      var o = out.getContext('2d');
      o.imageSmoothingEnabled = true;
      o.imageSmoothingQuality = 'high';
      var s = Math.max(out.width / GW, out.height / GH);
      var dw = GW * s, dh = GH * s;
      o.drawImage(buf, (out.width - dw) / 2, (out.height - dh) / 2, dw, dh);
      out.toBlob(function (blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'noise-' + new Date().toISOString().slice(0, 10) + '-' + Date.now() % 10000 + '.png';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
      }, 'image/png');
    } catch (e) { }
  });

  /* ---------------- 闲置淡出 ---------------- */
  var idleTimer = null;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 3000);
  }
  ['pointermove', 'pointerdown', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, wake, { passive: true });
  });
  wake();

  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 220); });

  var pk = window.PaletteKit.mount(document.getElementById('pk'), {
    value: '#7c5cff',
    onChange: function (c) { setColor(c); }
  });
  setColor(pk.get());
  resize();
})();
</script>
</body>
</html>
