<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f9fd">
<link rel="icon" type="image/png" href="../assets/image/favicon-round.png">
<link rel="apple-touch-icon" href="../assets/image/logo.png">
<title>专注番茄钟</title>
<link rel="stylesheet" href="../assets/css/theme-kit.css">
<link rel="stylesheet" href="../assets/css/themes.css">
<link rel="stylesheet" href="../assets/css/toolbox.css">
<script>try{var t=localStorage.getItem('tk_theme');document.documentElement.setAttribute('data-theme',['emerald','midnight','sunset','violet','ink'].indexOf(t)>-1?t:'violet')}catch(e){}</script>
<script src="../assets/js/theme-kit.js" defer></script>
<script src="../assets/js/toolbox.js" defer></script>
<style>
  .pz-stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0 4px;}
  .pz-ring{position:relative;width:min(280px,74vw);aspect-ratio:1;}
  .pz-ring svg{width:100%;height:100%;display:block;}
  .pz-ring .track{fill:none;stroke:var(--line);stroke-width:9;}
  .pz-ring .prog{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;
    transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .35s linear,stroke .3s ease;}
  .pz-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
  .pz-time{font:800 clamp(34px,10vw,50px)/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .pz-phase{font-size:12.5px;color:var(--muted);font-weight:600;}
  .pz-round{font-size:11px;color:var(--muted);opacity:.85;margin-top:6px;height:10px;}
  .pz-dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block;margin:0 3px;}
  .pz-dot.on{background:var(--accent);}
</style>
</head>
<body class="tb-page">
<div id="tbRoot"></div>

<script>
(function () {
  'use strict';
  var el = function () { return ToolBox.el.apply(null, arguments); };
  var C = 2 * Math.PI * 88;          // r=88 的圆周长

  /* ==========================================================
     白噪音：全部用 Web Audio 实时合成，不加载任何音频文件
     ========================================================== */
  var actx = null, master = null, noiseNodes = [], masterVol = 0.5;

  function ensureAudio() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = 0;
      master.connect(actx.destination);
    }
    if (actx.state === 'suspended' && actx.resume) actx.resume();
    return actx;
  }

  function noiseBuffer(ctx, seconds, type) {
    var len = Math.floor(ctx.sampleRate * seconds);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    var i, w;
    if (type === 'white') {
      for (i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } else if (type === 'brown') {
      var last = 0;
      for (i = 0; i < len; i++) {
        w = Math.random() * 2 - 1;
        last = (last + 0.02 * w) / 1.02;
        d[i] = last * 3.5;
      }
    } else {
      var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (i = 0; i < len; i++) {
        w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179;
        b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520;
        b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522;
        b5 = -0.7616 * b5 - w * 0.0168980;
        d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
        b6 = w * 0.115926;
      }
    }
    return buf;
  }

  var NOISE_CFG = {
    rain: { type: 'white', filter: 'lowpass', freq: 1500, q: 0.7, gain: 0.32, lfo: 0 },
    wind: { type: 'pink', filter: 'bandpass', freq: 460, q: 1.3, gain: 0.45, lfo: 0.14 },
    wave: { type: 'brown', filter: 'lowpass', freq: 760, q: 0.9, gain: 0.55, lfo: 0.30 },
    fire: { type: 'brown', filter: 'lowpass', freq: 520, q: 0.9, gain: 0.48, lfo: 0.12 }
  };

  function stopNoise() {
    noiseNodes.forEach(function (n) {
      try { if (n.stop) n.stop(); } catch (e) { }
      try { n.disconnect(); } catch (e) { }
    });
    noiseNodes = [];
    if (master) master.gain.value = 0;
  }

  function startNoise(kind) {
    var ctx = ensureAudio();
    if (!ctx) { ToolBox.toast('当前浏览器不支持 Web Audio'); return; }
    stopNoise();
    var cfg = NOISE_CFG[kind];
    if (!cfg) return;

    var src = ctx.createBufferSource();
    src.buffer = noiseBuffer(ctx, 5, cfg.type);
    src.loop = true;

    var filt = ctx.createBiquadFilter();
    filt.type = cfg.filter;
    filt.frequency.value = cfg.freq;
    filt.Q.value = cfg.q;

    var g = ctx.createGain();
    g.gain.value = cfg.gain;

    src.connect(filt);
    filt.connect(g);
    g.connect(master);
    src.start();
    noiseNodes.push(src);

    if (cfg.lfo) {
      var osc = ctx.createOscillator();
      osc.frequency.value = 0.07;
      var lg = ctx.createGain();
      lg.gain.value = cfg.gain * cfg.lfo;
      osc.connect(lg);
      lg.connect(g.gain);
      osc.start();
      noiseNodes.push(osc);
    }
    master.gain.setTargetAtTime(masterVol, ctx.currentTime, 0.4);
  }

  function ding() {
    var ctx = ensureAudio();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    [523.25, 659.25, 783.99].forEach(function (f, i) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      var at = t0 + i * 0.17;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.25, at + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.8);
      o.connect(g); g.connect(ctx.destination);
      o.start(at);
      o.stop(at + 0.9);
    });
  }

  /* ==========================================================
     状态
     ========================================================== */
  var PHASES = {
    focus: { name: '专注', color: 'var(--accent)' },
    short: { name: '短休息', color: '#2dd4bf' },
    long: { name: '长休息', color: '#38bdf8' }
  };

  var cfg = { focus: 25, short: 5, long: 15, autoStart: false, sound: 'none', notify: false };
  try {
    var saved = JSON.parse(localStorage.getItem('tb_pomodoro_cfg') || '{}');
    for (var k in saved) if (Object.prototype.hasOwnProperty.call(saved, k)) cfg[k] = saved[k];
  } catch (e) { }
  function saveCfg() {
    try { localStorage.setItem('tb_pomodoro_cfg', JSON.stringify(cfg)); } catch (e) { }
  }

  var stats = loadStats();
  function loadStats() {
    var today = new Date().toISOString().slice(0, 10);
    try {
      var s = JSON.parse(localStorage.getItem('tb_pomodoro_stats') || '{}');
      if (!s || s.date !== today) return { date: today, count: 0, minutes: 0, days: (s && s.days) || {} };
      return s;
    } catch (e) { return { date: today, count: 0, minutes: 0, days: {} }; }
  }
  function saveStats() {
    try { localStorage.setItem('tb_pomodoro_stats', JSON.stringify(stats)); } catch (e) { }
  }

  var state = {
    phase: 'focus',
    total: cfg.focus * 60,
    left: cfg.focus * 60,
    running: false,
    round: 0,
    endAt: 0
  };

  function boot() {
    ToolBox.mount(document.getElementById('tbRoot'), {
      title: '专注番茄钟',
      sub: '计时 · 白噪音 · 今日战绩',
      storageKey: 'tb_pomodoro',
      tabs: [{ id: 'main', name: '番茄钟', render: renderMain }]
    });
  }

  function renderMain(panel) {
    /* ---------- 圆环 ---------- */
    var stage = el('div', { class: 'tb-card' });
    var box = el('div', { class: 'pz-stage' });
    var ring = el('div', { class: 'pz-ring' });
    ring.innerHTML =
      '<svg viewBox="0 0 200 200" aria-hidden="true">' +
      '<circle class="track" cx="100" cy="100" r="88"></circle>' +
      '<circle class="prog" cx="100" cy="100" r="88" stroke-dasharray="' +
      C.toFixed(1) + '" stroke-dashoffset="0"></circle>' +
      '</svg>';
    var center = el('div', { class: 'pz-center' });
    var timeEl = el('div', { class: 'pz-time', text: '25:00' });
    var phaseEl = el('div', { class: 'pz-phase', text: '专注' });
    var roundEl = el('div', { class: 'pz-round' });
    center.appendChild(timeEl);
    center.appendChild(phaseEl);
    center.appendChild(roundEl);
    ring.appendChild(center);
    box.appendChild(ring);
    stage.appendChild(box);

    var ctrl = el('div', { class: 'tb-row', style: 'justify-content:center;margin-top:6px' });
    var btnStart = el('button', { class: 'tb-btn primary', type: 'button', text: '开始' });
    var btnReset = el('button', { class: 'tb-btn', type: 'button', text: '重置' });
    var btnSkip = el('button', { class: 'tb-btn', type: 'button', text: '跳过' });
    ctrl.appendChild(btnStart);
    ctrl.appendChild(btnReset);
    ctrl.appendChild(btnSkip);
    stage.appendChild(ctrl);
    panel.appendChild(stage);

    /* ---------- 时长与选项 ---------- */
    var c1 = el('div', { class: 'tb-card' });
    c1.appendChild(el('div', { class: 'tb-card-title', text: '时长设置（分钟）' }));
    var g = el('div', { class: 'tb-grid c3' });
    [['focus', '专注'], ['short', '短休息'], ['long', '长休息']].forEach(function (it) {
      var f = el('div', { class: 'tb-field' });
      f.appendChild(el('label', { text: it[1] }));
      var inp = el('input', { class: 'tb-in', type: 'number', min: '1', max: '180', value: String(cfg[it[0]]) });
      inp.addEventListener('change', function () {
        var v = Math.max(1, Math.min(180, parseInt(inp.value, 10) || cfg[it[0]]));
        inp.value = String(v);
        cfg[it[0]] = v;
        saveCfg();
        if (!state.running && state.phase === it[0]) {
          state.total = v * 60;
          state.left = v * 60;
          render();
        }
      });
      f.appendChild(inp);
      g.appendChild(f);
    });
    c1.appendChild(g);

    var optRow = el('div', { class: 'tb-row', style: 'margin-top:12px' });
    var cbAuto = el('input', { type: 'checkbox' });
    cbAuto.checked = !!cfg.autoStart;
    var labAuto = el('label', { class: 'tb-check' });
    labAuto.appendChild(cbAuto);
    labAuto.appendChild(el('span', { text: '自动开始下一阶段' }));
    optRow.appendChild(labAuto);

    var cbNotify = el('input', { type: 'checkbox' });
    cbNotify.checked = !!cfg.notify;
    var labNotify = el('label', { class: 'tb-check' });
    labNotify.appendChild(cbNotify);
    labNotify.appendChild(el('span', { text: '结束时发桌面通知' }));
    optRow.appendChild(labNotify);
    c1.appendChild(optRow);

    cbAuto.addEventListener('change', function () { cfg.autoStart = cbAuto.checked; saveCfg(); });
    cbNotify.addEventListener('change', function () {
      cfg.notify = cbNotify.checked;
      saveCfg();
      if (cbNotify.checked && 'Notification' in window && Notification.permission === 'default') {
        try { Notification.requestPermission(); } catch (e) { }
      }
    });
    panel.appendChild(c1);

    /* ---------- 白噪音 ---------- */
    var c2 = el('div', { class: 'tb-card' });
    c2.appendChild(el('div', { class: 'tb-card-title', text: '白噪音（实时合成，不加载音频文件）' }));
    var seg = el('div', { class: 'tb-seg' });
    var soundBtns = [];
    [{ id: 'none', name: '关闭' }, { id: 'rain', name: '雨声' }, { id: 'wind', name: '风声' },
    { id: 'wave', name: '海浪' }, { id: 'fire', name: '篝火' }].forEach(function (o) {
      var b = el('button', { type: 'button', text: o.name });
      b.classList.toggle('on', cfg.sound === o.id);
      b.addEventListener('click', function () {
        cfg.sound = o.id;
        saveCfg();
        soundBtns.forEach(function (x) { x.classList.toggle('on', x === b); });
        if (o.id === 'none') stopNoise();
        else startNoise(o.id);
      });
      soundBtns.push(b);
      seg.appendChild(b);
    });
    c2.appendChild(seg);

    var vol = el('input', { type: 'range', min: '0', max: '100', value: String(Math.round(masterVol * 100)), style: 'width:100%;margin-top:12px' });
    var volLabel = el('span', { class: 'tb-hint', text: '音量 ' + Math.round(masterVol * 100) + '%' });
    vol.addEventListener('input', function () {
      masterVol = parseInt(vol.value, 10) / 100;
      volLabel.textContent = '音量 ' + vol.value + '%';
      if (master && actx) master.gain.setTargetAtTime(masterVol, actx.currentTime, 0.1);
    });
    c2.appendChild(vol);
    c2.appendChild(volLabel);
    panel.appendChild(c2);

    /* ---------- 统计 ---------- */
    var c3 = el('div', { class: 'tb-card' });
    c3.appendChild(el('div', { class: 'tb-card-title', text: '今日战绩' }));
    var st = el('div', { class: 'tb-stats' });
    c3.appendChild(st);
    var streak = el('p', { class: 'tb-hint', style: 'margin-top:10px' });
    c3.appendChild(streak);
    panel.appendChild(c3);

    function renderStats() {
      st.innerHTML = '';
      [['今日番茄', stats.count + ' 个'], ['专注时长', stats.minutes + ' 分钟'],
      ['累计天数', Object.keys(stats.days || {}).length + ' 天'], ['当前轮次', '第 ' + (state.round + 1) + ' 个']]
        .forEach(function (it) {
          var s = el('div', { class: 'tb-stat' });
          s.appendChild(el('div', { class: 'v', text: String(it[1]) }));
          s.appendChild(el('div', { class: 'k', text: it[0] }));
          st.appendChild(s);
        });
      var days = stats.days || {};
      var keys = Object.keys(days).sort().reverse().slice(0, 7);
      streak.innerHTML = keys.length
        ? '最近 7 天：' + keys.map(function (k) { return k.slice(5) + ' <b>' + days[k] + '</b>'; }).join('　')
        : '还没有记录，完成一个番茄就会出现在这里';
    }

    /* ---------- 渲染 ---------- */
    var progEl = ring.querySelector('.prog');
    function render() {
      var m = Math.floor(state.left / 60), s = state.left % 60;
      var txt = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
      timeEl.textContent = txt;
      phaseEl.textContent = PHASES[state.phase].name + (state.running ? '' : '（已暂停）');
      document.title = state.running ? txt + ' · ' + PHASES[state.phase].name : '专注番茄钟';

      var ratio = state.total ? (state.total - state.left) / state.total : 0;
      progEl.setAttribute('stroke-dashoffset', (C * (1 - ratio)).toFixed(2));
      progEl.style.stroke = PHASES[state.phase].color;

      var dots = '';
      var inCycle = state.round % 4;
      for (var i = 0; i < 4; i++) {
        dots += '<span class="pz-dot' + (i < inCycle ? ' on' : '') + '"></span>';
      }
      roundEl.innerHTML = dots;

      btnStart.textContent = state.running ? '暂停' : '开始';
      renderStats();
    }

    /* ---------- 计时 ---------- */
    setInterval(function () {
      if (!state.running) return;
      var left = Math.max(0, Math.round((state.endAt - Date.now()) / 1000));
      if (left !== state.left) {
        state.left = left;
        render();
      }
      if (left <= 0) complete();
    }, 250);

    function start() {
      if (state.left <= 0) state.left = state.total;
      state.endAt = Date.now() + state.left * 1000;
      state.running = true;
      render();
    }
    function pause() {
      state.left = Math.max(0, Math.round((state.endAt - Date.now()) / 1000));
      state.running = false;
      render();
    }
    function reset() {
      state.running = false;
      state.total = cfg[state.phase] * 60;
      state.left = state.total;
      render();
    }

    function complete() {
      state.running = false;
      ding();
      var wasFocus = state.phase === 'focus';

      if (wasFocus) {
        state.round++;
        stats.count++;
        stats.minutes += cfg.focus;
        stats.days = stats.days || {};
        var today = new Date().toISOString().slice(0, 10);
        stats.days[today] = (stats.days[today] || 0) + 1;
        saveStats();
      }

      state.phase = wasFocus ? (state.round % 4 === 0 ? 'long' : 'short') : 'focus';
      state.total = cfg[state.phase] * 60;
      state.left = state.total;

      ToolBox.toast(wasFocus ? '专注完成，休息一下' : '休息结束，继续加油');
      if (cfg.notify && 'Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(wasFocus ? '专注完成' : '休息结束', {
            body: wasFocus ? '已经专注了 ' + cfg.focus + ' 分钟，起来活动一下' : '回到工作吧'
          });
        } catch (e) { }
      }
      render();
      if (cfg.autoStart) setTimeout(start, 1200);
    }

    btnStart.addEventListener('click', function () { state.running ? pause() : start(); });
    btnReset.addEventListener('click', reset);
    btnSkip.addEventListener('click', function () {
      state.left = 1;
      state.endAt = Date.now() + 1000;
      state.running = true;
    });

    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
