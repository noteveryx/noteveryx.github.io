<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06090c">
<title>待机展示</title>
<link rel="icon" type="image/png" href="../assets/image/favicon-round.png">
<link rel="apple-touch-icon" href="../assets/image/logo.png">
<link rel="stylesheet" href="../assets/css/theme-kit.css">
<script>try{var t=localStorage.getItem('tk_theme');document.documentElement.setAttribute('data-theme',['emerald','midnight','sunset','violet','ink'].indexOf(t)>-1?t:'midnight')}catch(e){}</script>
<style>
  /* 默认 = 深海蓝（屏保感）；其余四套见下方 html[data-theme=…] 覆盖块 */
  :root {
    --bg1: #06090c;
    --bg2: #0b1016;
    --panel: #0b1016;
    --line: #1b2530;
    --text: #dfe9e4;
    --muted: #5d6f6a;
    --brand: #42b983;
    --brand-soft: rgba(66, 185, 131, .12);
    --glass: rgba(255, 255, 255, .04);
    --scrim: rgba(3, 5, 7, .88);
    --glow1: rgba(66, 185, 131, .08);
    --glow2: rgba(66, 185, 131, .05);
    --logo-glow: rgba(66, 185, 131, .35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background:
      radial-gradient(90% 60% at 50% 110%, var(--glow1), transparent 70%),
      radial-gradient(70% 50% at 50% -10%, var(--glow2), transparent 70%),
      var(--bg1);
    color: var(--text);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* ---------- 默认待机内容（屏保态） ---------- */
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 2.4vmin, 20px);
    padding: 32px 24px calc(70px + env(safe-area-inset-bottom)); /* 底部留出技术支持条的空间 */
    text-align: center;
  }
  .stage .logo {
    width: 52px; height: 52px;
    border-radius: 21%;
    box-shadow: 0 0 0 1px var(--line), 0 8px 30px -12px var(--logo-glow);
    animation: breathe 5s ease-in-out infinite;
  }
  /* 圆形模拟表盘：外圈呼吸光晕 + 缓慢旋转的虚线装饰环，指针由 JS 每秒驱动 */
  .clock-wrap {
    position: relative;
    width: clamp(150px, 36vmin, 216px);
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .clock-wrap::before {
    content: "";
    position: absolute;
    inset: -14%;
    border-radius: 50%;
    background: radial-gradient(circle, var(--glow1), transparent 68%);
    animation: breathe 5s ease-in-out infinite;
    pointer-events: none;
  }
  .clock-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px dashed var(--brand-soft);
    animation: spin 40s linear infinite;
    pointer-events: none;
  }
  .analog-clock { position: relative; width: 88%; height: 88%; display: block; }
  .analog-clock .ac-face {
    fill: var(--glass);
    stroke: var(--line);
    stroke-width: 1.5;
    transition: fill .28s ease, stroke .28s ease;
  }
  .analog-clock .ac-ticks line { stroke: var(--muted); stroke-width: 2; stroke-linecap: round; transition: stroke .28s ease; }
  .analog-clock .ac-ticks line.major { stroke: var(--text); stroke-width: 3; }
  .analog-clock line {
    stroke-linecap: round;
    transform-box: view-box;
    transform-origin: 50px 50px;
  }
  /* 指针不加 transform 过渡：59°→0° 的回绕会播放倒转动画 */
  .analog-clock .ac-h { stroke: var(--text); stroke-width: 4.6; transition: stroke .28s ease; }
  .analog-clock .ac-m { stroke: var(--text); stroke-width: 3; transition: stroke .28s ease; }
  .analog-clock .ac-s { stroke: var(--brand); stroke-width: 1.6; }
  .analog-clock .ac-pin { fill: var(--brand); transition: fill .28s ease; }
  .stage .clock {
    font-family: "Roboto Mono", "SF Mono", Monaco, Consolas, monospace;
    font-size: clamp(2.4rem, 10vmin, 4.4rem);
    font-weight: 700;
    letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--text);
  }
  .stage .clock span { color: var(--brand); }
  .stage .date { font-size: clamp(.85rem, 2.4vmin, 1.05rem); font-weight: 600; color: var(--muted); letter-spacing: .08em; }
  .stage .hint {
    margin-top: 6px;
    font-size: .8rem;
    color: var(--muted);
    letter-spacing: .12em;
    animation: breathe 5s ease-in-out infinite;
  }
  .stage-main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(12px, 2.4vmin, 20px);
  }

  /* ---------- PC 宽屏补充信息（窄屏隐藏） ---------- */
  .stage-side { display: none; }
  .cal-card {
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 16px 14px;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-title {
    font-size: .95rem;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--text);
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .cal-title:hover { color: var(--brand); }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav button {
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: .9rem;
    line-height: 1;
    cursor: pointer;
    outline: none; /* 触摸/点击后不出现虚线焦点框 */
    -webkit-tap-highlight-color: transparent;
    transition: color .14s, border-color .14s, transform .12s ease;
  }
  .cal-nav button:hover { color: var(--brand); border-color: var(--brand); }
  .cal-nav button:active { transform: scale(.92); }
  .cal-nav button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
  .cal-wd { font-size: .62rem; font-weight: 600; color: var(--muted); text-align: center; padding: 2px 0 4px; }
  .cal-d {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    min-height: 38px;
    padding: 2px 0;
    border-radius: 9px;
    color: var(--text);
    line-height: 1.12;
    transition: background-color .14s;
  }
  .cal-d-num { font-size: .78rem; font-variant-numeric: tabular-nums; }
  .cal-d-sub {
    font-size: .54rem;
    color: var(--muted);
    white-space: nowrap;
    min-height: .8em;
    letter-spacing: -.02em;
  }
  .cal-d-sub.term { color: var(--brand); font-weight: 700; }      /* 二十四节气 */
  .cal-d-sub.first { color: var(--text); opacity: .78; font-weight: 600; } /* 农历初一显示月名 */
  .cal-d.dim { color: var(--muted); opacity: .32; }
  .cal-d.today {
    background: var(--brand);
    color: #fff;
    font-weight: 700;
    box-shadow: 0 4px 14px -4px var(--logo-glow);
  }
  .cal-d.today .cal-d-sub { color: rgba(255, 255, 255, .82); }
  .cal-d.today .cal-d-sub.term { color: #fff; }
  /* 节气当天恰好是农历初一：小字让位给节气，用左上小点提示「月初」 */
  .cal-d.first-mark { position: relative; }
  .cal-d.first-mark::after {
    content: '';
    position: absolute;
    top: 5px;
    left: 6px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--brand);
    opacity: .72;
  }
  .cal-d.today.first-mark::after { background: #fff; opacity: .9; }
  .stat-list { display: grid; gap: 12px; padding: 2px 4px; }
  .stat { display: grid; gap: 6px; }
  .stat-top { display: flex; align-items: baseline; justify-content: space-between; font-size: .7rem; color: var(--muted); }
  .stat-top b {
    font-family: "Roboto Mono", "SF Mono", Menlo, Consolas, monospace;
    font-size: .76rem;
    color: var(--text);
    font-weight: 700;
  }
  .stat-bar { height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .stat-bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--brand); transition: width .6s ease; }

  /* 宽且有高度：改为左右两栏，右侧补充月历与进度；尺寸随屏幕一起放大，避免大屏四周空旷 */
  @media (min-width: 1024px) and (min-height: 620px) {
    .stage {
      flex-direction: row;
      gap: clamp(56px, 9vw, 220px);
      padding: 44px 48px calc(78px + env(safe-area-inset-bottom));
    }
    .stage-main { gap: clamp(16px, 2.8vmin, 30px); }
    .stage .logo { width: clamp(56px, 6.4vmin, 96px); height: clamp(56px, 6.4vmin, 96px); }
    .clock-wrap { width: clamp(210px, 33vmin, 540px); }
    .stage .clock { font-size: clamp(3.4rem, 13.5vmin, 10rem); }
    .stage .date { font-size: clamp(1rem, 2.7vmin, 1.7rem); }
    .stage .hint { font-size: clamp(.82rem, 1.7vmin, 1.25rem); }
    .stage-side {
      display: flex;
      flex-direction: column;
      gap: clamp(20px, 2.6vmin, 40px);
      width: clamp(330px, 27vw, 660px);
      text-align: left;
      animation: sideIn .6s cubic-bezier(.2, .7, .3, 1) both;
    }
    .cal-card { padding: clamp(16px, 2vmin, 26px) clamp(16px, 2vmin, 26px) clamp(14px, 1.8vmin, 22px); }
    .cal-head { margin-bottom: clamp(10px, 1.4vmin, 18px); }
    .cal-title { font-size: clamp(.98rem, 1.9vmin, 1.4rem); }
    .cal-nav { gap: 8px; }
    .cal-nav button { width: clamp(26px, 3vmin, 38px); height: clamp(26px, 3vmin, 38px); font-size: clamp(.9rem, 1.6vmin, 1.2rem); border-radius: 9px; }
    .cal-wd { font-size: clamp(.64rem, 1.2vmin, 1rem); padding: 2px 0 clamp(4px, .9vmin, 10px); }
    .cal-d { min-height: clamp(40px, 4.9vmin, 70px); border-radius: 10px; }
    .cal-d-num { font-size: clamp(.8rem, 1.5vmin, 1.22rem); }
    .cal-d-sub { font-size: clamp(.55rem, 1.05vmin, .88rem); }
    .stat-list { gap: clamp(12px, 1.8vmin, 20px); }
    .stat { gap: clamp(6px, .9vmin, 10px); }
    .stat-top { font-size: clamp(.72rem, 1.25vmin, .98rem); }
    .stat-top b { font-size: clamp(.78rem, 1.35vmin, 1.05rem); }
    .stat-bar { height: clamp(4px, .6vmin, 7px); }
  }
  @keyframes sideIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* 手机竖屏双屏切换的指示点（桌面/横屏不显示） */
  .view-dots {
    display: none;
    position: fixed;
    left: 50%;
    bottom: calc(54px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    gap: 8px;
    z-index: 6;
  }
  .view-dots button {
    width: 8px;
    height: 8px;
    padding: 0;
    border: none;
    border-radius: 999px;
    background: var(--line);
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: width .26s cubic-bezier(.3, .8, .3, 1), background-color .26s ease;
  }
  .view-dots button.on { width: 22px; background: var(--brand); }
  .view-dots button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }

  /* ---------- 循环文字（跑马灯态） ---------- */
  .type-wrap {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 3vmin, 26px);
    padding: 24px 0 calc(70px + env(safe-area-inset-bottom));
    text-align: center;
  }
  .mq-logo {
    width: clamp(40px, 7vmin, 56px); height: clamp(40px, 7vmin, 56px);
    border-radius: 21%;
    box-shadow: 0 0 0 1px var(--line), 0 8px 30px -12px var(--logo-glow);
    animation: breathe 5s ease-in-out infinite;
  }
  .marquee-box {
    position: relative;
    width: min(1100px, 94vw); /* 电脑端居中限宽，手机端近全屏 */
    overflow: hidden;
    padding: clamp(10px, 2.6vmin, 24px) 0;
    cursor: pointer;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent);
  }
  /* 上下渐变装饰线 */
  .marquee-box::before, .marquee-box::after {
    content: "";
    position: absolute;
    left: 6%;
    right: 6%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line) 30%, var(--line) 70%, transparent);
    pointer-events: none;
  }
  .marquee-box::before { top: 0; }
  .marquee-box::after { bottom: 0; }
  .marquee-track {
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    will-change: transform; /* 内容由 JS 填充两份，WAAPI 无缝滚动 */
  }
  .mq-item {
    font-size: clamp(1.8rem, 6.5vmin, 3.4rem);
    font-weight: 700;
    color: var(--text);
    letter-spacing: .02em;
    padding: 0 .38em;
    transition: color .28s ease;
  }
  .mq-dot {
    font-style: normal;
    color: var(--brand);
    font-size: .5em;
    padding: 0 .38em;
    opacity: .85;
    transition: color .28s ease;
  }
  .mq-paused {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    font-size: .8rem;
    font-weight: 700;
    color: var(--brand);
    background: var(--panel); /* 实底：暂停时盖住底下的滚动文字，避免透出显脏 */
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 18px;
    box-shadow: 0 6px 24px -8px rgba(0, 0, 0, .35);
    pointer-events: none;
  }
  .marquee-box.paused .mq-paused { display: block; }
  .type-idx {
    font-family: "Roboto Mono", "SF Mono", Monaco, Consolas, monospace;
    font-size: .74rem;
    letter-spacing: .22em;
    color: var(--muted);
  }
  .standby-on .stage { display: none; }
  .standby-on .type-wrap { display: flex; }

  @keyframes blink { 50% { opacity: 0; } }
  @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 手机横屏：紧凑布局，保证一屏放得下 ---------- */
  @media (orientation: landscape) and (max-height: 520px) {
    .stage { gap: 7px; padding: 10px 24px calc(46px + env(safe-area-inset-bottom)); }
    .stage .logo { display: none; }
    .clock-wrap { width: min(32vh, 150px); }
    .clock-wrap::before { inset: -10%; }
    .stage .clock { font-size: clamp(1.5rem, 11vh, 2.6rem); }
    .stage .date { font-size: .8rem; }
    .stage .hint { display: none; }
    .type-wrap { gap: 8px; padding-bottom: calc(52px + env(safe-area-inset-bottom)); }
    .mq-logo { width: 34px; height: 34px; }
    .mq-item { font-size: clamp(1.3rem, 11vmin, 2.4rem); }
    .marquee-box { padding: 10px 0; }
    .type-idx { font-size: .66rem; }
    .tech { padding: 5px 10px; gap: 6px; }
  }

  /* ---------- 手机竖屏：时间 / 月历分两屏，上下滑动或点击切换 ---------- */
  @media (max-width: 1023px) and (orientation: portrait) {
    .stage { display: block; padding: 0; }
    .stage-main,
    .stage-side {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 16px calc(70px + env(safe-area-inset-bottom));
      transition: transform .42s cubic-bezier(.22, .75, .25, 1), opacity .3s ease;
      will-change: transform;
    }
    .stage-main { gap: 14px; }
    .stage-side {
      width: auto;
      gap: 0;
      transform: translateY(104%);
      opacity: 0;
      pointer-events: none;
      animation: none;
    }
    body.m-cal .stage-main { transform: translateY(-104%); opacity: 0; pointer-events: none; }
    body.m-cal .stage-side { transform: translateY(0); opacity: 1; pointer-events: auto; }

    .stage-side .stat-list { display: none; } /* 进度条留给 PC 宽屏 */
    .cal-card { width: min(370px, 94vw); padding: 14px 14px 12px; border-radius: 18px; }
    .cal-head { margin-bottom: 8px; }
    .cal-title { font-size: .92rem; }
    .cal-nav button { width: 26px; height: 26px; font-size: .86rem; }
    .cal-wd { font-size: .58rem; padding: 0 0 4px; }
    .cal-d { min-height: 36px; }
    .cal-d-num { font-size: .74rem; }
    .cal-d-sub { font-size: .52rem; }
    .cal-d.first-mark::after { top: 3px; left: 4px; }

    .view-dots { display: flex; }
  }
  /* 竖屏但屏幕矮（老机型）：进一步压缩 */
  @media (max-width: 1023px) and (orientation: portrait) and (max-height: 700px) {
    .stage-main,
    .stage-side { padding: 12px 14px calc(62px + env(safe-area-inset-bottom)); }
    .stage-main { gap: 10px; }
    .cal-card { width: min(344px, 94vw); padding: 10px 10px 8px; border-radius: 15px; }
    .cal-d { min-height: 28px; }
    .cal-d-num { font-size: .68rem; }
    .cal-d-sub { font-size: .46rem; }
    .cal-nav button { width: 22px; height: 22px; }
  }
  /* 超矮竖屏（320×568 一类）：收掉 logo、缩表盘、月历再压扁 */
  @media (max-width: 1023px) and (orientation: portrait) and (max-height: 620px) {
    .stage-main,
    .stage-side { padding: 8px 12px calc(56px + env(safe-area-inset-bottom)); }
    .stage-main { gap: 8px; }
    .stage .logo { display: none; }
    .clock-wrap { width: min(52vmin, 150px); }
    .clock-wrap::before { inset: -8%; }
    .stage .clock { font-size: clamp(1.6rem, 9vmin, 2.2rem); }
    .cal-card { width: min(318px, 94vw); padding: 8px 8px 6px; border-radius: 12px; }
    .cal-head { margin-bottom: 2px; }
    .cal-title { font-size: .8rem; }
    .cal-nav button { width: 20px; height: 20px; font-size: .74rem; }
    .cal-wd { font-size: .5rem; padding: 0 0 1px; }
    .cal-d { min-height: 23px; }
    .cal-d-num { font-size: .62rem; }
    .cal-d-sub { font-size: .4rem; }
    .cal-d.first-mark::after { top: 2px; left: 3px; width: 2.5px; height: 2.5px; }
  }

  /* ---------- 手机横屏：时钟在左，月历在右并排 ---------- */
  @media (orientation: landscape) and (max-height: 520px) and (min-width: 620px) {
    .stage { flex-direction: row; gap: 18px; padding: 8px 18px calc(44px + env(safe-area-inset-bottom)); }
    .stage-side {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: min(280px, 38vw);
      animation: sideIn .6s cubic-bezier(.2, .7, .3, 1) both;
    }
    .stage-side .stat-list { display: none; }
    .cal-card { padding: 6px 9px 5px; border-radius: 12px; }
    .cal-head { margin-bottom: 3px; }
    .cal-title { font-size: .78rem; }
    .cal-nav { gap: 4px; }
    .cal-nav button { width: 20px; height: 20px; font-size: .74rem; border-radius: 6px; }
    .cal-wd { font-size: .52rem; padding: 0 0 1px; }
    .cal-d { min-height: 21px; border-radius: 6px; gap: 0; }
    .cal-d-num { font-size: .62rem; }
    .cal-d-sub { font-size: .42rem; min-height: .7em; }
    .cal-d.first-mark::after { top: 2px; left: 3px; width: 2.5px; height: 2.5px; }
  }

  /* ---------- 顶部按钮 ---------- */
  .tools {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top));
    right: 60px; /* 给右侧 theme-kit 主题按钮让位 */
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  .tool-btn {
    border: 1px solid var(--line);
    background: var(--glass);
    color: var(--muted);
    font-family: inherit;
    font-size: .76rem;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: color .16s, border-color .16s, background-color .16s;
  }
  .tool-btn:hover { color: var(--brand); border-color: var(--brand); background: var(--brand-soft); }
  .tool-btn:active { transform: scale(.96); }

  /* ---------- 编辑面板 ---------- */
  .editor {
    position: fixed;
    inset: 0;
    z-index: 200; /* 高于 theme-kit 的按钮层，编辑时不被浮层按钮打扰 */
    display: none;
    align-items: center;

<script>
(function () {

  /* ---------- 文字样式（字体 / 字号 / 颜色，随跑马灯保存） ---------- */

    if (typeof savedStyle.color === 'string' && /^#[0-9a-fA-F]{6}$/.test(savedStyle.color)) style.color = savedStyle.color;

  /* 字号值 → CSS 值：0=默认跟随主题；'half'/'full'=视口档位；数字=px 微调 */
  function sizeCss(v) {

    if (v === 'full') return '85vh';

    try { localStorage.setItem(STYLE_KEY, JSON.stringify(style)); } catch (e) { /* 忽略 */ }
  }
  function syncStyleUI() {
    selFont.value = style.font;
    Array.prototype.forEach.call(sizeSeg.querySelectorAll('button'), function (b) {

    });
    Array.prototype.forEach.call(speedSeg.querySelectorAll('button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-v') === String(style.speed));
    });
    if (typeof style.size === 'number' && style.size) {
      rngSize.value = String(style.size);
      sizeVal.textContent = style.size + 'px';
    } else {
      sizeVal.textContent = style.size === 'half' ? '45vh' : style.size === 'full' ? '85vh' : '自定义';

  } catch (e) { /* 忽略 */ }

  var TERMS = ['小寒', '大寒', '立春', '雨水', '惊蛰', '春分', '清明', '谷雨',
    '立夏', '小满', '芒种', '夏至', '小暑', '大暑', '立秋', '处暑',
    '白露', '秋分', '寒露', '霜降', '立冬', '小雪', '大雪', '冬至'];
  function sunLongitude(jd) {
    var T = (jd - 2451545.0) / 36525;
    var L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;      // 平黄经
    var M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) * Math.PI / 180; // 平近点角
    var C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M)
      + (0.019993 - 0.000101 * T) * Math.sin(2 * M)
      + 0.000289 * Math.sin(3 * M);
    var omega = (125.04 - 1934.136 * T) * Math.PI / 180;
    var lambda = L0 + C - 0.00569 - 0.00478 * Math.sin(omega); // 视黄经
    return ((lambda % 360) + 360) % 360;
  }
  function buildTerms(year) {
    var map = {};
    for (var i = 0; i < 24; i++) {
      var target = (285 + i * 15) % 360; // 小寒 285° 起，每节气 15°
      var jd = Date.UTC(year, 0, 6 + i * 15.2184) / 86400000 + 2440587.5; // 初估
      for (var k = 0; k < 8; k++) {
        var diff = target - sunLongitude(jd);
        while (diff > 180) diff -= 360;
        while (diff < -180) diff += 360;
        if (Math.abs(diff) < 1e-7) break;
        jd += diff / 0.9856474; // 太阳每日约走 0.9856°
      }
      var bj = new Date((jd - 2440587.5) * 86400000 + 8 * 3600000); // 换算北京时间
      map[(bj.getUTCMonth() + 1) + '-' + bj.getUTCDate()] = TERMS[i];
    }
    return map;
  }
  var termsYear = 0, termsMap = {};

  function renderCal(y, m) {
    calY = y; calM = m;
    if (calTitle) calTitle.textContent = y + '年' + (m + 1) + '月';
    if (!calGrid) return;
    // 只清理日期格子，保留周一~周日的表头
    Array.prototype.slice.call(calGrid.querySelectorAll('.cal-d')).forEach(function (el) {
      el.parentNode.removeChild(el);
    });
    var now = new Date();
    var isCurMonth = now.getFullYear() === y && now.getMonth() === m;
    var offset = (new Date(y, m, 1).getDay() + 6) % 7; // 周一为第一列
    var days = new Date(y, m + 1, 0).getDate();
    if (termsYear !== y) { termsMap = buildTerms(y); termsYear = y; }
    var frag = document.createDocumentFragment();
    for (var i = 0; i < offset; i++) {
      var blank = document.createElement('span');
      blank.className = 'cal-d dim';
      frag.appendChild(blank);
    }
    for (var d = 1; d <= days; d++) {
      var cell = document.createElement('span');
      var isToday = isCurMonth && d === now.getDate();
      cell.className = 'cal-d' + (isToday ? ' today' : '');
      var num = document.createElement('span');
      num.className = 'cal-d-num';
      num.textContent = d;
      var sub = document.createElement('span');
      sub.className = 'cal-d-sub';
      var term = termsMap[(m + 1) + '-' + d];
      var lu = lunarOf(new Date(Date.UTC(y, m, d, 4))); // 北京正午，任何时区都落在同一天
      var luDay = lu ? (LUNAR_DAY_NAMES[lu.day - 1] || '') : '';
      if (term) {
        sub.textContent = term;          // 节气优先于农历日
        sub.classList.add('term');
        if (lu) cell.title = term + ' · 农历' + lu.month + luDay;
        if (lu && lu.isFirst) cell.classList.add('first-mark'); // 月初与节气同日：小点提示
      } else if (lu) {
        sub.textContent = lu.isFirst ? lu.month : luDay; // 初一带月名
        if (lu.isFirst) sub.classList.add('first');
        cell.title = '农历' + lu.month + luDay;
      }
      cell.appendChild(num);
      cell.appendChild(sub);
      frag.appendChild(cell);
    }
    calGrid.appendChild(frag);
  }
  function renderStats() {
    var n = new Date();
    var y = n.getFullYear();
    var yearStart = new Date(y, 0, 1), yearEnd = new Date(y + 1, 0, 1);
    var monthStart = new Date(y, n.getMonth(), 1), monthEnd = new Date(y, n.getMonth() + 1, 1);
    var wd = (n.getDay() + 6) % 7;
    var weekStart = new Date(y, n.getMonth(), n.getDate() - wd); // 本周一 0 点
    [
      ['Year', (n - yearStart) / (yearEnd - yearStart)],
      ['Month', (n - monthStart) / (monthEnd - monthStart)],
      ['Week', (n - weekStart) / (7 * 86400000)]
    ].forEach(function (s) {
      var pct = Math.max(0, Math.min(100, s[1] * 100));
      var bar = document.getElementById('bar' + s[0]);
      var txt = document.getElementById('pct' + s[0]);
      if (bar) bar.style.width = pct.toFixed(1) + '%';
      if (txt) txt.textContent = pct.toFixed(1) + '%';
    });
  }
  var calPrev = document.getElementById('calPrev');
  var calNext = document.getElementById('calNext');
  if (calTitle) {
    calTitle.addEventListener('click', function () {
      var n = new Date();
      calUserPicked = false;
      renderCal(n.getFullYear(), n.getMonth());
    });
  }
  if (calPrev) {
    calPrev.addEventListener('click', function () {
      var m = calM - 1, y = calY;
      if (m < 0) { m = 11; y--; }
      calUserPicked = true;
      renderCal(y, m);
    });
  }
  if (calNext) {
    calNext.addEventListener('click', function () {
      var m = calM + 1, y = calY;
      if (m > 11) { m = 0; y++; }
      calUserPicked = true;
      renderCal(y, m);
    });
  }
  var nowInit = new Date();
  renderCal(nowInit.getFullYear(), nowInit.getMonth());
  renderStats();

  /* ---------- 默认待机：圆形表盘 + 数字时钟（每秒驱动） ---------- */
  var sbClock = document.getElementById('sbClock');
  var sbDate = document.getElementById('sbDate');
  var acH = document.querySelector('.analog-clock .ac-h');
  var acM = document.querySelector('.analog-clock .ac-m');
  var acS = document.querySelector('.analog-clock .ac-s');
  var WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  function pad(v) { return (v < 10 ? '0' : '') + v; }
  // 12 个刻度：0/3/6/9 点为主刻度
  (function buildTicks() {
    var g = document.getElementById('acTicks');
    if (!g) return;
    for (var i = 0; i < 12; i++) {
      var l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l.setAttribute('x1', '50'); l.setAttribute('y1', '6.5');
      l.setAttribute('x2', '50'); l.setAttribute('y2', i % 3 === 0 ? '12.5' : '10.5');
      l.setAttribute('transform', 'rotate(' + i * 30 + ' 50 50)');
      if (i % 3 === 0) l.setAttribute('class', 'major');
      g.appendChild(l);
    }
  })();
  function setHands(n) {
    var h = n.getHours() % 12, m = n.getMinutes(), s = n.getSeconds();
    if (acH) acH.style.transform = 'rotate(' + (h * 30 + m * 0.5) + 'deg)';
    if (acM) acM.style.transform = 'rotate(' + (m * 6 + s * 0.1) + 'deg)'; /* 分针平滑走 */
    if (acS) acS.style.transform = 'rotate(' + (s * 6) + 'deg)';
  }
  function tickClock() {
    var n = new Date();
    if (sbClock) sbClock.innerHTML = pad(n.getHours()) + '<span>:</span>' + pad(n.getMinutes());
    if (sbDate) sbDate.textContent = n.getFullYear() + '年' + pad(n.getMonth() + 1) + '月' + pad(n.getDate()) + '日 ' + WEEK[n.getDay()];
    setHands(n);
    // 侧栏：跨天时刷新月历（手动翻月则保持视图）
    var key = n.getFullYear() + '-' + n.getMonth() + '-' + n.getDate();
    if (key !== calDateKey) {
      calDateKey = key;
      if (!calUserPicked) renderCal(n.getFullYear(), n.getMonth());
      else if (calY === n.getFullYear() && calM === n.getMonth()) renderCal(calY, calM);
    }
    renderStats();
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* ---------- 跑马灯循环：所有条目拼接两份，无缝水平滚动，点击暂停 / 继续 ---------- */
  var typeIdx = document.getElementById('typeIdx');
  var mqBox = document.getElementById('marqueeBox');
  var mqTrack = document.getElementById('marqueeTrack');
  var mqAnim = null;

  function buildMarquee(texts) {
    var list = (texts && texts.length) ? texts : lines;
    // 全屏字号态：隐藏 logo / 进度 / 装饰线 / 技术支持条等，只留滚动大字
    body.classList.toggle('text-full', style.size === 'full' && list.length > 0);
    if (mqAnim) { mqAnim.cancel(); mqAnim = null; }
    mqBox.classList.remove('paused');
    mqTrack.innerHTML = '';
    if (!list.length) return;

    // 内容重复两份：track 从 0 滚到 -50% 再瞬间归位，视觉上无缝
    var styleFont = style.font && FONTS[style.font] ? FONTS[style.font] : '';
    var styleSize = sizeCss(style.size);
    var frag = document.createDocumentFragment();
    for (var rep = 0; rep < 2; rep++) {
      list.forEach(function (s) {
        var span = document.createElement('span');
        span.className = 'mq-item';
        span.textContent = s;
        if (styleFont) span.style.fontFamily = styleFont;
        if (styleSize) span.style.fontSize = styleSize;
        if (style.color) span.style.color = style.color;
        var dot = document.createElement('i');
        dot.className = 'mq-dot';
        dot.textContent = '✦';
        if (style.color) dot.style.color = style.color;
        frag.appendChild(span);
        frag.appendChild(dot);
      });
    }
    mqTrack.appendChild(frag);

    // 速度恒定（默认 55px/s，可在编辑面板调节）：按单份内容宽度换算时长，长内容滚得久
    var pxPerSec = style.speed || 55;
    var half = mqTrack.scrollWidth / 2;
    var dur = Math.max(1500, Math.round(half / pxPerSec * 1000));
    mqAnim = mqTrack.animate(
      [{ transform: 'translateX(0)' }, { transform: 'translateX(-50%)' }],
      { duration: dur, iterations: Infinity }
    );

    mqBox.onclick = function () {
      if (!mqAnim) return;
      if (mqAnim.playState === 'paused') { mqAnim.play(); mqBox.classList.remove('paused'); }
      else { mqAnim.pause(); mqBox.classList.add('paused'); }
    };
    typeIdx.textContent = list.length + ' 条内容 · 点击文字暂停 / 继续';
  }

  /* 样式调整的即时预览：编辑器开着且有未保存草稿时，直接用草稿预览 */
  function previewMarquee() {
    var draft = [];
    if (editor.classList.contains('open')) {
      draft = ta.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    }
    buildMarquee(draft.length ? draft : null);
  }

  function render() {
    body.classList.toggle('standby-on', lines.length > 0);
    buildMarquee();
  }
  render();

  /* ---------- 手机竖屏：时间 / 月历 双屏切换（上下滑动或点击） ---------- */
  var mqPhonePortrait = window.matchMedia
    ? window.matchMedia('(max-width: 1023px) and (orientation: portrait)')
    : { matches: false };
  var viewDots = document.getElementById('viewDots');
  var stageEl = document.getElementById('stageDefault');
  var calViewOn = false;

  function setCalView(on) {
    calViewOn = !!on;
    body.classList.toggle('m-cal', calViewOn);
    if (viewDots) {
      Array.prototype.forEach.call(viewDots.querySelectorAll('button'), function (b) {
        b.classList.toggle('on', (b.getAttribute('data-v') === 'cal') === calViewOn);
      });
    }
  }

  if (viewDots) {
    viewDots.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      setCalView(b.getAttribute('data-v') === 'cal');
    });
  }

  if (stageEl) {
    stageEl.addEventListener('click', function (e) {
      if (!mqPhonePortrait.matches) return;      // 桌面/横屏不参与
      if (e.target.closest('button, a, .view-dots')) return;
      // 月历卡片主体（头部与日期格）不触发切换，避免误触退出
      if (e.target.closest('.cal-head') || e.target.closest('.cal-grid')) return;
      setCalView(!calViewOn);
    });

    var tStartX = 0, tStartY = 0, tTrack = false;
    stageEl.addEventListener('touchstart', function (e) {
      if (!mqPhonePortrait.matches || e.touches.length !== 1) { tTrack = false; return; }
      tTrack = true;
      tStartX = e.touches[0].clientX;
      tStartY = e.touches[0].clientY;
    }, { passive: true });
    stageEl.addEventListener('touchend', function (e) {
      if (!tTrack) return;
      tTrack = false;
      var t = e.changedTouches && e.changedTouches[0];
      if (!t) return;
      var dx = t.clientX - tStartX;
      var dy = t.clientY - tStartY;
      if (Math.abs(dy) < 44 || Math.abs(dy) < Math.abs(dx)) return; // 需为明显的纵向滑动
      setCalView(dy < 0); // 上滑看月历，下滑回时间
    }, { passive: true });
  }

  /* ---------- 编辑面板 ---------- */
  function openEditor() {
    ta.value = lines.join('\n');
    syncStyleUI();
    editor.classList.add('open');
    if (document.activeElement) document.activeElement.blur();
  }
  function closeEditor() {
    editor.classList.remove('open');
    render(); // 丢弃草稿预览，恢复已保存内容（含 text-full 状态）
  }
  document.getElementById('btnEdit').addEventListener('click', openEditor);
  document.getElementById('btnCancel').addEventListener('click', closeEditor);
  document.getElementById('btnClear').addEventListener('click', function () { ta.value = ''; ta.focus(); });
  document.getElementById('btnSave').addEventListener('click', function () {
    lines = ta.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    try { localStorage.setItem(KEY, JSON.stringify(lines)); } catch (e) { /* 忽略隐私模式 */ }
    persistStyle();
    closeEditor();
    render();
  });

  /* ---------- 样式控件：调整即时预览，保存时持久化 ---------- */
  selFont.addEventListener('change', function () {
    style.font = selFont.value;
    previewMarquee();
  });
  rngSize.addEventListener('input', function () {
    style.size = +rngSize.value; // 拖滑块 = 进入 px 微调，档位高亮自动清除
    syncStyleUI();
    previewMarquee();
  });
  sizeSeg.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var v = b.getAttribute('data-s');
    style.size = v === 'half' || v === 'full' ? v : +v;
    syncStyleUI();
    previewMarquee();
  });
  speedSeg.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    style.speed = +b.getAttribute('data-v');
    syncStyleUI();
    previewMarquee();
  });
  colorInput.addEventListener('input', function () {
    style.color = colorInput.value;
    syncStyleUI();
    previewMarquee();
  });
  swWrap.addEventListener('click', function (e) {
    var b = e.target.closest('.sw');
    if (!b) return;
    style.color = b.getAttribute('data-c') || '';
    syncStyleUI();
    previewMarquee();
  });
  document.getElementById('styleReset').addEventListener('click', function () {
    style = { font: '', size: 0, color: '', speed: 55 };
    persistStyle(); // 恢复默认立即生效并持久化，避免“点了没反应”
    syncStyleUI();
    previewMarquee();
  });
  syncStyleUI();
  editor.addEventListener('click', function (e) { if (e.target === editor) closeEditor(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && editor.classList.contains('open')) closeEditor();
  });

  /* ---------- 全屏切换 ---------- */
  var btnFull = document.getElementById('btnFull');
  btnFull.addEventListener('click', function () {
    if (document.fullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
    } else if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(function () { /* 移动端 Safari 可能拒绝 */ });
    }
  });

  /* ---------- 底部技术支持：复制微信号 ---------- */
  var TECH_WX = 'not_every';
  var techBtn = document.getElementById('techCopy');
  var techId = document.getElementById('techWx');
  var techTimer = null;
  function techDone(ok) {
    clearTimeout(techTimer);
    if (ok) {
      techBtn.textContent = '已复制 ✓';
      techBtn.classList.add('done');
      techBtn.classList.remove('failed');
    } else {
      techBtn.textContent = '长按';
      techBtn.classList.add('failed');
      techBtn.classList.remove('done');
    }
    techTimer = setTimeout(function () {
      techBtn.textContent = '复制';
      techBtn.classList.remove('done');
      techBtn.classList.remove('failed');
    }, 1600);
  }
  function copyTech() {
    function fallback() {
      var t = document.createElement('textarea');
      t.value = TECH_WX;
      t.style.position = 'fixed';
      t.style.opacity = '0';
      document.body.appendChild(t);
      t.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { /* 忽略 */ }
      document.body.removeChild(t);
      techDone(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(TECH_WX).then(function () { techDone(true); }, fallback);
    } else { fallback(); }
  }
  techBtn.addEventListener('click', copyTech);
  techId.addEventListener('click', copyTech);
  techId.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copyTech(); }
  });

  /* ---------- 屏幕常亮（支持 Wake Lock 的浏览器） ---------- */
  var wakeLock = null;
  function reqWake() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (wl) {
      wakeLock = wl;
      wl.addEventListener('release', function () { wakeLock = null; });
    }).catch(function () { /* 被拒绝则正常熄屏 */ });
  }
  reqWake();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !wakeLock) reqWake();
  });
})();
</script>
</body>
</html>
