<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="../assets/image/favicon-round.png">
<link rel="apple-touch-icon" href="../assets/image/logo.png">
<title>画板</title>
<link rel="stylesheet" href="../assets/css/palette-kit.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#fff;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#23262d;-webkit-font-smoothing:antialiased;
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  /* 只作用于主画布：用 #cv 收窄，避免动态创建的缩略图 canvas 也被拉成全屏覆盖层 */
  #cv{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:crosshair;}
  .ui{position:fixed;z-index:5;opacity:1;transition:opacity .5s ease;}
  body.idle .ui{opacity:.18;}
  body.idle .ui:hover,body.idle .ui:focus-within{opacity:1;}
  .back{
    top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));
    width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.08);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#23262d;text-decoration:none;
    box-shadow:0 2px 10px rgba(0,0,0,.07);transition:transform .12s ease;
  }
  .back:active{transform:scale(.94);}
  .back svg{width:15px;height:15px;}

  .side{
    position:fixed;z-index:6;right:calc(10px + env(safe-area-inset-right));
    top:calc(12px + env(safe-area-inset-top));
    display:flex;flex-direction:column;gap:8px;align-items:center;
  }
  .recent{
    display:flex;flex-direction:column;gap:5px;padding:6px;border-radius:12px;
    background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.08);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  .recent i{width:20px;height:20px;border-radius:6px;cursor:pointer;display:block;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .12s ease;}
  .recent i:hover{transform:scale(1.12);}

  .bar{
    left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);
    display:flex;align-items:center;gap:5px;max-width:calc(100vw - 18px);
    padding:7px;border-radius:16px;overflow-x:auto;scrollbar-width:none;
    background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.08);
    box-shadow:0 4px 18px rgba(0,0,0,.1);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  }
  .bar::-webkit-scrollbar{display:none;}
  .tool{
    flex:0 0 auto;height:34px;min-width:34px;padding:0 9px;border:none;border-radius:10px;
    background:transparent;color:#4b525d;font-family:inherit;font-size:12.5px;font-weight:600;
    cursor:pointer;outline:none;white-space:nowrap;display:flex;align-items:center;gap:5px;
    transition:background-color .15s ease,transform .12s ease;
  }
  .tool:hover{background:rgba(0,0,0,.06);}
  .tool:active{transform:scale(.93);}
  .tool.on{background:rgba(99,91,255,.13);color:#635bff;}
  .tool i{width:14px;height:14px;border-radius:50%;background:#23262d;display:block;}
  .sep{width:1px;height:20px;background:rgba(0,0,0,.1);flex:0 0 auto;}
  .tool.primary{background:#23262d;color:#fff;}
  .tool.zoom{min-width:0;padding:0 8px;font-variant-numeric:tabular-nums;}
  .hint{
    left:50%;bottom:calc(62px + env(safe-area-inset-bottom));transform:translateX(-50%);
    font-size:11.5px;color:#98a0ad;pointer-events:none;white-space:nowrap;
  }

  /* ---------- 简笔画示例面板 ---------- */
  .simp{
    position:fixed;z-index:20;width:min(346px,calc(100vw - 20px));
    padding:12px;border-radius:14px;
    background:rgba(255,255,255,.96);border:1px solid rgba(0,0,0,.08);
    box-shadow:0 10px 30px rgba(0,0,0,.16);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  }
  .simp[hidden]{display:none !important;}
  .simp h4{
    margin:0 0 10px;font-size:12.5px;font-weight:700;color:#4b525d;
  }
  .simp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .simp-item{
    aspect-ratio:1;border-radius:11px;border:1px solid rgba(0,0,0,.08);
    background:#fff;cursor:pointer;padding:0;overflow:hidden;position:relative;
    transition:transform .12s ease,border-color .15s ease,box-shadow .15s ease;
  }
  .simp-item:hover{transform:translateY(-2px);border-color:#635bff;box-shadow:0 5px 14px rgba(99,91,255,.2);}
  .simp-item:active{transform:scale(.95);}
  .simp-item canvas{position:static;inset:auto;width:100%;height:100%;display:block;pointer-events:none;}
  .simp-item b{
    position:absolute;left:0;right:0;bottom:0;padding:2px 0 3px;
    font:600 9.5px/1.2 inherit;color:#8b93a1;text-align:center;
    background:linear-gradient(transparent,rgba(255,255,255,.94) 42%);
    pointer-events:none;
  }
  .simp-tip{margin:9px 0 0;font-size:10.5px;line-height:1.6;color:#98a0ad;}
</style>
  <script src="../assets/js/fs-kit.js" defer></script>
</head>
<body>
<canvas id="cv"></canvas>

<a class="ui back" href="../x.html" title="返回" aria-label="返回">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</a>

<div class="ui side">
  <div class="recent" id="recent"></div>
  <div class="pk" id="pk" data-pk="paint" data-placement="left"></div>
</div>

<div class="ui bar">
  <button class="tool on" id="brushBtn" type="button" title="切换笔刷">圆笔</button>
  <button class="tool" id="wBtn" type="button" title="笔宽"><span>粗</span><i id="wDot"></i></button>
  <button class="tool" id="eraserBtn" type="button" title="橡皮（E）">橡皮</button>
  <button class="tool" id="fillBtn" type="button" title="填充（G）">填充</button>
  <button class="tool" id="pickBtn" type="button" title="取色（I）">取色</button>
  <i class="sep"></i>
  <button class="tool zoom" id="zoomBtn" type="button" title="缩放：双指捏合 / 滚轮，点此复位 1:1"><span id="zoomText">100%</span></button>
  <button class="tool" id="simpBtn" type="button" title="简笔画示例">示例</button>
  <button class="tool" id="undoBtn" type="button" title="撤销（Z）">撤销</button>
  <button class="tool" id="redoBtn" type="button" title="重做（Y）">重做</button>
  <button class="tool" id="clearBtn" type="button" title="清空">清空</button>
  <i class="sep"></i>
  <button class="tool" id="bgBtn" type="button" title="纸色"><i id="bgDot" style="background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)"></i></button>
  <button class="tool primary" id="saveBtn" type="button" title="保存 PNG">保存</button>
</div>

<div class="simp" id="simpPop" hidden role="dialog" aria-label="简笔画示例">
  <h4>简笔画示例</h4>
  <div class="simp-grid" id="simpGrid"></div>
  <p class="simp-tip">点一下把简笔画画到画布中央，接着用取色器涂色即可。</p>
</div>

<div class="ui hint" id="hint">工具栏可左右滑动 · 双指捏合缩放 · 双指拖动平移</div>

<script src="../assets/js/palette-kit.js"></script>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d', { alpha: false });
  var W = 0, H = 0, DPR = 1;

  var BRUSHES = ['圆笔', '方笔', '铅笔', '马克笔', '喷枪'];
  var brushIdx = 0;
  var widths = [2, 5, 10, 20, 38];
  var wIdx = 2;

  var penColor = '#23262d';
  var paper = '#ffffff';
  var bgLum = 255;                // 当前落笔处底色亮度（铅笔据此决定用深色还是浅色石墨）
  var mode = 'brush';            // brush | eraser | fill | pick
  var drawing = false, last = null;

  /* ---------------- 缩放 / 平移（视口变换）----------------
     画布分两层：
       contentCv —— 内容层，按原始分辨率保存笔迹；撤销/取色/填充/导出都用它
       cv/ctx    —— 显示层，只负责把内容层按当前视图（缩放+平移）画出来
     这样放大后旧笔迹会跟着放大，且不损失画质，导出 PNG 始终是原始分辨率。 */
  var view = { s: 1, x: 0, y: 0 };      // s = 倍率，x/y = 平移量（CSS 像素）
  var MIN_S = 0.35, MAX_S = 8;

  var contentCv = document.createElement('canvas');
  var cctx = contentCv.getContext('2d');

  function clampScale(s) { return Math.max(MIN_S, Math.min(MAX_S, s)); }

  /* 画布坐标 → 内容层设备像素（内容层不含视图变换） */
  function toDevice(x, y) {
    return { x: Math.round(x * DPR), y: Math.round(y * DPR) };
  }

  function syncZoom() {
    var t = document.getElementById('zoomText');
    if (t) t.textContent = Math.round(view.s * 100) + '%';
  }
  // 以画布上的 (px,py) 为锚点缩放 —— 手指/光标下的那一点保持不动
  function zoomAt(px, py, factor) {
    var ns = clampScale(view.s * factor);
    var k = ns / view.s;
    view.x = px - (px - view.x) * k;
    view.y = py - (py - view.y) * k;
    view.s = ns;
    syncZoom();
    render();
  }
  function zoomBy(factor) { zoomAt(W / 2, H / 2, factor); }
  function resetView() { view.s = 1; view.x = 0; view.y = 0; syncZoom(); render(); }

  /* 把内容层按当前视图画到显示层 */
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = paper;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(view.x, view.y);
    ctx.scale(view.s, view.s);
    ctx.drawImage(contentCv, 0, 0, W, H);
    ctx.restore();
  }

  var snaps = [], redos = [];
  var SNAP_LIMIT = 10;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    contentCv.width = cv.width;
    contentCv.height = cv.height;
    cctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cctx.fillStyle = paper;
    cctx.fillRect(0, 0, W, H);
    snaps.length = 0; redos.length = 0;
    resetView();                 // 尺寸变了，视图复位
  }

  function pushSnap() {
    if (snaps.length >= SNAP_LIMIT) snaps.shift();
    snaps.push(cctx.getImageData(0, 0, contentCv.width, contentCv.height));
    redos.length = 0;
  }
  function undo() {
    var s = snaps.pop();
    if (!s) return;
    redos.push(cctx.getImageData(0, 0, contentCv.width, contentCv.height));
    cctx.putImageData(s, 0, 0);
    render();
  }
  function redo() {
    var s = redos.pop();
    if (!s) return;
    snaps.push(cctx.getImageData(0, 0, contentCv.width, contentCv.height));
    cctx.putImageData(s, 0, 0);
    render();
  }

  function pos(e) {
    var r = cv.getBoundingClientRect();
    // 反变换：屏幕坐标 → 画布坐标
    return {
      x: (e.clientX - r.left - view.x) / view.s,
      y: (e.clientY - r.top - view.y) / view.s
    };
  }

  /* ---------------- 笔刷 ---------------- */
  function sampleBg(x, y) {
    try {
      var p = toDevice(x, y);
      p.x = Math.max(0, Math.min(contentCv.width - 1, p.x));
      p.y = Math.max(0, Math.min(contentCv.height - 1, p.y));
      var d = cctx.getImageData(p.x, p.y, 1, 1).data;
      bgLum = d[0] * 0.299 + d[1] * 0.587 + d[2] * 0.114;
    } catch (e) { }
  }

  function drawSegment(x1, y1, x2, y2) {
    var b = BRUSHES[brushIdx];
    var w = widths[wIdx];
    var ctx = cctx;              // 笔迹画在内容层（局部遮蔽显示层的 ctx）
    ctx.save();
    if (mode === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
      ctx.lineWidth = w * 1.8;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.restore();
      return;
    }
    if (b === '方笔') {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = penColor;
      var ang = Math.atan2(y2 - y1, x2 - x1);
      ctx.translate(x1, y1); ctx.rotate(ang);
      ctx.fillRect(0, -w / 2, Math.max(1, Math.hypot(x2 - x1, y2 - y1)), w);
      ctx.restore();
      return;
    }
    if (b === '铅笔') {
      ctx.globalCompositeOperation = 'source-over';
      // 笔色和底色太接近时（比如在深色纸上）改用反色粉笔，保证看得见
      var ink = penColor;
      var pc = window.PaletteKit.hex2rgb(penColor);
      if (pc) {
        var inkLum = pc.r * 0.299 + pc.g * 0.587 + pc.b * 0.114;
        if (Math.abs(inkLum - bgLum) < 45) ink = bgLum < 128 ? '#ffffff' : '#23262d';
      }
      ctx.fillStyle = ink;               // 关键：铅笔画的是圆点，没设 fillStyle 会用上个工具残留的颜色
      ctx.strokeStyle = ink;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(1.8, w * 0.45);
      // 先铺一条淡底线，保证笔画连续（纯颗粒会显得断断续续）
      ctx.globalAlpha = 0.62;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      // 再叠石墨颗粒
      var steps = Math.max(1, Math.round(Math.hypot(x2 - x1, y2 - y1) / 1.5));
      for (var i = 0; i <= steps; i++) {
        var tt = i / steps;
        var px = x1 + (x2 - x1) * tt + (Math.random() - 0.5) * w * 0.46;
        var py = y1 + (y2 - y1) * tt + (Math.random() - 0.5) * w * 0.46;
        ctx.globalAlpha = 0.25 + Math.random() * 0.45;
        ctx.beginPath();
        ctx.arc(px, py, Math.max(0.6, w * 0.13), 0, 6.2832);
        ctx.fill();
      }
      ctx.restore();
      return;
    }
    if (b === '马克笔') {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = penColor;
      ctx.globalAlpha = 0.42;
      ctx.lineWidth = w;
      ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.restore();
      return;
    }
    if (b === '喷枪') {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = penColor;
      var n = Math.max(4, Math.round(w * 1.2));
      var dx = x2 - x1, dy = y2 - y1;
      var len = Math.hypot(dx, dy) || 1;
      for (var k = 0; k < n; k++) {
        var off = (Math.random() - 0.5) * w;
        var along = Math.random() * len;
        ctx.globalAlpha = 0.05 + Math.random() * 0.1;
        ctx.beginPath();
        ctx.arc(x1 + dx * (along / len) - dy / len * off, y1 + dy * (along / len) + dx / len * off, Math.max(0.7, w * 0.09), 0, 6.2832);
        ctx.fill();
      }
      ctx.restore();
      return;
    }
    // 圆笔
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = penColor;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.restore();
  }

  /* ---------------- 填充 ---------------- */
  function floodFill(px, py, hexColor) {
    var w = contentCv.width, h = contentCv.height;
    var img = cctx.getImageData(0, 0, w, h);
    var d = img.data;
    var dp = toDevice(px, py);
    var sx = dp.x, sy = dp.y;
    if (sx < 0 || sy < 0 || sx >= w || sy >= h) return;
    var si = (sy * w + sx) * 4;
    var tr = d[si], tg = d[si + 1], tb = d[si + 2], ta = d[si + 3];

    var c = window.PaletteKit.hex2rgb(hexColor) || { r: 0, g: 0, b: 0 };
    if (Math.abs(tr - c.r) < 10 && Math.abs(tg - c.g) < 10 && Math.abs(tb - c.b) < 10 && ta === 255) return;

    var match = function (i) {
      return Math.abs(d[i] - tr) < 12 && Math.abs(d[i + 1] - tg) < 12 &&
             Math.abs(d[i + 2] - tb) < 12 && Math.abs(d[i + 3] - ta) < 12;
    };
    var fill = function (i) {
      d[i] = c.r; d[i + 1] = c.g; d[i + 2] = c.b; d[i + 3] = 255;
    };

    var stack = [sx, sy];
    while (stack.length) {
      var y = stack.pop(), x = stack.pop();
      var idx = (y * w + x) * 4;
      if (!match(idx)) continue;
      // 向左扩展
      var x0 = x;
      while (x0 > 0 && match(((y * w) + x0 - 1) * 4)) x0--;
      var x1 = x;
      while (x1 < w - 1 && match(((y * w) + x1 + 1) * 4)) x1++;
      for (var xx = x0; xx <= x1; xx++) {
        fill((y * w + xx) * 4);
        if (y > 0 && match(((y - 1) * w + xx) * 4)) { stack.push(xx, y - 1); }
        if (y < h - 1 && match(((y + 1) * w + xx) * 4)) { stack.push(xx, y + 1); }
      }
    }
    cctx.putImageData(img, 0, 0);
    render();
  }

  function pickColor(px, py) {
    var dp = toDevice(px, py);
    dp.x = Math.max(0, Math.min(contentCv.width - 1, dp.x));
    dp.y = Math.max(0, Math.min(contentCv.height - 1, dp.y));
    var d = cctx.getImageData(dp.x, dp.y, 1, 1).data;
    var hex = window.PaletteKit.rgb2hex(d[0], d[1], d[2]);
    penColor = hex;
    pushRecent(hex);
    var dot = document.getElementById('wDot');
    if (dot) dot.style.background = hex;
    setHint('取色 ' + hex.toUpperCase());
    return hex;
  }

  /* ---------------- 最近使用颜色 ---------------- */
  var recent = [];
  function pushRecent(c) {
    recent = recent.filter(function (x) { return x !== c; });
    recent.unshift(c);
    if (recent.length > 8) recent.pop();
    var el = document.getElementById('recent');
    if (!el) return;
    el.innerHTML = '';
    recent.forEach(function (col) {
      var i = document.createElement('i');
      i.style.background = col;
      i.title = col;
      i.addEventListener('click', function () {
        penColor = col;
        var d = document.getElementById('wDot');
        if (d) d.style.background = col;
        if (mode === 'eraser') setMode('brush');
      });
      el.appendChild(i);
    });
  }

  /* ---------------- 交互：单指画画 / 双指缩放平移 ---------------- */
  var ptrs = new Map();
  var pinch = null;         // {dist, mid, s, vx, vy}
  var panning = null;       // {sx, sy, vx, vy}

  function ptrList() { return Array.from(ptrs.values()); }

  function beginPinch() {
    var it = ptrList();
    if (it.length < 2) { pinch = null; return; }
    pinch = {
      dist: Math.hypot(it[0].x - it[1].x, it[0].y - it[1].y),
      mid: { x: (it[0].x + it[1].x) / 2, y: (it[0].y + it[1].y) / 2 },
      s: view.s, vx: view.x, vy: view.y
    };
  }

  cv.addEventListener('pointerdown', function (e) {
    // setPointerCapture 在指针已释放 / 合成事件下会抛异常，
    // 一旦抛出就会中断后面的处理（双指手势直接失效），必须兜住
    try { cv.setPointerCapture && cv.setPointerCapture(e.pointerId); } catch (err) { }
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

    // 双指 → 缩放 / 平移，停止画线
    if (ptrs.size >= 2) {
      drawing = false; last = null; panning = null;
      beginPinch();
      return;
    }
    // 桌面：中键 / Ctrl 拖动 = 平移
    if (e.button === 1 || e.ctrlKey || e.metaKey) {
      panning = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
      return;
    }

    var p = pos(e);
    sampleBg(p.x, p.y);
    if (mode === 'fill') { pushSnap(); floodFill(p.x, p.y, penColor); setMode('brush'); return; }
    if (mode === 'pick') { pickColor(p.x, p.y); setMode('brush'); return; }
    pushSnap();
    drawing = true;
    last = p;
    drawSegment(p.x, p.y, p.x + 0.01, p.y + 0.01);
    render();
  });

  cv.addEventListener('pointermove', function (e) {
    if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

    // 双指：捏合缩放（以捏合中心为锚点）+ 中点位移平移
    if (ptrs.size >= 2) {
      if (!pinch) beginPinch();
      if (pinch) {
        var it = ptrList();
        var d = Math.hypot(it[0].x - it[1].x, it[0].y - it[1].y);
        var mid = { x: (it[0].x + it[1].x) / 2, y: (it[0].y + it[1].y) / 2 };
        var r = cv.getBoundingClientRect();
        var px = pinch.mid.x - r.left, py = pinch.mid.y - r.top;
        var target = clampScale(pinch.s * (pinch.dist > 0 ? d / pinch.dist : 1));
        var k = target / pinch.s;
        view.x = px - (px - pinch.vx) * k + (mid.x - pinch.mid.x);
        view.y = py - (py - pinch.vy) * k + (mid.y - pinch.mid.y);
        view.s = target;
        syncZoom();
        render();
      }
      return;
    }
    // 单指平移（桌面中键 / Ctrl）
    if (panning) {
      view.x = panning.vx + (e.clientX - panning.sx);
      view.y = panning.vy + (e.clientY - panning.sy);
      render();
      return;
    }

    if (!drawing) return;
    var p = pos(e);
    drawSegment(last.x, last.y, p.x, p.y);
    last = p;
    render();
  });

  ['pointerup', 'pointercancel'].forEach(function (ev) {
    cv.addEventListener(ev, function (e) {
      ptrs.delete(e.pointerId);
      if (ptrs.size < 2) pinch = null;
      if (ptrs.size === 0) { drawing = false; last = null; panning = null; }
    });
  });
  cv.addEventListener('pointerleave', function () { drawing = false; last = null; });

  // 滚轮缩放（桌面）
  cv.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = cv.getBoundingClientRect();
    var f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    zoomAt(e.clientX - r.left, e.clientY - r.top, f);
  }, { passive: false });

  /* ==========================================================
     简笔画示例：用 SVG path 定义，画在 0–100 的坐标系里，
     载入时按画布大小等比缩放居中
     ========================================================== */
  var SIMPLE = [
    { name: '太阳', paths: [
      'M30 50a20 20 0 1 0 40 0a20 20 0 1 0 -40 0',
      'M50 4v12 M50 84v12 M4 50h12 M84 50h12 M17 17l9 9 M74 74l9 9 M83 17l-9 9 M26 74l-9 9'
    ] },
    { name: '小猫', paths: [
      'M34 44a16 16 0 1 0 32 0a16 16 0 1 0 -32 0',
      'M37 30l-2-14l12 7 M63 30l2-14l-12 7',
      'M43 42a1.8 1.8 0 1 0 .1 0 M57 42a1.8 1.8 0 1 0 .1 0',
      'M49 49h2',
      'M50 51c0 3-4 3-5 1 M50 51c0 3 4 3 5 1',
      'M32 46h-9 M32 52h-9 M68 46h9 M68 52h9',
      'M36 62c-3 12-3 22 0 30 M64 62c3 12 3 22 0 30 M34 92h32',
      'M64 74c8 0 10 8 4 12'
    ] },
    { name: '小鱼', paths: [
      'M22 50c0-13 12-23 27-23s25 10 25 23-10 23-25 23-27-10-27-23z',
      'M74 50l14-13v26z',
      'M35 45a2 2 0 1 0 .1 0',
      'M48 27c4-7 10-9 14-9-2 6-6 10-10 12',
      'M40 72c6 6 18 7 26 2'
    ] },
    { name: '小房子', paths: [
      'M26 46h48v40H26z',
      'M18 47L50 19l32 28',
      'M44 86V62h12v24',
      'M32 56h9v9h-9z',
      'M62 34V22h9v7'
    ] },
    { name: '大树', paths: [
      'M44 92V58h11v34',
      'M44 72h11',
      'M49 12a17 17 0 0 1 15 25a15 15 0 0 1-28 5a14 14 0 0 1 13-30z'
    ] },
    { name: '小飞机', paths: [
      'M12 52c0-4 9-7 38-7s38 3 38 7-9 7-38 7-38-3-38-7z',
      'M47 57L25 84h12l15-23 M53 57l20 27H61L49 61',
      'M18 45L10 30h8l8 13'
    ] },
    { name: '蝴蝶', paths: [
      'M48 53C39 31 21 26 14 34c-7 8 2 21 34 23',
      'M48 58C39 77 23 84 16 77c-6-7 1-19 32-22',
      'M52 53c9-22 27-27 34-19 7 8-2 21-34 23',
      'M52 58c9 19 25 26 32 19 6-7-1-19-32-22',
      'M50 28v48',
      'M50 32a2 2 0 1 0 .1 0',
      'M50 28c-3-7-8-9-12-9 M50 28c3-7 8-9 12-9'
    ] },
    { name: '卡车', paths: [
      'M10 38h44v30H10z',

      'M26 78a8 8 0 1 0 .1 0 M72 78a8 8 0 1 0 .1 0',
      'M10 68h18 M72 68h12'
    ] },
    { name: '星星', paths: [
      'M50 10l11.5 24.5L88 37l-19 18.5 4.6 26.5L50 70.5 26.4 82 31 55.5 12 37l26.5-2.5z'
    ] },
    { name: '笑脸', paths: [
      'M50 18a32 32 0 1 0 .1 0',
      'M37 43a3 3 0 1 0 .1 0 M63 43a3 3 0 1 0 .1 0',
      'M34 60c5 9 27 9 32 0',
      'M27 55h7 M66 55h7'
    ] },
    { name: '气球', paths: [
      'M50 12a24 24 0 1 0 .1 0',
      'M45 36h10l-5 7z',
      'M50 43c-7 11 7 15 0 26s7 12 0 20'
    ] },
    { name: '小船', paths: [
      'M12 66h76l-11 18H23z',
      'M50 18v48',
      'M50 24L26 62h24z',
      'M54 30l18 32H54z'
    ] }
  ];

  /* 统一描边：缩略图与画布共用 */
  function strokeExample(c, ex, scale, ox, oy, color, lw) {
    c.save();
    c.translate(ox, oy);
    c.scale(scale, scale);
    c.lineWidth = lw;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.strokeStyle = color;
    (ex.paths || []).forEach(function (d) {
      var p = new Path2D(d);
      if (ex.fill) { c.fillStyle = ex.fill; c.fill(p); }
      c.stroke(p);
    });
    c.restore();
  }

  function loadExample(ex) {
    pushSnap();
    var s = Math.min(W, H) * 0.55 / 100;
    var ox = W / 2 - 50 * s;
    var oy = H / 2 - 50 * s;
    cctx.save();
    cctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cctx.globalCompositeOperation = 'source-over';
    strokeExample(cctx, ex, s, ox, oy, penColor, 2.8);
    cctx.restore();
    render();
    setHint('已放入「' + ex.name + '」· 接着涂色吧');
  }

  /* ---------------- 简笔画面板 ---------------- */
  var simpBtn = document.getElementById('simpBtn');
  var simpPop = document.getElementById('simpPop');
  var simpGrid = document.getElementById('simpGrid');

  function placeSimp() {
    if (!simpPop || !simpBtn) return;
    simpPop.hidden = false;
    simpPop.style.visibility = 'hidden';
    var r = simpBtn.getBoundingClientRect();
    var pr = simpPop.getBoundingClientRect();
    var left = r.left + r.width / 2 - pr.width / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - pr.width - 8));
    var top = r.top - pr.height - 8;
    if (top < 8) top = r.bottom + 8;
    simpPop.style.left = left + 'px';
    simpPop.style.top = top + 'px';
    simpPop.style.visibility = 'visible';
  }
  function closeSimp() { if (simpPop) simpPop.hidden = true; }

  function renderSimples() {
    if (!simpGrid) return;
    simpGrid.innerHTML = '';
    SIMPLE.forEach(function (ex) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'simp-item';
      btn.title = ex.name;
      var c = document.createElement('canvas');
      c.width = 132; c.height = 132;
      var cc = c.getContext('2d');
      strokeExample(cc, ex, 1.32, 0, 0, '#23262d', 3.4);
      btn.appendChild(c);
      var b = document.createElement('b');
      b.textContent = ex.name;
      btn.appendChild(b);
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        loadExample(ex);
        closeSimp();
      });
      simpGrid.appendChild(btn);
    });
  }

  if (simpBtn) simpBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (simpPop && simpPop.hidden) { renderSimples(); placeSimp(); }
    else closeSimp();
  });

  var zoomBtn = document.getElementById('zoomBtn');
  if (zoomBtn) zoomBtn.addEventListener('click', function () {
    resetView();
    setHint('已复位到 100%');
  });
  document.addEventListener('click', function (e) {
    if (simpPop && !simpPop.hidden && !simpPop.contains(e.target) && e.target !== simpBtn) closeSimp();
  });

  /* ---------------- 控件 ---------------- */
  var hintEl = document.getElementById('hint');
  var hintTimer = null;
  function setHint(t) {
    if (!hintEl) return;
    hintEl.textContent = t;
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () {
      hintEl.textContent = '工具栏可左右滑动 · 双指捏合缩放 · 双指拖动平移';
    }, 2000);
  }

  function setMode(m) {
    mode = m;
    ['brushBtn', 'eraserBtn', 'fillBtn', 'pickBtn'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.classList.remove('on');
    });
    var map = { brush: 'brushBtn', eraser: 'eraserBtn', fill: 'fillBtn', pick: 'pickBtn' };
    var el = document.getElementById(map[m]);
    if (el) el.classList.add('on');
  }

  var brushBtn = document.getElementById('brushBtn');
  if (brushBtn) brushBtn.addEventListener('click', function () {
    brushIdx = (brushIdx + 1) % BRUSHES.length;
    brushBtn.textContent = BRUSHES[brushIdx];
    setMode('brush');
  });

  var wBtn = document.getElementById('wBtn');
  if (wBtn) wBtn.addEventListener('click', function () {
    wIdx = (wIdx + 1) % widths.length;
    var d = document.getElementById('wDot');
    if (d) d.style.transform = 'scale(' + (0.4 + widths[wIdx] / 22) + ')';
  });

  var eraserBtn = document.getElementById('eraserBtn');
  if (eraserBtn) eraserBtn.addEventListener('click', function () { setMode('eraser'); });
  var fillBtn = document.getElementById('fillBtn');
  if (fillBtn) fillBtn.addEventListener('click', function () { setMode('fill'); });
  var pickBtn = document.getElementById('pickBtn');
  if (pickBtn) pickBtn.addEventListener('click', function () { setMode('pick'); });

  var undoBtn = document.getElementById('undoBtn');
  if (undoBtn) undoBtn.addEventListener('click', undo);
  var redoBtn = document.getElementById('redoBtn');
  if (redoBtn) redoBtn.addEventListener('click', redo);

  var clearBtn = document.getElementById('clearBtn');
  if (clearBtn) clearBtn.addEventListener('click', function () {
    pushSnap();
    cctx.setTransform(DPR, 0, 0, DPR, 0, 0);   // 内容层整张清空
    cctx.globalCompositeOperation = 'source-over';
    cctx.fillStyle = paper;
    cctx.fillRect(0, 0, W, H);
    bgLum = 255;
    render();
  });

  var bgBtn = document.getElementById('bgBtn');
  if (bgBtn) bgBtn.addEventListener('click', function () {
    paper = paper === '#ffffff' ? '#f2efe9' : '#ffffff';
    var dot = document.getElementById('bgDot');
    if (dot) dot.style.background = paper;
    cctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cctx.globalCompositeOperation = 'source-over';
    cctx.fillStyle = paper;
    cctx.fillRect(0, 0, W, H);
    render();
  });

  var saveBtn = document.getElementById('saveBtn');
  if (saveBtn) saveBtn.addEventListener('click', function () {
    try {
      var out = document.createElement('canvas');
      out.width = 1600; out.height = Math.round(1600 * H / W);
      var o = out.getContext('2d');
      o.fillStyle = paper;
      o.fillRect(0, 0, out.width, out.height);
      o.drawImage(contentCv, 0, 0, out.width, out.height);   // 导出内容层原始分辨率，不含视图变换
      out.toBlob(function (blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'paint-' + new Date().toISOString().slice(0, 10) + '-' + Date.now() % 10000 + '.png';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
        setHint('已保存 ✓');
      }, 'image/png');
    } catch (e) { }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeSimp(); return; }
    if (e.key === 'z' || e.key === 'Z') undo();
    else if (e.key === 'y' || e.key === 'Y') redo();
    else if (e.key === 'e' || e.key === 'E') setMode('eraser');
    else if (e.key === 'g' || e.key === 'G') setMode('fill');
    else if (e.key === 'i' || e.key === 'I') setMode('pick');
    else if (e.key === 'b' || e.key === 'B') setMode('brush');
  });

  /* ---------------- 闲置淡出 ---------------- */
  var idleTimer = null;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 3200);
  }
  ['pointermove', 'pointerdown', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, wake, { passive: true });
  });
  wake();

  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('resize', function () {
    if (simpPop && !simpPop.hidden) placeSimp();
  }, { passive: true });

  /* 开发钩子：仅 ?dev=1 时暴露内部状态，供自动化测试 */
  if (/[?&]dev=1/.test(location.search)) {
    window.__pt = {
      simples: SIMPLE.map(function (s) { return s.name; }),
      load: loadExample,
      get view() { return { s: view.s, x: view.x, y: view.y }; },
      setView: function (s, x, y) { view.s = s; view.x = x || 0; view.y = y || 0; syncZoom(); render(); },
      zoomAt: zoomAt,
      reset: resetView,
      toDevice: toDevice,
      setPen: function (c) { penColor = c; },
      // 内容层取像素（画布坐标）
      contentPx: function (x, y) {
        var d = cctx.getImageData(Math.round(x * DPR), Math.round(y * DPR), 1, 1).data;
        return [d[0], d[1], d[2]];
      },
      contentAlpha: function (x, y) {
        var d = cctx.getImageData(Math.round(x * DPR), Math.round(y * DPR), 1, 1).data;
        return d[3];
      },
      // 显示层取像素（屏幕坐标）
      displayPx: function (x, y) {
        var d = ctx.getImageData(Math.round(x * DPR), Math.round(y * DPR), 1, 1).data;
        return [d[0], d[1], d[2]];
      },
      get pixels() {
        var d = cctx.getImageData(0, 0, contentCv.width, contentCv.height).data;
        var r = window.PaletteKit.hex2rgb(paper) || { r: 255, g: 255, b: 255 };
        var n = 0;
        for (var i = 0; i < d.length; i += 4) {
          if (Math.abs(d[i] - r.r) > 14 || Math.abs(d[i + 1] - r.g) > 14 || Math.abs(d[i + 2] - r.b) > 14) n++;
        }
        return n;
      }
    };
  }
  window.addEventListener('orientationchange', function () { setTimeout(resize, 240); });

  var pk = window.PaletteKit.mount(document.getElementById('pk'), {
    value: '#23262d',
    onChange: function (c) {
      penColor = c;
      var d = document.getElementById('wDot');
      if (d) d.style.background = c;
      pushRecent(c);
    }
  });
  penColor = pk.get();
  pushRecent(penColor);

  resize();
})();
</script>
