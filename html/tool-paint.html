<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="../assets/image/favicon-round.png">
<link rel="apple-touch-icon" href="../assets/image/logo.png">
<title>画板</title>
<link rel="stylesheet" href="../assets/css/palette-kit.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#fff;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#23262d;-webkit-font-smoothing:antialiased;
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  canvas{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:crosshair;}
  .ui{position:fixed;z-index:5;opacity:1;transition:opacity .5s ease;}
  body.idle .ui{opacity:.18;}
  body.idle .ui:hover,body.idle .ui:focus-within{opacity:1;}
  .back{
    top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));
    width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.08);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#23262d;text-decoration:none;
    box-shadow:0 2px 10px rgba(0,0,0,.07);transition:transform .12s ease;
  }
  .back:active{transform:scale(.94);}
  .back svg{width:15px;height:15px;}

  .side{
    position:fixed;z-index:6;right:calc(10px + env(safe-area-inset-right));
    top:calc(12px + env(safe-area-inset-top));
    display:flex;flex-direction:column;gap:8px;align-items:center;
  }
  .recent{
    display:flex;flex-direction:column;gap:5px;padding:6px;border-radius:12px;
    background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.08);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  .recent i{width:20px;height:20px;border-radius:6px;cursor:pointer;display:block;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .12s ease;}
  .recent i:hover{transform:scale(1.12);}

  .bar{
    left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);
    display:flex;align-items:center;gap:5px;max-width:calc(100vw - 18px);
    padding:7px;border-radius:16px;overflow-x:auto;scrollbar-width:none;
    background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.08);
    box-shadow:0 4px 18px rgba(0,0,0,.1);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  }
  .bar::-webkit-scrollbar{display:none;}
  .tool{
    flex:0 0 auto;height:34px;min-width:34px;padding:0 9px;border:none;border-radius:10px;
    background:transparent;color:#4b525d;font-family:inherit;font-size:12.5px;font-weight:600;
    cursor:pointer;outline:none;white-space:nowrap;display:flex;align-items:center;gap:5px;
    transition:background-color .15s ease,transform .12s ease;
  }
  .tool:hover{background:rgba(0,0,0,.06);}
  .tool:active{transform:scale(.93);}
  .tool.on{background:rgba(99,91,255,.13);color:#635bff;}
  .tool i{width:14px;height:14px;border-radius:50%;background:#23262d;display:block;}
  .sep{width:1px;height:20px;background:rgba(0,0,0,.1);flex:0 0 auto;}
  .tool.primary{background:#23262d;color:#fff;}
  .hint{
    left:50%;bottom:calc(62px + env(safe-area-inset-bottom));transform:translateX(-50%);
    font-size:11.5px;color:#98a0ad;pointer-events:none;white-space:nowrap;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<a class="ui back" href="../x.html" title="返回" aria-label="返回">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</a>

<div class="ui side">
  <div class="recent" id="recent"></div>
  <div class="pk" id="pk" data-pk="paint" data-placement="left"></div>
</div>

<div class="ui bar">
  <button class="tool on" id="brushBtn" type="button" title="切换笔刷">圆笔</button>
  <button class="tool" id="wBtn" type="button" title="笔宽"><span>粗</span><i id="wDot"></i></button>
  <button class="tool" id="eraserBtn" type="button" title="橡皮（E）">橡皮</button>
  <button class="tool" id="fillBtn" type="button" title="填充（G）">填充</button>
  <button class="tool" id="pickBtn" type="button" title="取色（I）">取色</button>
  <i class="sep"></i>
  <button class="tool" id="undoBtn" type="button" title="撤销（Z）">撤销</button>
  <button class="tool" id="redoBtn" type="button" title="重做（Y）">重做</button>
  <button class="tool" id="clearBtn" type="button" title="清空">清空</button>
  <i class="sep"></i>
  <button class="tool" id="bgBtn" type="button" title="纸色"><i id="bgDot" style="background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)"></i></button>
  <button class="tool primary" id="saveBtn" type="button" title="保存 PNG">保存</button>
</div>

<div class="ui hint" id="hint">工具栏可左右滑动 · 填充前先用取色器挑一个颜色</div>

<script src="../assets/js/palette-kit.js"></script>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d', { alpha: false });
  var W = 0, H = 0, DPR = 1;

  var BRUSHES = ['圆笔', '方笔', '铅笔', '马克笔', '喷枪'];
  var brushIdx = 0;
  var widths = [2, 5, 10, 20, 38];
  var wIdx = 2;

  var penColor = '#23262d';
  var paper = '#ffffff';
  var bgLum = 255;                // 当前落笔处底色亮度（铅笔据此决定用深色还是浅色石墨）
  var mode = 'brush';            // brush | eraser | fill | pick
  var drawing = false, last = null;

  var snaps = [], redos = [];
  var SNAP_LIMIT = 10;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = paper;
    ctx.fillRect(0, 0, W, H);
    snaps.length = 0; redos.length = 0;
  }

  function pushSnap() {
    if (snaps.length >= SNAP_LIMIT) snaps.shift();
    snaps.push(ctx.getImageData(0, 0, cv.width, cv.height));
    redos.length = 0;
  }
  function undo() {
    var s = snaps.pop();
    if (!s) return;
    redos.push(ctx.getImageData(0, 0, cv.width, cv.height));
    ctx.putImageData(s, 0, 0);
  }
  function redo() {
    var s = redos.pop();
    if (!s) return;
    snaps.push(ctx.getImageData(0, 0, cv.width, cv.height));
    ctx.putImageData(s, 0, 0);
  }

  function pos(e) {
    var r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left), y: (e.clientY - r.top) };
  }

  /* ---------------- 笔刷 ---------------- */
  function sampleBg(x, y) {
    try {
      var d = ctx.getImageData(Math.max(0, Math.round(x * DPR)), Math.max(0, Math.round(y * DPR)), 1, 1).data;
      bgLum = d[0] * 0.299 + d[1] * 0.587 + d[2] * 0.114;
    } catch (e) { }
  }

  function drawSegment(x1, y1, x2, y2) {
    var b = BRUSHES[brushIdx];
    var w = widths[wIdx];
    ctx.save();
    if (mode === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
      ctx.lineWidth = w * 1.8;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.restore();
      return;
    }
    if (b === '方笔') {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = penColor;
      var ang = Math.atan2(y2 - y1, x2 - x1);
      ctx.translate(x1, y1); ctx.rotate(ang);
      ctx.fillRect(0, -w / 2, Math.max(1, Math.hypot(x2 - x1, y2 - y1)), w);
      ctx.restore();
      return;
    }
    if (b === '铅笔') {
      ctx.globalCompositeOperation = 'source-over';
      // 笔色和底色太接近时（比如在深色纸上）改用反色粉笔，保证看得见
      var ink = penColor;
      var pc = window.PaletteKit.hex2rgb(penColor);
      if (pc) {
        var inkLum = pc.r * 0.299 + pc.g * 0.587 + pc.b * 0.114;
        if (Math.abs(inkLum - bgLum) < 45) ink = bgLum < 128 ? '#ffffff' : '#23262d';
      }
      ctx.fillStyle = ink;               // 关键：铅笔画的是圆点，没设 fillStyle 会用上个工具残留的颜色
      ctx.strokeStyle = ink;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(1.8, w * 0.45);
      // 先铺一条淡底线，保证笔画连续（纯颗粒会显得断断续续）
      ctx.globalAlpha = 0.62;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      // 再叠石墨颗粒
      var steps = Math.max(1, Math.round(Math.hypot(x2 - x1, y2 - y1) / 1.5));
      for (var i = 0; i <= steps; i++) {
        var tt = i / steps;
        var px = x1 + (x2 - x1) * tt + (Math.random() - 0.5) * w * 0.46;
        var py = y1 + (y2 - y1) * tt + (Math.random() - 0.5) * w * 0.46;
        ctx.globalAlpha = 0.25 + Math.random() * 0.45;
        ctx.beginPath();
        ctx.arc(px, py, Math.max(0.6, w * 0.13), 0, 6.2832);
        ctx.fill();
      }
      ctx.restore();
      return;
    }
    if (b === '马克笔') {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = penColor;
      ctx.globalAlpha = 0.42;
      ctx.lineWidth = w;
      ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.restore();
      return;
    }
    if (b === '喷枪') {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = penColor;
      var n = Math.max(4, Math.round(w * 1.2));
      var dx = x2 - x1, dy = y2 - y1;
      var len = Math.hypot(dx, dy) || 1;
      for (var k = 0; k < n; k++) {
        var off = (Math.random() - 0.5) * w;
        var along = Math.random() * len;
        ctx.globalAlpha = 0.05 + Math.random() * 0.1;
        ctx.beginPath();
        ctx.arc(x1 + dx * (along / len) - dy / len * off, y1 + dy * (along / len) + dx / len * off, Math.max(0.7, w * 0.09), 0, 6.2832);
        ctx.fill();
      }
      ctx.restore();
      return;
    }
    // 圆笔
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = penColor;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.restore();
  }

  /* ---------------- 填充 ---------------- */
  function floodFill(px, py, hexColor) {
    var w = cv.width, h = cv.height;
    var img = ctx.getImageData(0, 0, w, h);
    var d = img.data;
    var sx = Math.round(px * DPR), sy = Math.round(py * DPR);
    if (sx < 0 || sy < 0 || sx >= w || sy >= h) return;
    var si = (sy * w + sx) * 4;
    var tr = d[si], tg = d[si + 1], tb = d[si + 2], ta = d[si + 3];

    var c = window.PaletteKit.hex2rgb(hexColor) || { r: 0, g: 0, b: 0 };
    if (Math.abs(tr - c.r) < 10 && Math.abs(tg - c.g) < 10 && Math.abs(tb - c.b) < 10 && ta === 255) return;

    var match = function (i) {
      return Math.abs(d[i] - tr) < 12 && Math.abs(d[i + 1] - tg) < 12 &&
             Math.abs(d[i + 2] - tb) < 12 && Math.abs(d[i + 3] - ta) < 12;
    };
    var fill = function (i) {
      d[i] = c.r; d[i + 1] = c.g; d[i + 2] = c.b; d[i + 3] = 255;
    };

    var stack = [sx, sy];
    while (stack.length) {
      var y = stack.pop(), x = stack.pop();
      var idx = (y * w + x) * 4;
      if (!match(idx)) continue;
      // 向左扩展
      var x0 = x;
      while (x0 > 0 && match(((y * w) + x0 - 1) * 4)) x0--;
      var x1 = x;
      while (x1 < w - 1 && match(((y * w) + x1 + 1) * 4)) x1++;
      for (var xx = x0; xx <= x1; xx++) {
        fill((y * w + xx) * 4);
        if (y > 0 && match(((y - 1) * w + xx) * 4)) { stack.push(xx, y - 1); }
        if (y < h - 1 && match(((y + 1) * w + xx) * 4)) { stack.push(xx, y + 1); }
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function pickColor(px, py) {
    var d = ctx.getImageData(Math.round(px * DPR), Math.round(py * DPR), 1, 1).data;
    var hex = window.PaletteKit.rgb2hex(d[0], d[1], d[2]);
    penColor = hex;
    pushRecent(hex);
    var dot = document.getElementById('wDot');
    if (dot) dot.style.background = hex;
    setHint('取色 ' + hex.toUpperCase());
    return hex;
  }

  /* ---------------- 最近使用颜色 ---------------- */
  var recent = [];
  function pushRecent(c) {
    recent = recent.filter(function (x) { return x !== c; });
    recent.unshift(c);
    if (recent.length > 8) recent.pop();
    var el = document.getElementById('recent');
    if (!el) return;
    el.innerHTML = '';
    recent.forEach(function (col) {
      var i = document.createElement('i');
      i.style.background = col;
      i.title = col;
      i.addEventListener('click', function () {
        penColor = col;
        var d = document.getElementById('wDot');
        if (d) d.style.background = col;
        if (mode === 'eraser') setMode('brush');
      });
      el.appendChild(i);
    });
  }

  /* ---------------- 交互 ---------------- */
  cv.addEventListener('pointerdown', function (e) {
    cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
    var p = pos(e);
    sampleBg(p.x, p.y);
    if (mode === 'fill') { pushSnap(); floodFill(p.x, p.y, penColor); setMode('brush'); return; }
    if (mode === 'pick') { pickColor(p.x, p.y); setMode('brush'); return; }
    pushSnap();
    drawing = true;
    last = p;
    drawSegment(p.x, p.y, p.x + 0.01, p.y + 0.01);
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drawing) return;
    var p = pos(e);
    drawSegment(last.x, last.y, p.x, p.y);
    last = p;
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
    cv.addEventListener(ev, function () { drawing = false; last = null; });
  });

  /* ---------------- 控件 ---------------- */
  var hintEl = document.getElementById('hint');
  var hintTimer = null;
  function setHint(t) {
    if (!hintEl) return;
    hintEl.textContent = t;
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () {
      hintEl.textContent = '工具栏可左右滑动 · 填充前先用取色器挑一个颜色';
    }, 2000);
  }

  function setMode(m) {
    mode = m;
    ['brushBtn', 'eraserBtn', 'fillBtn', 'pickBtn'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.classList.remove('on');
    });
    var map = { brush: 'brushBtn', eraser: 'eraserBtn', fill: 'fillBtn', pick: 'pickBtn' };
    var el = document.getElementById(map[m]);
    if (el) el.classList.add('on');
  }

  var brushBtn = document.getElementById('brushBtn');
  if (brushBtn) brushBtn.addEventListener('click', function () {
    brushIdx = (brushIdx + 1) % BRUSHES.length;
    brushBtn.textContent = BRUSHES[brushIdx];
    setMode('brush');
  });

  var wBtn = document.getElementById('wBtn');
  if (wBtn) wBtn.addEventListener('click', function () {
    wIdx = (wIdx + 1) % widths.length;
    var d = document.getElementById('wDot');
    if (d) d.style.transform = 'scale(' + (0.4 + widths[wIdx] / 22) + ')';
  });

  var eraserBtn = document.getElementById('eraserBtn');
  if (eraserBtn) eraserBtn.addEventListener('click', function () { setMode('eraser'); });
  var fillBtn = document.getElementById('fillBtn');
  if (fillBtn) fillBtn.addEventListener('click', function () { setMode('fill'); });
  var pickBtn = document.getElementById('pickBtn');
  if (pickBtn) pickBtn.addEventListener('click', function () { setMode('pick'); });

  var undoBtn = document.getElementById('undoBtn');
  if (undoBtn) undoBtn.addEventListener('click', undo);
  var redoBtn = document.getElementById('redoBtn');
  if (redoBtn) redoBtn.addEventListener('click', redo);

  var clearBtn = document.getElementById('clearBtn');
  if (clearBtn) clearBtn.addEventListener('click', function () {
    pushSnap();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = paper;
    ctx.fillRect(0, 0, W, H);
    bgLum = 255;
  });

  var bgBtn = document.getElementById('bgBtn');
  if (bgBtn) bgBtn.addEventListener('click', function () {
    paper = paper === '#ffffff' ? '#f2efe9' : '#ffffff';
    var dot = document.getElementById('bgDot');
    if (dot) dot.style.background = paper;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = paper;
    ctx.fillRect(0, 0, W, H);
  });

  var saveBtn = document.getElementById('saveBtn');
  if (saveBtn) saveBtn.addEventListener('click', function () {
    try {
      var out = document.createElement('canvas');
      out.width = 1600; out.height = Math.round(1600 * H / W);
      var o = out.getContext('2d');
      o.fillStyle = paper;
      o.fillRect(0, 0, out.width, out.height);
      o.drawImage(cv, 0, 0, out.width, out.height);
      out.toBlob(function (blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'paint-' + new Date().toISOString().slice(0, 10) + '-' + Date.now() % 10000 + '.png';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
        setHint('已保存 ✓');
      }, 'image/png');
    } catch (e) { }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'z' || e.key === 'Z') undo();
    else if (e.key === 'y' || e.key === 'Y') redo();
    else if (e.key === 'e' || e.key === 'E') setMode('eraser');
    else if (e.key === 'g' || e.key === 'G') setMode('fill');
    else if (e.key === 'i' || e.key === 'I') setMode('pick');
    else if (e.key === 'b' || e.key === 'B') setMode('brush');
  });

  /* ---------------- 闲置淡出 ---------------- */
  var idleTimer = null;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 3200);
  }
  ['pointermove', 'pointerdown', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, wake, { passive: true });
  });
  wake();

  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 240); });

  var pk = window.PaletteKit.mount(document.getElementById('pk'), {
    value: '#23262d',
    onChange: function (c) {
      penColor = c;
      var d = document.getElementById('wDot');
      if (d) d.style.background = c;
      pushRecent(c);
    }
  });
  penColor = pk.get();
  pushRecent(penColor);

  resize();
})();
</script>
</body>
</html>
