<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05070e">
<link rel="icon" type="image/png" href="../assets/image/favicon-round.png">
<link rel="apple-touch-icon" href="../assets/image/logo.png">
<title>俄罗斯方块</title>
<link rel="stylesheet" href="../assets/css/palette-kit.css">
<link rel="stylesheet" href="../assets/css/game-kit.css">
<style>
  /* 底部控制条 */
  .ctrls{
    position:fixed;z-index:18;left:50%;transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom));
    display:flex;gap:8px;
  }
  .ctrls button{
    width:46px;height:46px;padding:0;border-radius:14px;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(12,16,24,.55);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    color:rgba(255,255,255,.88);
    font-size:17px;font-family:inherit;line-height:1;
    cursor:pointer;touch-action:none;
    -webkit-tap-highlight-color:transparent;
    transition:background-color .12s ease,transform .1s ease;
  }
  .ctrls button:active{transform:scale(.92);background:rgba(120,200,255,.22);}
  .ctrls button:focus-visible{outline:2px solid rgba(120,230,255,.8);outline-offset:2px;}

  .tip{
    position:fixed;z-index:12;left:50%;transform:translateX(-50%);
    bottom:calc(74px + env(safe-area-inset-bottom));
    font-size:11px;letter-spacing:.06em;color:rgba(255,255,255,.34);
    pointer-events:none;user-select:none;white-space:nowrap;
  }
  @media (max-width:420px){ .tip{font-size:10px;letter-spacing:0;} }

  /* 底部被控制条占了，左下角标题让位 */
  .gk-label{display:none;}
</style>
  <script src="../assets/js/fs-kit.js" defer></script>
</head>
<body>
<canvas id="cv"></canvas>

<div class="ctrls" id="ctrls">
  <button type="button" data-act="left" aria-label="左移">◀</button>
  <button type="button" data-act="right" aria-label="右移">▶</button>
  <button type="button" data-act="rot" aria-label="顺时针旋转">↻</button>
  <button type="button" data-act="drop" aria-label="硬降">⤓</button>
  <button type="button" data-act="hold" aria-label="暂存">H</button>
</div>

<div class="tip">← → 移动 · ↑ 硬降 · X 旋转 · C 暂存 · 空格 暂停</div>

<script src="../assets/js/palette-kit.js"></script>
<script src="../assets/js/game-kit.js"></script>
<script>
(function () {
  'use strict';

  var LW = 480, LH = 720;
  var COLS = 10, ROWS = 20;
  var CELL = 26;
  var BX = 110, BY = 96;                  // 棋盘左上（逻辑坐标）
  var HOLD_X = 14, HOLD_Y = 108, HOLD_W = 84, HOLD_H = 108;
  var NEXT_X = 386, NEXT_Y = 108, NEXT_W = 84, NEXT_H = 204;
  var LOCK_DELAY = 0.5;                   // 锁定延迟（秒）
  var MAX_LOCK_RESETS = 15;              // 锁定延迟最多重置次数

  /* ---------- 方块定义（SRS 标准旋转系统，坐标 x 右 y 下） ---------- */
  var PIECES = {
    I: [
      [[0,1],[1,1],[2,1],[3,1]],
      [[2,0],[2,1],[2,2],[2,3]],
      [[0,2],[1,2],[2,2],[3,2]],
      [[1,0],[1,1],[1,2],[1,3]]
    ],
    J: [
      [[0,0],[0,1],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[1,2]],
      [[0,1],[1,1],[2,1],[2,2]],
      [[1,0],[1,1],[0,2],[1,2]]
    ],
    L: [
      [[2,0],[0,1],[1,1],[2,1]],
      [[1,0],[1,1],[1,2],[2,2]],
      [[0,1],[1,1],[2,1],[0,2]],
      [[0,0],[1,0],[1,1],[1,2]]
    ],
    O: [
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]]
    ],
    S: [
      [[1,0],[2,0],[0,1],[1,1]],
      [[1,0],[1,1],[2,1],[2,2]],
      [[1,1],[2,1],[0,2],[1,2]],
      [[0,0],[0,1],[1,1],[1,2]]
    ],
    T: [
      [[1,0],[0,1],[1,1],[2,1]],
      [[1,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[2,1],[1,2]],
      [[1,0],[0,1],[1,1],[1,2]]
    ],
    Z: [
      [[0,0],[1,0],[1,1],[2,1]],
      [[2,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[1,2],[2,2]],
      [[1,0],[0,1],[1,1],[0,2]]
    ]
  };
  var TYPES = ['I', 'J', 'L', 'O', 'S', 'T', 'Z'];
  var TYPE_ID = { I: 1, J: 2, L: 3, O: 4, S: 5, T: 6, Z: 7 };

  /* ---------- 踢墙表（SRS，y 向下为正） ---------- */
  var KICK_J = {
    '01': [[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
    '10': [[0,0],[1,0],[1,1],[0,-2],[1,-2]],
    '12': [[0,0],[1,0],[1,1],[0,-2],[1,-2]],
    '21': [[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
    '23': [[0,0],[1,0],[1,1],[0,-2],[1,-2]],
    '32': [[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
    '30': [[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
    '03': [[0,0],[1,0],[1,-1],[0,2],[1,2]]
  };
  var KICK_I = {
    '01': [[0,0],[-2,0],[1,0],[-2,1],[1,-2]],
    '10': [[0,0],[2,0],[-1,0],[2,-1],[-1,2]],
    '12': [[0,0],[-1,0],[2,0],[-1,-2],[2,1]],
    '21': [[0,0],[1,0],[-2,0],[1,2],[-2,-1]],
    '23': [[0,0],[2,0],[-1,0],[2,-1],[-1,2]],
    '32': [[0,0],[-1,0],[2,0],[-1,-2],[2,1]],
    '30': [[0,0],[-1,0],[2,0],[-1,-2],[2,1]],
    '03': [[0,0],[1,0],[-2,0],[1,2],[-2,-1]]
  };

  /* ---------- 状态 ---------- */
  var board;                 // Uint8Array(COLS*ROWS)，0 空，1..7 方块类型
  var cur = null;            // {type, rot, x, y}
  var holdType = null;
  var canHold = true;
  var bag = [];
  var nextQ = [];
  var history = [];            // 已出过的方块序列（验证 7-bag 用）
  var level = 1, lines = 0;
  var dropTimer = 0, lockTimer = 0, lockResets = 0, grounded = false;
  var flashRows = null, flashT = 0;

  function dropInterval() {
    var ms = 800 - (level - 1) * 70;
    if (ms < 90) ms = 90;
    return ms / 1000;
  }

  /* ---------- 7-bag 随机 ---------- */
  function refillBag() {
    var b = TYPES.slice();
    for (var i = b.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0;
      var t = b[i]; b[i] = b[j]; b[j] = t;
    }
    for (var k = 0; k < b.length; k++) bag.push(b[k]);
  }
  function pullType() {
    if (!bag.length) refillBag();
    return bag.shift();
  }
  function fillNext() {
    while (nextQ.length < 3) nextQ.push(pullType());
  }

  /* ---------- 碰撞 ---------- */
  function cellsOf(type, rot) { return PIECES[type][rot]; }

  function collides(piece, dx, dy, rot) {
    var cs = cellsOf(piece.type, rot);
    for (var i = 0; i < cs.length; i++) {
      var x = piece.x + cs[i][0] + dx;
      var y = piece.y + cs[i][1] + dy;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && board[y * COLS + x]) return true;
    }
    return false;
  }

  /* ---------- 生成 ---------- */
  function spawnPiece(a) {
    var g = a || api;
    fillNext();
    var type = nextQ.shift();
    fillNext();
    history.push(type);
    cur = { type: type, rot: 0, x: 3, y: 0 };
    dropTimer = 0; lockTimer = 0; lockResets = 0; grounded = false;
    if (collides(cur, 0, 0, cur.rot)) {
      cur = null;
      g.gameOver('堆到顶了');
    }
  }

  /* ---------- 操作 ---------- */
  function resetLock() {
    // 锁定延迟内成功移动/旋转 → 重置计时（次数有限，防无限拖延）
    if (lockTimer > 0 && lockResets < MAX_LOCK_RESETS) {
      lockTimer = 0;
      lockResets++;
    }
  }

  function move(dx) {
    if (!cur) return false;
    if (collides(cur, dx, 0, cur.rot)) { api.sound('tick'); return false; }
    cur.x += dx;
    resetLock();
    api.sound('move');
    return true;
  }

  function rotate(dir) {
    if (!cur) return;
    if (dir !== 1 && dir !== -1) return;     // 只支持 ±90°，避免踢墙表查不到
    if (cur.type === 'O') { api.sound('tick'); return; }
    var from = cur.rot;
    var to = (from + dir + 4) % 4;
    var kicks = (cur.type === 'I' ? KICK_I : KICK_J)['' + from + to];
    for (var i = 0; i < kicks.length; i++) {
      if (!collides(cur, kicks[i][0], kicks[i][1], to)) {
        cur.rot = to;
        cur.x += kicks[i][0];
        cur.y += kicks[i][1];
        resetLock();
        api.sound('move');
        return;
      }
    }
    api.sound('tick');
  }

  function softDrop() {
    if (!cur) return;
    if (!collides(cur, 0, 1, cur.rot)) {
      cur.y++;
      api.addScore(1);
      dropTimer = 0;
      api.sound('move');
    } else {
      api.sound('tick');
    }
  }

  function hardDrop() {
    if (!cur) return;
    var d = 0;
    while (!collides(cur, 0, 1, cur.rot)) { cur.y++; d++; }
    if (d > 0) api.addScore(d * 2);
    api.sound('lock');
    lockPiece();
  }

  function doHold() {
    if (!cur) return;
    if (!canHold) { api.sound('tick'); return; }
    canHold = false;
    var t = cur.type;
    if (holdType) {
      cur = { type: holdType, rot: 0, x: 3, y: 0 };
      holdType = t;
      dropTimer = 0; lockTimer = 0; lockResets = 0; grounded = false;
      if (collides(cur, 0, 0, cur.rot)) { cur = null; api.gameOver('堆到顶了'); }
    } else {
      holdType = t;
      spawnPiece();
    }
    api.sound('click');
  }

  /* ---------- 锁定与消行 ---------- */
  function lockPiece() {
    if (!cur) return;
    var cs = cellsOf(cur.type, cur.rot);
    for (var i = 0; i < cs.length; i++) {
      var x = cur.x + cs[i][0], y = cur.y + cs[i][1];
      if (y >= 0) board[y * COLS + x] = TYPE_ID[cur.type];
    }
    api.sound('lock');
    clearLines();
    canHold = true;
    cur = null;
    spawnPiece();
  }

  function clearLines() {
    var cleared = 0;
    for (var r = ROWS - 1; r >= 0; r--) {
      var full = true;
      for (var c = 0; c < COLS; c++) {
        if (!board[r * COLS + c]) { full = false; break; }
      }
      if (!full) continue;
      cleared++;
      for (var r2 = r; r2 > 0; r2--) {
        for (var c2 = 0; c2 < COLS; c2++) board[r2 * COLS + c2] = board[(r2 - 1) * COLS + c2];
      }
      for (var c3 = 0; c3 < COLS; c3++) board[c3] = 0;
      r++;
    }
    if (!cleared) return;
    lines += cleared;
    var pts = [0, 100, 300, 500, 800][cleared] * level;
    api.addScore(pts);
    api.setStat('lines', lines);
    var nl = Math.floor(lines / 10) + 1;
    if (nl !== level) { level = nl; api.setStat('level', level); }
    api.sound(cleared >= 4 ? 'win' : 'merge');
  }

  function ghostY() {
    if (!cur) return 0;
    // 注意：collides 的 dx/dy 是相对 piece 位置的偏移，必须用探针逐格下移，
    // 否则一直检测同一个位置 → 死循环
    var gy = cur.y;
    var probe = { type: cur.type, rot: cur.rot, x: cur.x, y: gy };
    while (!collides(probe, 0, 1, cur.rot)) { gy++; probe.y = gy; }
    return gy;
  }

  /* ---------- 初始化 ---------- */
  function resetGame(a) {
    var g = a || api;
    board = new Uint8Array(COLS * ROWS);
    bag = []; nextQ = []; history = [];
    level = 1; lines = 0;
    dropTimer = 0; lockTimer = 0; lockResets = 0; grounded = false;
    holdType = null; canHold = true;
    cur = null;
    g.setScore(0);
    g.setStat('lines', 0);
    g.setStat('level', 1);
    fillNext();
    spawnPiece(g);
  }

  /* ---------- 绘制 ---------- */
  function roundRect(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function pieceColor(type, pal) {
    switch (type) {
      case 'I': return pal.at(-45, 0.06, 0.12);
      case 'J': return pal.at(-10, 0.08, -0.04);
      case 'L': return pal.at(40, 0.10, 0.02);
      case 'O': return pal.at(20, 0.14, 0.14);
      case 'S': return pal.at(120, 0.08, 0.06);
      case 'T': return pal.at(175, 0.08, 0.08);
      default:  return pal.at(-25, 0.16, -0.02);
    }
  }

  function drawBlock(c, x, y, size, color, opts) {
    opts = opts || {};
    var r = Math.max(2, size * 0.22);
    c.save();
    if (opts.alpha != null) c.globalAlpha = opts.alpha;
    if (opts.ghost) {
      c.strokeStyle = color;
      c.lineWidth = Math.max(1.2, size * 0.09);
      roundRect(c, x + 1, y + 1, size - 2, size - 2, r);
      c.stroke();
      c.restore();
      return;
    }
    if (opts.glow) { c.shadowColor = color; c.shadowBlur = opts.glow; }
    c.fillStyle = color;
    roundRect(c, x, y, size, size, r);
    c.fill();
    c.shadowBlur = 0;
    // 顶部高光
    c.fillStyle = 'rgba(255,255,255,.22)';
    roundRect(c, x + size * 0.16, y + size * 0.12, size * 0.68, size * 0.2, r * 0.5);
    c.fill();
    c.restore();
  }

  function drawPreview(c, type, cx, cy, size, alpha) {
    if (!type) return;
    var cs = PIECES[type][0];
    var minx = 9, maxx = -9, miny = 9, maxy = -9;
    for (var i = 0; i < cs.length; i++) {
      minx = Math.min(minx, cs[i][0]); maxx = Math.max(maxx, cs[i][0]);
      miny = Math.min(miny, cs[i][1]); maxy = Math.max(maxy, cs[i][1]);
    }
    var w = (maxx - minx + 1) * size, h = (maxy - miny + 1) * size;
    var ox = cx - w / 2 - minx * size, oy = cy - h / 2 - miny * size;
    var col = pieceColor(type, api.colors);
    for (var k = 0; k < cs.length; k++) {
      drawBlock(c, ox + cs[k][0] * size, oy + cs[k][1] * size, size, col, { alpha: alpha, glow: 6 });
    }
  }

  function panelBox(c, x, y, w, h, label, pal) {
    c.save();
    roundRect(c, x, y, w, h, 12);
    c.fillStyle = 'rgba(255,255,255,.035)';
    c.fill();
    c.strokeStyle = 'rgba(255,255,255,.1)';
    c.lineWidth = 1;
    c.stroke();
    c.font = '600 9.5px -apple-system, "PingFang SC", system-ui, sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'top';
    c.fillStyle = 'rgba(255,255,255,.4)';
    c.letterSpacing = '1.5px';
    c.fillText(label, x + w / 2, y + 9);
    c.restore();
  }

  var api = window.GameKit.create({
    slug: 'tetris',
    title: '俄罗斯方块',
    logic: [LW, LH],
    color: '#635bff',
    dpad: false,
    hint: '← → 移动 · ↑ 硬降 · X 旋转 · C 暂存<br>幽灵块预示落点，消行越多等级越高',
    hud: [
      { k: 'score', label: '分数' },
      { k: 'best', label: '最高' },
      { k: 'lines', label: '行数' },
      { k: 'level', label: '等级' }
    ],

    onInit: function (a) { resetGame(a); },

    onUpdate: function (a, dt) {
      if (!cur) return;
      if (collides(cur, 0, 1, cur.rot)) {
        // 落地：进入锁定延迟
        grounded = true;
        lockTimer += dt;
        if (lockTimer >= LOCK_DELAY) lockPiece();
      } else {
        grounded = false;
        lockTimer = 0;
        dropTimer += dt;
        if (dropTimer >= dropInterval()) {
          dropTimer = 0;
          if (!collides(cur, 0, 1, cur.rot)) cur.y++;
        }
      }
    },

    onRender: function (a, c) {
      var pal = a.colors;

      // 棋盘底
      c.save();
      roundRect(c, BX, BY, COLS * CELL, ROWS * CELL, 10);
      c.fillStyle = 'rgba(255,255,255,.028)';
      c.fill();
      c.strokeStyle = 'rgba(255,255,255,.09)';
      c.lineWidth = 1;
      c.stroke();
      // 网格
      c.strokeStyle = 'rgba(255,255,255,.045)';
      c.beginPath();
      for (var gx = 1; gx < COLS; gx++) {
        c.moveTo(BX + gx * CELL + .5, BY);
        c.lineTo(BX + gx * CELL + .5, BY + ROWS * CELL);
      }
      for (var gy = 1; gy < ROWS; gy++) {
        c.moveTo(BX, BY + gy * CELL + .5);
        c.lineTo(BX + COLS * CELL, BY + gy * CELL + .5);
      }
      c.stroke();
      c.restore();

      // 已锁定方块
      for (var r = 0; r < ROWS; r++) {
        for (var cc = 0; cc < COLS; cc++) {
          var v = board[r * COLS + cc];
          if (!v) continue;
          var type = TYPES[v - 1];
          drawBlock(c, BX + cc * CELL + 1, BY + r * CELL + 1, CELL - 2, pieceColor(type, pal), { glow: 3 });
        }
      }

      // 幽灵块
      if (cur) {
        // 注意：cs 必须在 if 外取，var 提升后 if 不成立时才是 undefined
        var cs = cellsOf(cur.type, cur.rot);
        var gy2 = ghostY();
        if (gy2 !== cur.y) {
          var gcol = pieceColor(cur.type, pal);
          for (var i = 0; i < cs.length; i++) {
            var gx2 = cur.x + cs[i][0], gy3 = gy2 + cs[i][1];
            if (gy3 < 0) continue;
            drawBlock(c, BX + gx2 * CELL + 1, BY + gy3 * CELL + 1, CELL - 2, gcol, { ghost: true });
          }
        }

        // 当前方块
        var col2 = pieceColor(cur.type, pal);
        var pulse = grounded ? (0.5 + 0.5 * Math.sin(lockTimer * 22)) : 0;
        for (var k = 0; k < cs.length; k++) {
          var x = cur.x + cs[k][0], y = cur.y + cs[k][1];
          if (y < 0) continue;
          drawBlock(c, BX + x * CELL + 1, BY + y * CELL + 1, CELL - 2, col2, { glow: 9 + pulse * 12 });
        }
      }

      // Hold 面板
      panelBox(c, HOLD_X, HOLD_Y, HOLD_W, HOLD_H, 'HOLD', pal);
      if (holdType) {
        drawPreview(c, holdType, HOLD_X + HOLD_W / 2, HOLD_Y + 60, 11.5, canHold ? 1 : 0.35);
      }

      // Next 面板
      panelBox(c, NEXT_X, NEXT_Y, NEXT_W, NEXT_H, 'NEXT', pal);
      for (var n = 0; n < nextQ.length && n < 3; n++) {
        drawPreview(c, nextQ[n], NEXT_X + NEXT_W / 2, NEXT_Y + 42 + n * 55, 10.5, n === 0 ? 1 : 0.62);
      }
    },

    onAction: function (a, act) {
      if (act.type === 'key') {
        var k = act.key;
        if (k === 'ArrowLeft' || k === 'a' || k === 'A') move(-1);
        else if (k === 'ArrowRight' || k === 'd' || k === 'D') move(1);
        else if (k === 'ArrowDown' || k === 's' || k === 'S') softDrop();
        else if (k === 'ArrowUp' || k === 'w' || k === 'W') hardDrop();
        else if (k === 'x' || k === 'X') rotate(1);
        else if (k === 'z' || k === 'Z') rotate(-1);
        else if (k === 'c' || k === 'C' || k === 'Shift') doHold();
      } else if (act.type === 'swipe') {
        if (act.dir === 'left') move(-1);
        else if (act.dir === 'right') move(1);
        else if (act.dir === 'down') softDrop();
      } else if (act.type === 'tap') {
        rotate(1);                      // 触屏：点一下转一次
      }
    }
  });

  /* ---------- 底部控制条 ---------- */
  var acts = {
    left: function () { move(-1); },
    right: function () { move(1); },
    rot: function () { rotate(1); },
    drop: function () { hardDrop(); },
    hold: function () { doHold(); }
  };
  Array.prototype.forEach.call(document.querySelectorAll('#ctrls button'), function (btn) {
    btn.addEventListener('click', function () {
      if (api.state !== 'playing') return;
      var f = acts[btn.getAttribute('data-act')];
      if (f) f();
    });
  });

  /* 开发钩子：仅 ?dev=1 时暴露内部状态，供自动化测试 */
  if (/[?&]dev=1/.test(location.search)) {
    window.__tetris = {
      get cur() { return cur ? { type: cur.type, rot: cur.rot, x: cur.x, y: cur.y } : null; },
      get hold() { return holdType; },
      get next() { return nextQ.slice(); },
      get bag() { return bag.slice(); },
      get history() { return history.slice(); },
      get canHold() { return canHold; },
      get level() { return level; },
      get lines() { return lines; },
      get lockTimer() { return lockTimer; },
      get lockResets() { return lockResets; },
      get grounded() { return grounded; },
      board: function () {
        var out = [];
        for (var r = 0; r < ROWS; r++) {
          var line = [];
          for (var c = 0; c < COLS; c++) line.push(board[r * COLS + c]);
          out.push(line);
        }
        return out;
      },
      move: move, rotate: rotate, softDrop: softDrop, hardDrop: hardDrop,
      ghostY: function () { return ghostY(); },
      // 注意：不要用 hold 作键名，会覆盖上面的 get hold() getter
      holdPiece: doHold, reset: function () { api.restart(); },
      fillRow: function (r, type, cols) {
        var n = (cols == null) ? COLS : cols;
        for (var c = 0; c < n; c++) board[r * COLS + c] = type || 1;
      },
      clearTop: function () {
        for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) board[r * COLS + c] = 0;
      }
    };
  }

  void api;
})();
</script>
