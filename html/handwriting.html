<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fbfaf7">
<link rel="icon" type="image/png" href="../assets/image/favicon-round.png">
<link rel="apple-touch-icon" href="../assets/image/logo.png">
<title>手写板</title>
<link rel="stylesheet" href="../assets/css/palette-kit.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#fbfaf7;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#23262d;-webkit-font-smoothing:antialiased;
    touch-action:none;user-select:none;-webkit-user-select:none;
    transition:background .25s ease,color .25s ease;
  }
  body.dark{background:#16191f;color:#e8ebf0;}
  canvas{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:crosshair;}
  .ui{position:fixed;z-index:5;opacity:1;transition:opacity .5s ease;}
  body.idle .ui{opacity:.18;}
  body.idle .ui:hover,body.idle .ui:focus-within{opacity:1;}
  .back{
    top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));
    width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.08);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#23262d;text-decoration:none;
    box-shadow:0 2px 10px rgba(0,0,0,.06);transition:transform .12s ease;
  }
  body.dark .back{background:rgba(30,35,44,.75);border-color:rgba(255,255,255,.12);color:#e8ebf0;}
  .back:active{transform:scale(.94);}
  .back svg{width:15px;height:15px;}

  .bar{
    left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);
    display:flex;align-items:center;gap:6px;max-width:calc(100vw - 20px);
    padding:7px;border-radius:16px;overflow-x:auto;scrollbar-width:none;
    background:rgba(255,255,255,.88);border:1px solid rgba(0,0,0,.08);
    box-shadow:0 4px 18px rgba(0,0,0,.09);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  }
  body.dark .bar{background:rgba(28,33,42,.85);border-color:rgba(255,255,255,.12);}
  .bar::-webkit-scrollbar{display:none;}
  .tool{
    flex:0 0 auto;height:34px;min-width:34px;padding:0 10px;border:none;border-radius:10px;
    background:transparent;color:#4b525d;font-family:inherit;font-size:12.5px;font-weight:600;
    cursor:pointer;outline:none;white-space:nowrap;display:flex;align-items:center;gap:5px;
    transition:background-color .15s ease,transform .12s ease;
  }
  body.dark .tool{color:#c6cdd8;}
  .tool:hover{background:rgba(0,0,0,.06);}
  body.dark .tool:hover{background:rgba(255,255,255,.08);}
  .tool:active{transform:scale(.93);}
  .tool.on{background:rgba(99,91,255,.14);color:#635bff;}
  body.dark .tool.on{background:rgba(120,140,255,.18);color:#a9b5ff;}
  .tool i{width:14px;height:14px;border-radius:50%;background:#23262d;display:block;}
  body.dark .tool i{background:#e8ebf0;}
  .sep{width:1px;height:20px;background:rgba(0,0,0,.1);flex:0 0 auto;}
  body.dark .sep{background:rgba(255,255,255,.14);}
  .tool.primary{background:#23262d;color:#fff;}
  body.dark .tool.primary{background:#e8ebf0;color:#16191f;}
  .panel{
    position:fixed;z-index:6;right:calc(12px + env(safe-area-inset-right));
    top:calc(12px + env(safe-area-inset-top));
    display:flex;flex-direction:column;gap:8px;align-items:flex-end;
  }
  .hint{
    left:50%;bottom:calc(62px + env(safe-area-inset-bottom));transform:translateX(-50%);
    font-size:12px;color:#8b93a1;pointer-events:none;white-space:nowrap;
  }
  body.dark .hint{color:#7c8695;}

  /* ---------- 格线弹出菜单 ---------- */
  .pop{
    position:fixed;z-index:20;min-width:132px;padding:5px;
    display:flex;flex-direction:column;gap:2px;
    border-radius:12px;background:rgba(255,255,255,.94);
    border:1px solid rgba(0,0,0,.08);box-shadow:0 8px 26px rgba(0,0,0,.14);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  }
  .pop[hidden]{display:none !important;}
  body.dark .pop{background:rgba(28,33,42,.92);border-color:rgba(255,255,255,.12);box-shadow:0 8px 26px rgba(0,0,0,.5);}
  .pop-item{
    display:flex;align-items:center;gap:8px;width:100%;
    border:none;background:transparent;color:#4b525d;font-family:inherit;
    font-size:12.5px;font-weight:600;text-align:left;padding:8px 10px;border-radius:8px;
    cursor:pointer;white-space:nowrap;transition:background-color .14s ease,color .14s ease;
  }
  body.dark .pop-item{color:#c6cdd8;}
  .pop-item:hover{background:rgba(0,0,0,.06);}
  body.dark .pop-item:hover{background:rgba(255,255,255,.08);}
  .pop-item.on{background:rgba(99,91,255,.14);color:#635bff;}
  body.dark .pop-item.on{background:rgba(120,140,255,.18);color:#a9b5ff;}
  .pop-item .tick{width:13px;flex:0 0 auto;opacity:0;}
  .pop-item.on .tick{opacity:1;}
  .pop-item .ico{
    width:16px;height:16px;flex:0 0 auto;border-radius:3px;
    border:1px solid rgba(0,0,0,.18);background-repeat:no-repeat;
  }
  body.dark .pop-item .ico{border-color:rgba(255,255,255,.22);}
  #icoLine{
    background-image:repeating-linear-gradient(to bottom,rgba(0,0,0,.34) 0 1px,transparent 1px 5px);
  }
  #icoGrid{
    background-image:
      repeating-linear-gradient(to bottom,rgba(0,0,0,.30) 0 1px,transparent 1px 5px),
      repeating-linear-gradient(to right,rgba(0,0,0,.30) 0 1px,transparent 1px 5px);
  }
  #icoNone{background:transparent;}
  body.dark #icoLine{background-image:repeating-linear-gradient(to bottom,rgba(255,255,255,.42) 0 1px,transparent 1px 5px);}
  body.dark #icoGrid{
    background-image:
      repeating-linear-gradient(to bottom,rgba(255,255,255,.38) 0 1px,transparent 1px 5px),
      repeating-linear-gradient(to right,rgba(255,255,255,.38) 0 1px,transparent 1px 5px);
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<a class="ui back" href="../x.html" title="返回" aria-label="返回">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</a>

<div class="ui panel">
  <div class="pk" id="pk" data-pk="handwriting" data-placement="left"></div>
</div>

<div class="ui bar">
  <button class="tool" id="wBtn" type="button" title="笔宽"><span>笔宽</span><i id="wDot"></i></button>
  <button class="tool" id="brushBtn" type="button" title="切换笔刷：圆笔 / 铅笔">圆笔</button>
  <button class="tool" id="eraserBtn" type="button" title="橡皮（E）">橡皮</button>
  <i class="sep"></i>
  <button class="tool" id="gridBtn" type="button" title="格线：横线 / 网格 / 无">横线</button>
  <button class="tool" id="bgBtn" type="button" title="纸 / 深色"><span id="bgText">深色</span></button>
  <i class="sep"></i>
  <button class="tool" id="undoBtn" type="button" title="撤销（Z）">撤销</button>
  <button class="tool" id="clearBtn" type="button" title="清空">清空</button>
  <i class="sep"></i>
  <button class="tool primary" id="saveBtn" type="button" title="保存 PNG（透明底）">保存</button>
</div>

<div class="pop" id="gridPop" hidden role="menu" aria-label="格线样式">
  <button class="pop-item" type="button" role="menuitemradio" data-grid="1">
    <span class="tick">✓</span><span class="ico" id="icoLine"></span>横线格
  </button>
  <button class="pop-item" type="button" role="menuitemradio" data-grid="2">
    <span class="tick">✓</span><span class="ico" id="icoGrid"></span>网格
  </button>
  <button class="pop-item" type="button" role="menuitemradio" data-grid="0">
    <span class="tick">✓</span><span class="ico" id="icoNone"></span>无（空白纸）
  </button>
</div>

<div class="ui hint" id="hint">用手指或鼠标书写 · 导出为透明底 PNG</div>

<script src="../assets/js/palette-kit.js"></script>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  /* 笔迹层（透明底，导出用） */
  var inkCv = document.createElement('canvas');
  var ictx = inkCv.getContext('2d');

  var penColor = '#23262d';
  var widths = [1.6, 3, 6, 12];
  var wIdx = 1;
  var BRUSHES = ['圆笔', '铅笔'];
  var brushIdx = 0;
  var erasing = false;
  var dark = false;
  var gridMode = 1;           // 0 无 / 1 横线 / 2 网格
  var drawing = false, last = null;
  var snaps = [];
  var SNAP_LIMIT = 8;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    inkCv.width = cv.width; inkCv.height = cv.height;
    ictx.setTransform(DPR, 0, 0, DPR, 0, 0);
    snaps.length = 0;
    repaint();
  }

  function paperColor() { return dark ? '#16191f' : '#fbfaf7'; }

  function repaint() {
    ctx.fillStyle = paperColor();
    ctx.fillRect(0, 0, W, H);

    // 格线
    if (gridMode) {
      ctx.strokeStyle = dark ? 'rgba(255,255,255,.08)' : 'rgba(35,38,45,.09)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      if (gridMode === 1) {
        var gap = Math.max(48, Math.min(120, H / 10));
        for (var y = gap; y < H; y += gap) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
      } else {
        var gs = 56;
        for (var gx = gs; gx < W; gx += gs) { ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
        for (var gy = gs; gy < H; gy += gs) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
      }
      ctx.stroke();
    }

    ctx.drawImage(inkCv, 0, 0, W, H);
  }

  function pushSnap() {
    if (snaps.length >= SNAP_LIMIT) snaps.shift();
    snaps.push(ictx.getImageData(0, 0, inkCv.width, inkCv.height));
  }

  function undo() {
    var s = snaps.pop();
    if (!s) return;
    ictx.putImageData(s, 0, 0);
    repaint();
  }

  function pos(e) {
    var r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function strokeTo(x1, y1, x2, y2) {
    ictx.save();
    ictx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
    ictx.strokeStyle = penColor;
    ictx.fillStyle = penColor;
    ictx.lineCap = 'round';
    ictx.lineJoin = 'round';

    if (erasing) {
      ictx.lineWidth = widths[wIdx] * 3.4;
      ictx.globalAlpha = 1;
      ictx.beginPath();
      ictx.moveTo(x1, y1);
      ictx.lineTo(x2, y2);
      ictx.stroke();
      ictx.restore();
      return;
    }

    var w = widths[wIdx];
    if (BRUSHES[brushIdx] === '铅笔') {
      // 淡底线 + 石墨颗粒
      ictx.lineWidth = Math.max(1.8, w * 0.5);
      ictx.globalAlpha = 0.68;
      ictx.beginPath();
      ictx.moveTo(x1, y1);
      ictx.lineTo(x2, y2);
      ictx.stroke();
      var steps = Math.max(1, Math.round(Math.hypot(x2 - x1, y2 - y1) / 1.5));
      for (var i = 0; i <= steps; i++) {
        var tt = i / steps;
        var px = x1 + (x2 - x1) * tt + (Math.random() - 0.5) * w * 0.5;
        var py = y1 + (y2 - y1) * tt + (Math.random() - 0.5) * w * 0.5;
        ictx.globalAlpha = 0.25 + Math.random() * 0.45;
        ictx.beginPath();
        ictx.arc(px, py, Math.max(0.7, w * 0.15), 0, 6.2832);
        ictx.fill();
      }
      ictx.restore();
      return;
    }

    ictx.lineWidth = w;
    ictx.globalAlpha = 0.92;
    ictx.beginPath();
    ictx.moveTo(x1, y1);
    ictx.lineTo(x2, y2);
    ictx.stroke();
    ictx.restore();
  }

  cv.addEventListener('pointerdown', function (e) {
    cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
    pushSnap();
    drawing = true;
    last = pos(e);
    strokeTo(last.x, last.y, last.x + 0.01, last.y + 0.01);
    repaint();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drawing) return;
    var p = pos(e);
    strokeTo(last.x, last.y, p.x, p.y);
    last = p;
    repaint();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
    cv.addEventListener(ev, function () { drawing = false; last = null; });
  });

  /* ---------------- 控件 ---------------- */
  var wBtn = document.getElementById('wBtn');
  if (wBtn) wBtn.addEventListener('click', function () {
    wIdx = (wIdx + 1) % widths.length;
    var d = document.getElementById('wDot');
    if (d) d.style.transform = 'scale(' + (0.45 + widths[wIdx] / 9) + ')';
  });

  var brushBtn = document.getElementById('brushBtn');
  if (brushBtn) brushBtn.addEventListener('click', function () {
    brushIdx = (brushIdx + 1) % BRUSHES.length;
    brushBtn.textContent = BRUSHES[brushIdx];
    if (erasing) setEraser(false);
  });

  function setEraser(on) {
    erasing = on;
    var eb = document.getElementById('eraserBtn');
    if (eb) eb.classList.toggle('on', erasing);
    var bb = document.getElementById('brushBtn');
    if (bb) bb.classList.toggle('on', !erasing);
  }

  var eraserBtn = document.getElementById('eraserBtn');
  if (eraserBtn) eraserBtn.addEventListener('click', function () { setEraser(!erasing); });

  var GRID_NAMES = { 0: '无', 1: '横线', 2: '网格' };
  var gridBtn = document.getElementById('gridBtn');
  var gridPop = document.getElementById('gridPop');
  var gridItems = gridPop ? [].slice.call(gridPop.querySelectorAll('.pop-item')) : [];

  function setGrid(mode) {
    gridMode = mode;
    if (gridBtn) gridBtn.textContent = GRID_NAMES[mode];
    gridItems.forEach(function (b) {
      var on = +b.getAttribute('data-grid') === mode;
      b.classList.toggle('on', on);
      b.setAttribute('aria-checked', on ? 'true' : 'false');
    });
    repaint();
  }

  function placePop() {
    if (!gridPop || !gridBtn) return;
    gridPop.hidden = false;
    gridPop.style.visibility = 'hidden';
    var r = gridBtn.getBoundingClientRect();
    var pr = gridPop.getBoundingClientRect();
    var left = r.left + r.width / 2 - pr.width / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - pr.width - 8));
    var top = r.top - pr.height - 8;
    if (top < 8) top = r.bottom + 8;
    gridPop.style.left = left + 'px';
    gridPop.style.top = top + 'px';
    gridPop.style.visibility = 'visible';
  }

  function closePop() { if (gridPop) gridPop.hidden = true; }

  if (gridBtn) gridBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (gridPop && gridPop.hidden) placePop(); else closePop();
  });
  gridItems.forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      setGrid(+b.getAttribute('data-grid'));
      closePop();
    });
  });
  document.addEventListener('click', function (e) {
    if (gridPop && !gridPop.hidden && !gridPop.contains(e.target)) closePop();
  });

  var bgBtn = document.getElementById('bgBtn');
  var savedPen = null;                      // 深色纸前的笔色，切回来时恢复
  if (bgBtn) bgBtn.addEventListener('click', function () {
    dark = !dark;
    document.body.classList.toggle('dark', dark);
    document.getElementById('bgText').textContent = dark ? '纸色' : '深色';
    if (dark) {
      // 深色纸上深色笔看不见 → 自动换成浅色笔
      savedPen = penColor;
      var c = window.PaletteKit.hex2rgb(penColor);
      if (c && (c.r * 0.299 + c.g * 0.587 + c.b * 0.114) < 100) penColor = '#e8ebf0';
    } else if (savedPen) {
      penColor = savedPen;
      savedPen = null;
    }
    repaint();
  });

  var undoBtn = document.getElementById('undoBtn');
  if (undoBtn) undoBtn.addEventListener('click', undo);

  var clearBtn = document.getElementById('clearBtn');
  if (clearBtn) clearBtn.addEventListener('click', function () {
    ictx.clearRect(0, 0, W, H);
    snaps.length = 0;
    repaint();
  });

  var saveBtn = document.getElementById('saveBtn');
  if (saveBtn) saveBtn.addEventListener('click', function () {
    try {
      var out = document.createElement('canvas');
      out.width = 1600; out.height = Math.round(1600 * H / W);
      var o = out.getContext('2d');
      // 透明底 + 笔迹
      o.drawImage(inkCv, 0, 0, out.width, out.height);
      // 深色模式下笔迹可能是深色，转成白色便于在白底使用
      out.toBlob(function (blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'handwriting-' + new Date().toISOString().slice(0, 10) + '-' + Date.now() % 10000 + '.png';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
        var h = document.getElementById('hint');
        if (h) {
          h.textContent = '已保存透明底 PNG ✓';
          setTimeout(function () { h.textContent = '用手指或鼠标书写 · 导出为透明底 PNG'; }, 1800);
        }
      }, 'image/png');
    } catch (e) { }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePop();
    if (e.key === 'z' || e.key === 'Z') undo();
    if (e.key === 'e' || e.key === 'E') setEraser(!erasing);
  });

  /* ---------------- 闲置淡出 ---------------- */
  var idleTimer = null;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 3000);
  }
  ['pointermove', 'pointerdown', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, wake, { passive: true });
  });
  wake();

  /* ---------------- 启动 ---------------- */
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 240); });
  window.addEventListener('resize', function () { if (gridPop && !gridPop.hidden) placePop(); }, { passive: true });

  var pk = window.PaletteKit.mount(document.getElementById('pk'), {
    value: '#23262d',
    onChange: function (c) { penColor = c; }
  });
  penColor = pk.get();

  setGrid(gridMode);      // 初始化格线状态与按钮文字
  setEraser(false);       // 初始化笔刷按钮状态
  resize();
})();
</script>
</body>
</html>
