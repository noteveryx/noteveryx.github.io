<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05070e">
<link rel="icon" type="image/png" href="../assets/image/favicon-round.png">
<link rel="apple-touch-icon" href="../assets/image/logo.png">
<title>2048</title>
<link rel="stylesheet" href="../assets/css/palette-kit.css">
<link rel="stylesheet" href="../assets/css/game-kit.css">
<style>
  /* 提示条：玩法说明 */
  .tip{
    position:fixed;z-index:12;left:50%;transform:translateX(-50%);
    bottom:calc(74px + env(safe-area-inset-bottom));
    font-size:11px;letter-spacing:.08em;color:rgba(255,255,255,.34);
    pointer-events:none;user-select:none;white-space:nowrap;
  }
  @media (max-width:420px){ .tip{font-size:10px;letter-spacing:.02em;} }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="tip">方向键 / WASD / 滑动 移动 · 空格 暂停 · 右上色球换配色</div>

<script src="../assets/js/palette-kit.js"></script>
<script src="../assets/js/game-kit.js"></script>
<script>
(function () {
  'use strict';

  var N = 4;
  var LW = 480, LH = 720;
  var PAD = 14, GAP = 12, CELL = 106;
  var TILE = CELL - 10;
  var TOP = 132;                       // 棋盘顶部逻辑坐标
  var ANIM = 0.14;                     // 移动动画时长（秒）

  var grid, idSeq = 0;
  var animT = ANIM;
  var won = false;

  function newGrid() {
    var g = [];
    for (var r = 0; r < N; r++) {
      g.push([]);
      for (var c = 0; c < N; c++) g[r].push(null);
    }
    return g;
  }

  function spawn(r, c, v) {
    var t = { v: v, id: ++idSeq, r: r, c: c, pr: r, pc: c, born: true, merged: false };
    grid[r][c] = t;
    return t;
  }

  function addRandom() {
    var free = [];
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) if (!grid[r][c]) free.push([r, c]);
    }
    if (!free.length) return null;
    var p = free[(Math.random() * free.length) | 0];
    return spawn(p[0], p[1], Math.random() < 0.9 ? 2 : 4);
  }

  /* ---------------- 移动 ---------------- */
  function move(dir) {
    var old = [];
    for (var r = 0; r < N; r++) {
      old.push([]);
      for (var c = 0; c < N; c++) old[r][c] = grid[r][c];
    }

    var gained = 0, changed = false;
    var ng = newGrid();

    for (var line = 0; line < N; line++) {
      var cells = [];
      for (var i = 0; i < N; i++) {
        var r, c;
        if (dir === 'left') { r = line; c = i; }
        else if (dir === 'right') { r = line; c = N - 1 - i; }
        else if (dir === 'up') { r = i; c = line; }
        else { r = N - 1 - i; c = line; }
        cells.push({ r: r, c: c, tile: old[r][c] });
      }

      var seq = [];
      for (var k = 0; k < cells.length; k++) if (cells[k].tile) seq.push(cells[k]);

      /* 合并成 out */
      var out = [], i = 0;
      while (i < seq.length) {
        if (i + 1 < seq.length && seq[i].tile.v === seq[i + 1].tile.v) {
          var a = seq[i].tile, b = seq[i + 1].tile;
          out.push({
            v: a.v * 2, id: ++idSeq, born: false, merged: true,
            srcR: a.r, srcC: a.c, tileA: a, tileB: b
          });
          gained += a.v * 2;
          i += 2;
        } else {
          var s = seq[i].tile;
          out.push({ v: s.v, id: s.id, born: false, merged: false, srcR: s.r, srcC: s.c, tileA: s });
          i++;
        }
      }

      /* 放到目标格 */
      for (var m = 0; m < out.length; m++) {
        var t = out[m];
        var tr, tc;
        if (dir === 'left') { tr = line; tc = m; }
        else if (dir === 'right') { tr = line; tc = N - 1 - m; }
        else if (dir === 'up') { tr = m; tc = line; }
        else { tr = N - 1 - m; tc = line; }

        t.r = tr; t.c = tc;
        t.pr = t.srcR; t.pc = t.srcC;
        t.pulse = t.merged ? 1 : 0;
        t.scale = 1;
        ng[tr][tc] = t;
        if (t.merged || t.srcR !== tr || t.srcC !== tc) changed = true;
      }
    }

    if (!changed) return false;

    grid = ng;
    var nt = addRandom();
    if (nt) { nt.born = true; nt.scale = 0; }
    animT = 0;
    api.addScore(gained);
    if (gained) api.sound('merge');
    else api.sound('move');

    var mx = 0;
    for (var r2 = 0; r2 < N; r2++) for (var c2 = 0; c2 < N; c2++) if (grid[r2][c2]) mx = Math.max(mx, grid[r2][c2].v);
    api.setStat('max', mx);
    if (!won && mx >= 2048) { won = true; api.sound('win'); }
    return true;
  }

  /* ---------------- 判定 ---------------- */
  function canMove() {
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        if (!grid[r][c]) return true;
        if (c + 1 < N && grid[r][c + 1] && grid[r][c + 1].v === grid[r][c].v) return true;
        if (r + 1 < N && grid[r + 1][c] && grid[r + 1][c].v === grid[r][c].v) return true;
      }
    }
    return false;
  }

  /* ---------------- 渲染 ---------------- */
  function tileColor(v) {
    var k = Math.log(v) / Math.log(2);           // 2→1 … 2048→11
    var t = Math.min(1, Math.max(0, (k - 1) / 9));
    var col = api.colors.at(0, -0.16 + t * 0.3, -0.3 + t * 0.56);
    return col;
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawTile(c, t, e) {
    // pr/pc 是旧格（行/列），插值到新格
    var x = PAD + (t.pc + (t.c - t.pc) * e) * (CELL + GAP) + 5;
    var y = TOP + (t.pr + (t.r - t.pr) * e) * (CELL + GAP) + 5;

    var scale = 1;
    if (t.born) {
      // easeOutBack 弹出
      var c1 = 1.70158, c3 = c1 + 1;
      var eb = 1 + c3 * Math.pow(e - 1, 3) + c1 * Math.pow(e - 1, 2);
      scale = e <= 0 ? 0 : eb;
    }
    if (t.merged) scale = 1 + 0.2 * (1 - e);   // 合并脉冲

    var w = TILE * scale, h = TILE * scale;
    var cx = x + TILE / 2;
    var cy = y + TILE / 2;
    var col = tileColor(t.v);

    // 发光
    c.save();
    c.shadowColor = col;
    c.shadowBlur = 8 + (t.merged ? 20 * (1 - e) : 0) + Math.log(t.v) * 1.2;
    c.fillStyle = col;
    roundRect(c, cx - w / 2, cy - h / 2, w, h, 14);
    c.fill();
    c.restore();

    // 数字
    var digits = String(t.v).length;
    var fs = digits <= 2 ? 40 : digits === 3 ? 33 : digits === 4 ? 27 : 22;
    c.save();
    c.font = '700 ' + fs + 'px -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = 'rgba(255,255,255,.96)';
    c.shadowColor = 'rgba(0,0,0,.45)';
    c.shadowBlur = 4;
    c.fillText(String(t.v), cx, cy + 1);
    c.restore();
  }

  var api = window.GameKit.create({
    slug: '2048',
    title: '2048',
    logic: [LW, LH],
    color: '#635bff',
    hint: '滑动或按方向键合并数字，目标是 2048',
    hud: [
      { k: 'score', label: '分数' },
      { k: 'best', label: '最佳' },
      { k: 'max', label: '最大' }
    ],

    onInit: function (a) {
      grid = newGrid();
      idSeq = 0;
      won = false;
      animT = ANIM;
      a.setScore(0);
      a.setStat('max', 0);
      addRandom();
      addRandom();
    },

    onUpdate: function (a, dt) {
      animT += dt;
      if (api.state === 'playing' && !canMove()) {
        api.sound('die');
        api.gameOver('没有可移动的方块了');
      }
    },

    onRender: function (a, c) {
      var e = 1 - Math.pow(1 - Math.min(1, animT / ANIM), 3);

      // 棋盘底格
      c.save();
      c.fillStyle = 'rgba(255,255,255,.05)';
      for (var r = 0; r < N; r++) {
        for (var cc = 0; cc < N; cc++) {
          roundRect(c, PAD + cc * (CELL + GAP), TOP + r * (CELL + GAP), CELL, CELL, 14);
          c.fill();
        }
      }
      c.restore();

      // 方块
      for (var r2 = 0; r2 < N; r2++) {
        for (var c2 = 0; c2 < N; c2++) {
          var t = grid[r2][c2];
          if (!t) continue;
          drawTile(c, t, e);
        }
      }
    },

    onAction: function (a, act) {
      var dir = null;
      if (act.type === 'key') {
        var k = act.key;
        if (k === 'ArrowLeft' || k === 'a' || k === 'A') dir = 'left';
        else if (k === 'ArrowRight' || k === 'd' || k === 'D') dir = 'right';
        else if (k === 'ArrowUp' || k === 'w' || k === 'W') dir = 'up';
        else if (k === 'ArrowDown' || k === 's' || k === 'S') dir = 'down';
      } else if (act.type === 'swipe') {
        dir = act.dir;
      }
      if (!dir) return;
      if (move(dir)) return;
      // 无效移动给个轻提示
      a.sound('tick');
    }
  });

  void api;
})();
</script>
</body>
</html>
