<!DOCTYPE html>
<html lang="zh-CN" data-theme="emerald">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#42b983">
  <title>独立页面</title>
  <link rel="icon" type="image/png" href="assets/favicon-round.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <style>
    /* ==========================================================
       主题变量：所有颜色都走 CSS 变量，切换主题只改 data-theme
       ========================================================== */
    :root {
      --brand: #42b983;
      --brand-2: #2f9e6d;
      --brand-soft: rgba(66, 185, 131, .12);
      --brand-ring: rgba(66, 185, 131, .35);

      --bg: #f4f8f7;
      --bg-2: #e9f2ef;
      --card: #ffffff;
      --card-2: #fbfdfc;
      --glass: rgba(244, 248, 247, .78);

      --text: #1e2d29;
      --text-2: #3d504b;
      --muted: #7b8d88;
      --line: #e3ebe7;
      --line-soft: rgba(30, 45, 41, .07);

      --shadow-sm: 0 2px 8px -4px rgba(31, 45, 42, .3);
      --shadow: 0 10px 28px -18px rgba(31, 45, 42, .5);
      --shadow-lg: 0 18px 40px -22px rgba(31, 45, 42, .55);
      --logo-bg: #0b0e2a;
    }

    /* ---------- 深海蓝（深色） ---------- */
    html[data-theme="midnight"] {
      --brand: #5b9dff;
      --brand-2: #3d6fd6;
      --brand-soft: rgba(91, 157, 255, .16);
      --brand-ring: rgba(91, 157, 255, .4);

      --bg: #0d1320;
      --bg-2: #111a29;
      --card: #151f2e;
      --card-2: #1a2534;
      --glass: rgba(13, 19, 32, .74);

      --text: #e7eef8;
      --text-2: #bcc9da;
      --muted: #7f8fa4;
      --line: #232f40;
      --line-soft: rgba(255, 255, 255, .06);

      --shadow-sm: 0 2px 10px -4px rgba(0, 0, 0, .7);
      --shadow: 0 12px 30px -18px rgba(0, 0, 0, .85);
      --shadow-lg: 0 22px 46px -22px rgba(0, 0, 0, .9);
      --logo-bg: #0a0f1e;
    }

    /* ---------- 暖阳橙 ---------- */
    html[data-theme="sunset"] {
      --brand: #f2762e;
      --brand-2: #e05a12;
      --brand-soft: rgba(242, 118, 46, .13);
      --brand-ring: rgba(242, 118, 46, .35);

      --bg: #fdf7f2;
      --bg-2: #fbeade;
      --card: #ffffff;
      --card-2: #fffbf7;
      --glass: rgba(253, 247, 242, .8);

      --text: #33231a;
      --text-2: #5b4436;
      --muted: #96796a;
      --line: #f0e2d6;
      --line-soft: rgba(51, 35, 26, .07);

      --shadow-sm: 0 2px 8px -4px rgba(80, 45, 20, .28);
      --shadow: 0 10px 28px -18px rgba(80, 45, 20, .48);
      --shadow-lg: 0 18px 40px -22px rgba(80, 45, 20, .5);
      --logo-bg: #1a0f08;
    }

    /* ---------- 紫罗兰 ---------- */
    html[data-theme="violet"] {
      --brand: #7c5cff;
      --brand-2: #5b3fd6;
      --brand-soft: rgba(124, 92, 255, .13);
      --brand-ring: rgba(124, 92, 255, .35);

      --bg: #f7f6fd;
      --bg-2: #eeecfb;
      --card: #ffffff;
      --card-2: #fcfbff;
      --glass: rgba(247, 246, 253, .8);

      --text: #241f3d;
      --text-2: #474063;
      --muted: #8b84a8;
      --line: #e8e5f6;
      --line-soft: rgba(36, 31, 61, .07);

      --shadow-sm: 0 2px 8px -4px rgba(45, 30, 110, .3);
      --shadow: 0 10px 28px -18px rgba(45, 30, 110, .5);
      --shadow-lg: 0 18px 40px -22px rgba(45, 30, 110, .55);
      --logo-bg: #120c2b;
    }

    /* ---------- 墨石青（深色） ---------- */
    html[data-theme="ink"] {
      --brand: #2dd4bf;
      --brand-2: #0d9488;
      --brand-soft: rgba(45, 212, 191, .15);
      --brand-ring: rgba(45, 212, 191, .4);

      --bg: #0c1113;
      --bg-2: #101719;
      --card: #131b1e;
      --card-2: #182124;
      --glass: rgba(12, 17, 19, .76);

      --text: #e2edee;
      --text-2: #b3c4c7;
      --muted: #7d9194;
      --line: #212e31;
      --line-soft: rgba(255, 255, 255, .06);

      --shadow-sm: 0 2px 10px -4px rgba(0, 0, 0, .7);
      --shadow: 0 12px 30px -18px rgba(0, 0, 0, .85);
      --shadow-lg: 0 22px 46px -22px rgba(0, 0, 0, .9);
      --logo-bg: #07100f;
    }

    /* ==========================================================
       基础
       ========================================================== */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; width: 100%; max-width: 100%; overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                   "Microsoft YaHei", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      transition: background-color .28s ease, color .28s ease;
    }
    ::selection { background: var(--brand-soft); color: var(--text); }

    /* 背景装饰光晕 */
    .bg-deco {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(760px 420px at 12% -8%, var(--brand-soft), transparent 70%),
        radial-gradient(620px 380px at 92% 4%, var(--brand-soft), transparent 72%);
      opacity: .9;
      transition: background .28s ease;
    }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 999px;
      border: 3px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); background-clip: content-box; }

    /* ==========================================================
       顶栏
       ========================================================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--glass);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      backdrop-filter: saturate(180%) blur(16px);
      border-bottom: 1px solid var(--line-soft);
      transition: background-color .28s ease, border-color .28s ease;
    }
    .topbar-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* 品牌行 */
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
    .brand-logo {
      flex: 0 0 auto;
      width: 46px; height: 46px;
      /* logo.png 本身已带 20% 圆角，这里用百分比保持一致，避免二次裁切 */
      border-radius: 21%;
      display: block;
      background: var(--logo-bg);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .brand:hover .brand-logo { transform: rotate(-4deg) scale(1.04); }
    .brand-text { min-width: 0; }
    .brand-text h1 {
      margin: 0;
      font-size: 1.32rem;
      font-weight: 800;
      letter-spacing: -.01em;
      line-height: 1.3;
    }
    .page-sub {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ==========================================================
       主题切换
       ========================================================== */
    .theme-wrap { position: relative; flex: 0 0 auto; }
    .theme-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text-2);
      font-size: .84rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color .18s, color .18s, background-color .18s, transform .12s;
    }
    .theme-btn:hover { border-color: var(--brand); color: var(--brand); }
    .theme-btn:active { transform: scale(.96); }
    .theme-btn[aria-expanded="true"] { border-color: var(--brand); color: var(--brand); }
    .theme-swatch {
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--brand);
      box-shadow: 0 0 0 2px var(--brand-soft);
      flex: 0 0 auto;
      transition: background-color .28s ease;
    }
    .theme-caret {
      width: 10px; height: 10px;
      border-right: 1.8px solid currentColor;
      border-bottom: 1.8px solid currentColor;
      transform: rotate(45deg) translate(-2px, -2px);
      transition: transform .22s ease;
      flex: 0 0 auto;
    }
    .theme-btn[aria-expanded="true"] .theme-caret { transform: rotate(-135deg) translate(-3px, -3px); }

    .theme-panel {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 208px;
      padding: 8px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-lg);
      z-index: 40;
      transform-origin: top right;
      animation: panelIn .16s ease-out;
    }
    .theme-panel[hidden] { display: none; }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(-6px) scale(.97); }
      to { opacity: 1; transform: none; }
    }
    .theme-panel-title {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .1em;
      color: var(--muted);
      padding: 6px 10px 8px;
      text-transform: uppercase;
    }
    .theme-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--text-2);
      font-size: .86rem;
      font-weight: 600;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: background-color .16s, color .16s;
    }
    .theme-item:hover { background: var(--brand-soft); color: var(--text); }
    .theme-item[aria-checked="true"] { color: var(--brand); background: var(--brand-soft); }
    .theme-item-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      flex: 0 0 auto;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08);
    }
    .theme-item-name { flex: 1; }
    .theme-item-check { font-size: .9rem; opacity: 0; }
    .theme-item[aria-checked="true"] .theme-item-check { opacity: 1; }

    /* ==========================================================
       内容区
       ========================================================== */
    .page {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 24px 56px;
    }

    /* 分组板块 */
    .sp-section { margin: 40px 0 12px; }
    .sp-section:first-child { margin-top: 8px; }
    .sp-head {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.16rem;
      font-weight: 800;
      letter-spacing: -.01em;
      color: var(--text);
      margin: 0;
    }
    .sp-emoji {
      font-size: 1.05rem;
      line-height: 1;
      filter: saturate(1.1);
    }
    .sp-head::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--line), transparent);
      margin-left: 4px;
    }
    .sp-count {
      font-family: "Roboto Mono", "SF Mono", Monaco, Consolas, monospace;
      font-size: .7rem;
      font-weight: 600;
      color: var(--brand);
      background: var(--brand-soft);
      border-radius: 999px;
      padding: 2px 9px;
      flex: 0 0 auto;
    }
    .sp-sub { color: var(--muted); font-size: .86rem; margin: 8px 0 18px; }

    /* 卡片网格 */
    .sp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(244px, 1fr));
      gap: 16px;
    }
    .sp-card {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 20px 16px;
      background: var(--card);
      text-decoration: none !important;
      font-weight: 400 !important;
      box-shadow: var(--shadow-sm);
      transition: transform .2s cubic-bezier(.2, .8, .2, 1), border-color .2s, box-shadow .2s, background-color .28s ease;
    }
    .sp-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--brand-soft), transparent 58%);
      opacity: 0;
      transition: opacity .24s ease;
      pointer-events: none;
    }
    .sp-card > * { position: relative; z-index: 1; }
    .sp-card:hover {
      transform: translateY(-4px);
      border-color: var(--brand);
      box-shadow: var(--shadow-lg);
    }
    .sp-card:hover::before { opacity: 1; }
    .sp-card:active { transform: translateY(-1px); }

    .sp-tag {
      align-self: flex-start;
      font-family: "Roboto Mono", "SF Mono", Monaco, Consolas, monospace;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--brand);
      background: var(--brand-soft);
      border-radius: 5px;
      padding: 3px 8px;
    }
    .sp-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      transition: color .18s;
    }
    .sp-card:hover .sp-name { color: var(--brand); }
    .sp-desc {
      font-size: .83rem;
      color: var(--muted);
      line-height: 1.62;
      margin: 0;
    }
    .sp-arrow {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: "Roboto Mono", "SF Mono", Monaco, Consolas, monospace;
      font-size: .72rem;
      letter-spacing: .06em;
      color: var(--muted);
      opacity: .75;
      transition: color .18s, opacity .18s;
    }
    .sp-arrow::after {
      content: "→";
      font-size: .95rem;
      line-height: 1;
      transition: transform .2s ease;
    }
    .sp-card:hover .sp-arrow { color: var(--brand); opacity: 1; }
    .sp-card:hover .sp-arrow::after { transform: translateX(4px); }

    /* ==========================================================
       页脚
       ========================================================== */
    .page-foot {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 8px auto 0;
      padding: 26px 24px 48px;
      border-top: 1px solid var(--line);
      text-align: center;
      transition: border-color .28s ease;
    }
    /* 技术支持（微信号，可复制） */
    .tech {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 8px 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: var(--shadow-sm);
      max-width: 100%;
      transition: border-color .2s, box-shadow .2s, background-color .28s ease;
    }
    .tech:hover { border-color: var(--brand); }
    .tech-label {
      font-size: .78rem;
      color: var(--muted);
      font-weight: 600;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .tech-id {
      font-family: "Roboto Mono", "SF Mono", Monaco, Consolas, monospace;
      font-size: .84rem;
      font-weight: 700;
      color: var(--brand);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 46vw;
      cursor: pointer;
      user-select: all;
      -webkit-user-select: all;
      outline: none;
      border-radius: 4px;
    }
    .tech-id:active { opacity: .6; }
    .tech-copy {
      flex: 0 0 auto;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      font-family: inherit;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .02em;
      padding: 5px 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform .12s ease, filter .12s ease, background-color .2s ease;
    }
    .tech-copy:hover { filter: brightness(1.07); }
    .tech-copy:active { transform: translateY(1px); filter: brightness(.94); }
    .tech-copy.done { background-image: none; background-color: var(--brand); }
    .tech-copy.failed { background-image: none; background-color: var(--muted); }
    .foot-note {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.6;
      opacity: .85;
    }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 40px;
      z-index: 60;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--text);
      color: var(--bg);
      font-size: .84rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity .22s ease, transform .22s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* 焦点可见性 */
    a:focus-visible,
    button:focus-visible,
    [role="button"]:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 3px;
      border-radius: 8px;
    }

    /* ==========================================================
       响应式
       ========================================================== */
    @media (max-width: 720px) {
      .topbar-inner { padding: 12px 16px; }
      .page { padding: 28px 16px 40px; }
      .page-foot { padding: 22px 16px 40px; }
      .brand-logo { width: 40px; height: 40px; border-radius: 21%; }
      .brand-text h1 { font-size: 1.14rem; }
      .page-sub { font-size: .76rem; }
      .sp-section { margin: 30px 0 10px; }
      .sp-grid { grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
      .sp-card { padding: 15px 16px 13px; border-radius: 14px; }
      .sp-desc { font-size: .79rem; }
      .theme-btn-label { display: none; }
      .theme-btn { padding: 0 12px; }
      .theme-panel { width: 190px; }
    }

    @media (max-width: 380px) {
      .sp-grid { grid-template-columns: 1fr; }
      .theme-panel { right: -4px; }
    }

    /* 减少动效 */
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
  <!-- 先于首屏渲染应用已保存的主题，避免闪白 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('kb-theme');
        if (!saved) {
          saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'midnight' : 'emerald';
        }
        document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="bg-deco" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="brand-logo" src="assets/logo.png" alt="X">
        <div class="brand-text">
          <h1>独立页面</h1>
          <p class="page-sub">共 <span id="pageCount">2</span> 个独立页面 · 不经过文档渲染，点击即开</p>
        </div>
      </div>

      <div class="topbar-right">
        <div class="theme-wrap">
          <button class="theme-btn" id="themeBtn" type="button"
                  aria-haspopup="true" aria-expanded="false" aria-controls="themePanel">
            <span class="theme-swatch" aria-hidden="true"></span>
            <span class="theme-btn-label" id="themeLabel">翡翠绿</span>
            <span class="theme-caret" aria-hidden="true"></span>
          </button>

          <div class="theme-panel" id="themePanel" role="menu" aria-label="选择主题" hidden>
            <div class="theme-panel-title">主题</div>
            <button class="theme-item" type="button" role="menuitemradio" data-theme="emerald">
              <span class="theme-item-dot" style="background:linear-gradient(135deg,#5fd6a2,#2f9e6d)"></span>
              <span class="theme-item-name">翡翠绿</span>
              <span class="theme-item-check" aria-hidden="true">✓</span>
            </button>
            <button class="theme-item" type="button" role="menuitemradio" data-theme="midnight">
              <span class="theme-item-dot" style="background:linear-gradient(135deg,#7db4ff,#3d6fd6)"></span>
              <span class="theme-item-name">深海蓝</span>
              <span class="theme-item-check" aria-hidden="true">✓</span>
            </button>
            <button class="theme-item" type="button" role="menuitemradio" data-theme="sunset">
              <span class="theme-item-dot" style="background:linear-gradient(135deg,#ffb066,#e05a12)"></span>
              <span class="theme-item-name">暖阳橙</span>
              <span class="theme-item-check" aria-hidden="true">✓</span>
            </button>
            <button class="theme-item" type="button" role="menuitemradio" data-theme="violet">
              <span class="theme-item-dot" style="background:linear-gradient(135deg,#b3a0ff,#5b3fd6)"></span>
              <span class="theme-item-name">紫罗兰</span>
              <span class="theme-item-check" aria-hidden="true">✓</span>
            </button>
            <button class="theme-item" type="button" role="menuitemradio" data-theme="ink">
              <span class="theme-item-dot" style="background:linear-gradient(135deg,#5eead4,#0d9488)"></span>
              <span class="theme-item-name">墨石青</span>
              <span class="theme-item-check" aria-hidden="true">✓</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="page">
    <!-- ============ 板块一：工具 ============ -->

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      /* ---------------- 主题切换 ---------------- */
      var THEMES = {
        emerald:  { name: '翡翠绿' },
        midnight: { name: '深海蓝' },
        sunset:   { name: '暖阳橙' },
        violet:   { name: '紫罗兰' },
        ink:      { name: '墨石青' }
      };
      var STORE_KEY = 'kb-theme';
      var root = document.documentElement;
      var btn = document.getElementById('themeBtn');
      var panel = document.getElementById('themePanel');
      var label = document.getElementById('themeLabel');
      var items = panel ? panel.querySelectorAll('.theme-item') : [];

      function applyTheme(key, persist) {
        if (!THEMES[key]) key = 'emerald';
        root.setAttribute('data-theme', key);
        if (label) label.textContent = THEMES[key].name;
        for (var i = 0; i < items.length; i++) {
          items[i].setAttribute('aria-checked', items[i].getAttribute('data-theme') === key ? 'true' : 'false');
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', getComputedStyle(root).getPropertyValue('--brand').trim() || '#42b983');
        if (persist) {
          try { localStorage.setItem(STORE_KEY, key); } catch (e) {}
        }
      }

      function openPanel(open) {
        if (!panel || !btn) return;
        panel.hidden = !open;
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      if (btn && panel) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          openPanel(panel.hidden);
        });

        for (var i = 0; i < items.length; i++) {
          (function (item) {
            item.addEventListener('click', function () {
              applyTheme(item.getAttribute('data-theme'), true);
              openPanel(false);
              btn.focus();
            });
          })(items[i]);
        }

        document.addEventListener('click', function (e) {
          if (!panel.hidden && !panel.contains(e.target) && e.target !== btn) openPanel(false);
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && !panel.hidden) { openPanel(false); btn.focus(); }
        });
      }

      // 初始化（head 内联脚本已设好 data-theme，这里补 UI 状态）
      applyTheme(root.getAttribute('data-theme') || 'emerald', false);

      /* ---------------- 页面数量自动统计 ---------------- */
      var countEl = document.getElementById('pageCount');
      if (countEl) {
        var n = document.querySelectorAll('.sp-card').length;
        countEl.textContent = n;
      }

      /* ---------------- 复制微信号 ---------------- */
      var WECHAT_ID = 'not_every';
      var idEl = document.getElementById('techWx');
      var btnEl = document.getElementById('techCopy');
      var toastEl = document.getElementById('toast');
      var toastTimer = null;

      function showToast(msg) {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
      }

      function fallbackCopy(text) {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none;';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch (e) { return false; }
      }

      function copy(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text).then(function () { return true; })
            .catch(function () { return fallbackCopy(text); });
        }
        return Promise.resolve(fallbackCopy(text));
      }

      if (idEl && btnEl) {
        var timer = null;
        function handle() {
          copy(WECHAT_ID).then(function (ok) {
            clearTimeout(timer);
            if (ok) {
              btnEl.textContent = '已复制 ✓';
              btnEl.classList.add('done');
              btnEl.classList.remove('failed');
              showToast('微信号已复制：' + WECHAT_ID);
            } else {
              btnEl.textContent = '请长按';
              btnEl.classList.add('failed');
              btnEl.classList.remove('done');
              showToast('复制失败，请长按微信号手动复制');
            }
            timer = setTimeout(function () {
              btnEl.textContent = '复制';
              btnEl.classList.remove('done');
              btnEl.classList.remove('failed');
            }, 1600);
          });
        }

        btnEl.addEventListener('click', handle);
        idEl.addEventListener('click', handle);
        idEl.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handle(); }
        });
      }
    })();
  </script>
</body>
