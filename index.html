<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>知识库</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="stylesheet" href="assets/vue.css">
  <style>
    /* 代码块 */
    .markdown-section pre {
      border-radius: 6px;
    }
    /* 侧边栏宽度 */
    .sidebar { width: 260px; }
    .sidebar-toggle { width: 260px; }
    .content { left: 260px; }
    @media (min-width: 768px) {
      .sidebar-toggle { width: 260px; }
    }
    /* 首页 hero */
    .home-hero {
      text-align: center;
      padding: 60px 20px 40px;
    }
    .home-hero h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
    }
    .home-hero p {
      color: #666;
      font-size: 1.1em;
    }
    /* 搜索框 */
    .search { margin: 10px 15px; }
    .search input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }
    .search input:focus { border-color: #42b983; }

    /* 一级侧栏菜单固定加粗 (首页 / 电子资源 / 高性价比 / 申论 / 等)
       vue.css 默认所有 sidebar 链接 font-weight:400, 只有 .active>a 加粗.
       docsify 实际 DOM 是 `aside.sidebar > .sidebar-nav > ul > li > p > a`
       (每个一级条目都被包了一层 <p>), 所以必须同时写 `> a` 和 `> p > a` 两条路径. */
    .sidebar > ul > li > a,
    .sidebar > ul > li > p > a,
    .sidebar-nav > ul > li > a,
    .sidebar-nav > ul > li > p > a {
      font-weight: 700 !important;
      color: #364149 !important;
      font-size: 15px !important;
      padding-top: 4px;
      padding-bottom: 4px;
    }
    /* active 状态用主题绿色 (激活的栏目整体变绿, 整行留 brand color) */
    .sidebar > ul > li.active > a,
    .sidebar > ul > li.active > p > a,
    .sidebar-nav > ul > li.active > a,
    .sidebar-nav > ul > li.active > p > a {
      color: #42b983 !important;
    }
    /* 包裹一级标题的 <p>: 去掉默认的 700 让 <a> 自己控制; 顺带去掉上下 margin */
    .sidebar > ul > li > p,
    .sidebar-nav > ul > li > p {
      font-weight: 700;
      margin: 0;
    }
    /* 二级及更深条目保持细体, 不要被上面规则串到 */
    .sidebar ul li ul li a,
    .sidebar-nav ul li ul li a {
      font-weight: 400 !important;
      font-size: 13px !important;
      padding-top: 2px;
      padding-bottom: 2px;
    }
    /* 所有 sidebar <a> + 顶级 <p> (无链接的纯标题, 比如 * 高性价比 / * 申论)
       都要手型 + hover 下划线. 一级菜单在 _sidebar.md 里写成 `* 名字` 时
       docsify 只输出 <p>名字</p>, 没有 <a>, 所以光给 <a>:hover 是不行的. */
    .sidebar a,
    .sidebar-nav a,
    .sidebar > ul > li > p,
    .sidebar-nav > ul > li > p {
      cursor: pointer !important;
    }
    .sidebar a:hover,
    .sidebar-nav a:hover {
      text-decoration: underline !important;
    }
    /* 关键: 只在 <p> 内没有嵌套 <ul> 时 (即纯文本标题, 如 高性价比, 申论, 讲话稿,
       软考 *, 示例) 才用 text-decoration 下划线. 一旦 <p> 里包了 <ul>
       (首页这种嵌入了 app-sub-sidebar 的结构), text-decoration 会向下继承,
       让子项也出现下划线 —— 这就是用户报的"鼠标在一级标题上, 子项跟着变"的根因.
       这类有 <ul> 的 <p>, 让内部 <a>:hover 自管, 我们不下划线父 <p>. */
    .sidebar > ul > li > p:not(:has(ul)):hover,
    .sidebar-nav > ul > li > p:not(:has(ul)):hover {
      text-decoration: underline !important;
    }
    /* 顶级 <p> (无链接标题如 高性价比 / 申论) 加左右 padding,
       让 hover 命中区扩到整行, 不止文本宽度. */
    .sidebar > ul > li > p,
    .sidebar-nav > ul > li > p {
      padding-left: 4px;
      padding-right: 4px;
    }
    /* 电子资源/高性价比两个插件里的可点击元素: chip + 卡片整片
       全部强制 cursor:pointer, 避免被 docsify / 主题默认 cursor:text 覆盖 */
    .ebook-cat-chip,
    #ebook-search-results a,
    #lb-search-results a {
      cursor: pointer !important;
    }

    /* ============ 静态页面入口 (首页) ============ */
    .sp-section { margin: 46px 0 10px; }
    .sp-head {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.05rem; font-weight: 700; color: #2c3e50;
      margin: 0 0 6px;
    }
    .sp-head::before {
      content: ""; width: 3px; height: 16px; border-radius: 2px;
      background: #42b983; background: var(--theme-color, #42b983);
    }
    .sp-sub { color: #7f8c8d; font-size: .86rem; margin: 0 0 20px; }
    .sp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
      gap: 14px;
    }
    .sp-card {
      display: flex; flex-direction: column; gap: 8px;
      border: 1px solid #e6e9ed; border-radius: 12px;
      padding: 16px 18px 14px; background: #fff;
      text-decoration: none !important; font-weight: 400 !important;
      transition: transform .18s, border-color .18s, box-shadow .18s;
    }
    .sp-card:hover {
      transform: translateY(-3px);
      border-color: #42b983; border-color: var(--theme-color, #42b983);
      box-shadow: 0 10px 24px -14px rgba(66, 185, 131, .5);
    }
    .sp-tag {
      align-self: flex-start;
      font-family: "Roboto Mono", Monaco, courier, monospace;
      font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
      color: #42b983; color: var(--theme-color, #42b983);
      background: rgba(66, 185, 131, .1);
      border-radius: 4px; padding: 2px 7px;
    }
    .sp-name {
      font-size: 1rem; font-weight: 700; color: #2c3e50; line-height: 1.35;
      transition: color .18s;
    }
    .sp-card:hover .sp-name { color: #42b983; color: var(--theme-color, #42b983); }
    .sp-desc {
      font-size: .82rem; color: #7f8c8d; line-height: 1.62; margin: 0;
    }
    .sp-arrow {
      margin-top: auto; padding-top: 6px;
      display: flex; align-items: center; gap: 5px;
      font-family: "Roboto Mono", Monaco, courier, monospace;
      font-size: .72rem; letter-spacing: .06em; color: #b9c1c9;
      transition: color .18s;
    }
    .sp-arrow::after { content: "→"; font-size: .95rem; line-height: 1; }
    .sp-card:hover .sp-arrow { color: #42b983; color: var(--theme-color, #42b983); }
    @media screen and (max-width: 768px) {
      .sp-section { margin: 34px 0 8px; }
      .sp-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
      .sp-card { padding: 13px 14px 12px; }
      .sp-desc { font-size: .78rem; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '知识库',
      repo: 'noteveryx/noteveryx.github.io',
      loadSidebar: '_sidebar.md',
      // alias: 任何形如 `<dir>/_sidebar.md` 的子路径都重写为根相对路径
      // docsify 的 isAbsolutePath 不会把单前导 `/` 识别为绝对路径，
      // 因此不能直接用 `/_sidebar.md`；用相对路径 + alias 兜底最稳。
      alias: {
        '.*/_sidebar\\.md$': '/_sidebar.md'
      },
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: '搜索...',
        noData: '没有结果',
        paths: 'auto'
      },
      // markdown 渲染支持
      markdown: {
        smartypants: true
      },
      // 最后更新时间
      formatUpdated: '{YYYY}-{MM}-{DD} {HH}:{mm}',
    }
  </script>
  <script src="assets/docsify.min.js"></script>
  <script src="assets/search.min.js"></script>
  <script src="assets/zoom-image.min.js"></script>
  <script src="assets/docsify-copy-code.min.js"></script>
  <!-- 在 docsify 核心库之后引入 -->
  <script src="assets/sidebar-collapse.min.js"></script>
  <!-- 电子资源搜索插件 (docsify plugin) -->
  <script src="assets/ebook-search.js"></script>
  <!-- 高性价比搜索插件 (docsify plugin) -->
  <script src="assets/living-better-search.js"></script>
  <!-- 静态页面入口插件: 首页注入「独立页面」卡片网格 -->
  <script src="assets/static-pages.js"></script>
</body>
</html>
