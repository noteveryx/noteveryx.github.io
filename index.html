<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>知识库</title>
  <link rel="icon" type="image/png" href="assets/image/favicon-round.png">
  <link rel="apple-touch-icon" href="assets/image/logo.png">
  <link rel="stylesheet" href="assets/css/vue.css">
  <style>
    /* 代码块 */
    .markdown-section pre {
      border-radius: 6px;
    }
    /* 侧边栏宽度 */
    .sidebar { width: 260px; }
    .sidebar-toggle { width: 260px; }
    .content { left: 260px; }
    @media (min-width: 768px) {
      .sidebar-toggle { width: 260px; }
    }
    /* 首页 hero */
    .home-hero {
      text-align: center;
      padding: 60px 20px 40px;
    }
    .home-hero h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
    }
    .home-hero p {
      color: #666;
      font-size: 1.1em;
    }
    /* 搜索框 */
    .search { margin: 10px 15px; }
    .search input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }
    .search input:focus { border-color: #42b983; }

    /* 一级侧栏菜单固定加粗 (首页 / 电子资源 / 高性价比 / 申论 / 等)
       vue.css 默认所有 sidebar 链接 font-weight:400, 只有 .active>a 加粗.
       docsify 实际 DOM 是 `aside.sidebar > .sidebar-nav > ul > li > p > a`
       (每个一级条目都被包了一层 <p>), 所以必须同时写 `> a` 和 `> p > a` 两条路径. */
    .sidebar > ul > li > a,
    .sidebar > ul > li > p > a,
    .sidebar-nav > ul > li > a,
    .sidebar-nav > ul > li > p > a {
      font-weight: 700 !important;
      color: #364149 !important;
      font-size: 15px !important;
      padding-top: 4px;
      padding-bottom: 4px;
    }
    /* active 状态用主题绿色 (激活的栏目整体变绿, 整行留 brand color) */
    .sidebar > ul > li.active > a,
    .sidebar > ul > li.active > p > a,
    .sidebar-nav > ul > li.active > a,
    .sidebar-nav > ul > li.active > p > a {
      color: #42b983 !important;
    }
    /* 包裹一级标题的 <p>: 去掉默认的 700 让 <a> 自己控制; 顺带去掉上下 margin */
    .sidebar > ul > li > p,
    .sidebar-nav > ul > li > p {
      font-weight: 700;
      margin: 0;
    }
    /* 二级及更深条目保持细体, 不要被上面规则串到 */
    .sidebar ul li ul li a,
    .sidebar-nav ul li ul li a {
      font-weight: 400 !important;
      font-size: 13px !important;
      padding-top: 2px;
      padding-bottom: 2px;
    }
    /* 所有 sidebar <a> + 顶级 <p> (无链接的纯标题, 比如 * 高性价比 / * 申论)
       都要手型 + hover 下划线. 一级菜单在 _sidebar.md 里写成 `* 名字` 时
       docsify 只输出 <p>名字</p>, 没有 <a>, 所以光给 <a>:hover 是不行的. */
    .sidebar a,
    .sidebar-nav a,
    .sidebar > ul > li > p,
    .sidebar-nav > ul > li > p {
      cursor: pointer !important;
    }
    .sidebar a:hover,
    .sidebar-nav a:hover {
      text-decoration: underline !important;
    }
    /* 关键: 只在 <p> 内没有嵌套 <ul> 时 (即纯文本标题, 如 高性价比, 申论, 讲话稿,
       软考 *, 示例) 才用 text-decoration 下划线. 一旦 <p> 里包了 <ul>
       (首页这种嵌入了 app-sub-sidebar 的结构), text-decoration 会向下继承,
       让子项也出现下划线 —— 这就是用户报的"鼠标在一级标题上, 子项跟着变"的根因.
       这类有 <ul> 的 <p>, 让内部 <a>:hover 自管, 我们不下划线父 <p>. */
    .sidebar > ul > li > p:not(:has(ul)):hover,
    .sidebar-nav > ul > li > p:not(:has(ul)):hover {
      text-decoration: underline !important;
    }
    /* 顶级 <p> (无链接标题如 高性价比 / 申论) 加左右 padding,
       让 hover 命中区扩到整行, 不止文本宽度. */
    .sidebar > ul > li > p,
    .sidebar-nav > ul > li > p {
      padding-left: 4px;
      padding-right: 4px;
    }
    /* 电子资源/高性价比两个插件里的可点击元素: chip + 卡片整片
       全部强制 cursor:pointer, 避免被 docsify / 主题默认 cursor:text 覆盖 */
    .ebook-cat-chip,
    #ebook-search-results a,
    #lb-search-results a {
      cursor: pointer !important;
    }
  </style>
  <!-- docsify 搜索索引的存储保护
       必须放在 docsify/search 插件加载之前。
       背景: 本站语料约 20MB, docsify 生成的搜索索引约 13MB,
             超过 localStorage 的 10MB 配额, 写入必然失败。
             而插件的写法是「先写 expires 再写 index」:
             index 写失败时 expires 已经落盘, 于是下次访问会读到
             「index 为空 / 却未过期」的矛盾状态, 插件拿到 null 后
             直接抛 TypeError —— 表现为「第二次打开首页, 全局搜索彻底失效」。
       这里把两次写入合成一组, 保证两者始终一致:
         - expires 先暂存, 等 index 写成功后再落盘;
         - index 写失败(配额超限)则清掉 expires 并吞掉异常,
           让下次访问重新构建索引 —— 搜索质量与命中范围完全不受影响;
         - 启动时顺手清理历史上遗留的不一致状态。
       注: 这里只是「不缓存索引」, 并未缩小搜索范围, 也没有引入任何依赖。 -->
  <script>
    (function () {
      var INDEX_KEY = 'docsify.search.index';
      var EXPIRES_KEY = 'docsify.search.expires';
      var pendingExpires = null;
      var origSet = Storage.prototype.setItem;
      var origRemove = Storage.prototype.removeItem;

      // 历史遗留: expires 在但 index 不在 -> 插件会读到 null 而崩溃, 直接清掉
      try {
        if (localStorage.getItem(INDEX_KEY) === null && localStorage.getItem(EXPIRES_KEY) !== null) {
          origRemove.call(localStorage, EXPIRES_KEY);
        }
      } catch (e) { /* 隐私模式等场景忽略 */ }

      Storage.prototype.setItem = function (key, value) {
        try {
          if (key === EXPIRES_KEY) { pendingExpires = String(value); return; }
          if (key === INDEX_KEY) {
            try {
              origSet.call(this, key, value);
            } catch (err) {
              // 配额超限: 不再向上抛(整页不再出现未捕获异常), 同时清掉 expires 保持一致
              pendingExpires = null;
              try { origRemove.call(this, EXPIRES_KEY); } catch (e2) {}
              if (window.console && console.info) {
                console.info('[search] 搜索索引超出 localStorage 配额, 已跳过缓存; 搜索功能不受影响');
              }
              return;
            }
            if (pendingExpires !== null) {
              try { origSet.call(this, EXPIRES_KEY, pendingExpires); } catch (e3) {}
              pendingExpires = null;
            }
            return;
          }
        } catch (e4) { /* 忽略 */ }
        return origSet.call(this, key, value);
      };
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '知识库',
      repo: 'noteveryx/noteveryx.github.io',
      loadSidebar: '_sidebar.md',
      // alias: 任何形如 `<dir>/_sidebar.md` 的子路径都重写为根相对路径
      // docsify 的 isAbsolutePath 不会把单前导 `/` 识别为绝对路径，
      // 因此不能直接用 `/_sidebar.md`；用相对路径 + alias 兜底最稳。
      alias: {
        '.*/_sidebar\\.md$': '/_sidebar.md'
      },
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: '搜索...',
        noData: '没有结果',
        // 'auto' = 自动收录侧栏里的全部文档 (约 880 篇)。
        // 注意: 全量索引约 13MB, 超过 localStorage 10MB 配额, 浏览器存不下,
        //       所以每次打开首页都会重新抓取这些文档来建索引 (搜索质量不受影响,
        //       只是首页会多等一会儿)。想启用索引缓存、让首页秒开, 可改成显式白名单,
        //       例如 paths: ['/', '/docs/高性价比/', '/docs/申论/', '/docs/讲话稿/'],
        //       但这样名单外的文档就不会出现在搜索结果里了。
        paths: 'auto'
      },
      // markdown 渲染支持
      markdown: {
        smartypants: true
      },
      // 最后更新时间
      formatUpdated: '{YYYY}-{MM}-{DD} {HH}:{mm}',
    }
  </script>
  <script src="assets/js/docsify.min.js"></script>
  <script src="assets/js/search.min.js"></script>
  <script src="assets/js/zoom-image.min.js"></script>
  <script src="assets/js/docsify-copy-code.min.js"></script>
  <!-- 在 docsify 核心库之后引入 -->
  <script src="assets/js/sidebar-collapse.min.js"></script>
  <!-- 电子资源搜索插件 (docsify plugin) -->
  <script src="assets/js/ebook-search.js"></script>
  <!-- 高性价比搜索插件 (docsify plugin) -->
  <script src="assets/js/living-better-search.js"></script>
</body>
</html>
