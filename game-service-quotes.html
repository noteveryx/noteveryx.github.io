<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f9fd">
<link rel="icon" type="image/png" href="assets/favicon-round.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<title>快捷复制 · 10 条</title>
<style>
  :root{
    --bg1:#f7f9fd; --bg2:#eef1f9; --card:#fff; --text:#16192b; --muted:#6b7590;
    --line:rgba(22,25,43,.08); --accent:#635bff; --accent2:#00b8d9; --ok:#0e9f6e;
    --shadow:0 1px 2px rgba(22,25,43,.04),0 8px 24px rgba(22,25,43,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{
    margin:0;padding:0;
    width:100%;max-width:100%;
    overflow-x:hidden;              /* 兜底：老 Safari */
    overflow-x:clip;                /* iOS16+ / Chrome90+：彻底切断横向滚动，且不生成滚动容器 */
    overscroll-behavior-x:none;     /* 支持该属性的浏览器直接禁掉横向橡皮筋 */
    -webkit-text-size-adjust:100%;
  }
  body{
    margin:0;
    width:100%;max-width:100%;
    overflow-x:hidden;
    overflow-x:clip;
    overscroll-behavior-x:none;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:var(--text);
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
    /* 注意：不要用 background-attachment:fixed —— iOS Safari 上它会把背景层按 body 宽度铺开，
       造成视觉溢出、真机可左右拖动。渐变随文档高度铺满，观感不受影响。 */
    min-height:100vh;
    padding:0 0 calc(40px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased; line-height:1.7;
    position:relative;
  }
  .wrap{
    max-width:520px;margin:0 auto;width:100%;
    padding-left:max(14px,env(safe-area-inset-left));
    padding-right:max(14px,env(safe-area-inset-right));
  }
  header{position:relative;padding:34px 0 20px;overflow:hidden;}
  header::before{content:"";position:absolute;left:-60px;top:-70px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(99,91,255,.22),rgba(0,184,217,0) 70%);pointer-events:none;}
  header::after{content:"";position:absolute;right:-70px;top:-20px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle at 60% 40%,rgba(0,184,217,.20),rgba(99,91,255,0) 70%);pointer-events:none;}
  /* 品牌行（logo + 标题） */
  .brand{display:flex;align-items:center;gap:12px;position:relative;}
  .brand-logo{
    flex:0 0 auto;width:48px;height:48px;border-radius:21%;display:block; /* logo.png 自带 20% 圆角 */
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 4px 14px rgba(22,25,43,.18);
    background:#0b0e2a;
  }
  .brand-text{min-width:0;}
  .brand-text .eyebrow{margin-bottom:2px;}
  .brand-text h1{margin:0;}
  .eyebrow{display:inline-block;font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:700;margin-bottom:8px;position:relative;}
  h1{margin:0 0 6px;font-size:25px;line-height:1.35;font-weight:800;letter-spacing:-.01em;position:relative;}
  .sub{margin:0;font-size:13.5px;color:var(--muted);position:relative;}
  .sub b{color:var(--text);font-weight:700;}
  /* 咨询方式（微信号，可复制） */
  .contact{
    display:inline-flex;align-items:center;gap:8px;
    margin-top:14px;padding:7px 10px 7px 13px;
    background:rgba(255,255,255,.82);
    border:1px solid var(--line);border-radius:999px;
    box-shadow:0 2px 10px rgba(22,25,43,.05);
    max-width:100%;position:relative;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .contact-label{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;flex:0 0 auto;}
  .contact-id{
    font-family:"SF Mono",Menlo,Consolas,Monaco,monospace;
    font-size:13px;font-weight:700;color:var(--accent);
    letter-spacing:.01em;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:44vw;
    cursor:pointer;user-select:all;-webkit-user-select:all;
  }
  .contact-id:active{opacity:.6;}
  .contact-copy{
    flex:0 0 auto;border:none;border-radius:999px;
    background:linear-gradient(135deg,var(--accent),#7d6dff);
    color:#fff;font-size:12px;font-weight:700;
    padding:5px 12px;cursor:pointer;white-space:nowrap;
    transition:transform .12s ease,filter .12s ease;
  }
  .contact-copy:active{transform:translateY(1px);filter:brightness(.94);}
  .contact-copy.done{background:linear-gradient(135deg,var(--ok),#26c48a);}
  .toolbar{display:flex;gap:10px;margin:4px 0 16px;width:100%;}
  .btn-all{flex:1 1 auto;min-width:0;border:none;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),#8b7bff 60%,var(--accent2));
    color:#fff;font-size:15px;font-weight:700;padding:13px 14px;cursor:pointer;
    box-shadow:0 6px 18px rgba(99,91,255,.28);transition:transform .12s ease;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .btn-all:active{transform:translateY(1px);}
  .btn-ghost{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--text);
    border-radius:12px;padding:13px 12px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn-ghost:active{background:#f2f4fa;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    padding:14px 14px 12px;margin-bottom:12px;position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--accent),var(--accent2));opacity:.85;}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;min-width:0;}
  .no{flex:0 0 auto;width:24px;height:24px;border-radius:8px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .tag{flex:0 1 auto;min-width:0;font-size:11.5px;font-weight:700;color:var(--accent);
    background:rgba(99,91,255,.09);border:1px solid rgba(99,91,255,.14);
    padding:2.5px 8px;border-radius:999px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .len{flex:0 0 auto;margin-left:auto;font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;white-space:nowrap;}
  /* font-size 必须 >= 16px：iOS Safari 对小于 16px 的可编辑元素聚焦时会自动放大整页，
     放大后视口宽度大于布局宽度，页面就能被横向拖动。 */
  .text{font-size:16px;line-height:1.78;white-space:pre-wrap;
    word-break:break-word;overflow-wrap:anywhere;
    max-width:100%;user-select:text;-webkit-user-select:text;
    outline:none;border-radius:8px;padding:2px 0;}
  .text:focus{background:#f8f9ff;box-shadow:0 0 0 6px #f8f9ff;}
  .card-foot{display:flex;gap:8px;margin-top:11px;}
  .btn-copy{flex:1;border:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),#7d6dff);
    color:#fff;font-size:14.5px;font-weight:700;padding:11px 12px;cursor:pointer;transition:transform .12s ease,filter .12s ease;}
  .btn-copy:active{transform:translateY(1px);filter:brightness(.94);}
  .btn-copy.done{background:linear-gradient(135deg,var(--ok),#26c48a);}
  .btn-edit{border:1px solid var(--line);background:#fbfbfe;color:var(--muted);border-radius:11px;
    padding:11px 12px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .hint{font-size:12px;color:var(--muted);text-align:center;margin:2px 0 18px;}
  #toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px);
    background:rgba(22,25,43,.94);
    color:#fff;font-size:14px;font-weight:600;padding:11px 20px;border-radius:12px;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;
    max-width:min(82vw,420px);width:max-content;text-align:center;z-index:99;
    overflow-wrap:anywhere;line-height:1.5;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- 底部技术支持 ---------- */
  .foot{
    margin-top:26px;padding-top:18px;
    border-top:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;gap:10px;
    text-align:center;
  }
  .foot .contact{margin-top:0;}
  .foot-note{font-size:11.5px;color:#b9c1c9;margin:0;line-height:1.6;}

  /* ---------- 移动端适配 ---------- */
  @media (max-width:430px){
    h1{font-size:23px;}
    .eyebrow{margin-bottom:6px;}
  }
  @media (max-width:360px){
    h1{font-size:21px;}
    .sub{font-size:12.5px;}
    /* .text 保持 16px：小于 16px 会触发 iOS 聚焦自动缩放，进而导致整页可横滑 */
    .toolbar{gap:8px;}
    .btn-all{font-size:14px;padding:12px 10px;}
    .btn-ghost{font-size:13px;padding:12px 10px;}
    .brand{gap:10px;}
    .brand-logo{width:40px;height:40px;border-radius:21%;}
  }
  /* 超窄屏（如 320px）：工具栏改为上下排列，彻底避免挤压溢出 */
  @media (max-width:340px){
    .toolbar{flex-direction:column;gap:8px;}
    .btn-ghost{width:100%;}
  }
  /* 横屏 / 平板：限制内容宽度，保持居中 */
  @media (min-width:560px){
    .wrap{padding-left:18px;padding-right:18px;}
  }
</style>
</head>

const listEl = document.getElementById('list');
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1600);
}
function copy(text){
  const fallback = ()=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;top:0;left:0;opacity:0;pointer-events:none;';
      document.body.appendChild(ta);
      ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e){ return false; }
  };
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>fallback());
  }
  return Promise.resolve(fallback());
}
QUOTES.forEach((q,i)=>{
  const card = document.createElement('div');
  card.className='card';
  card.innerHTML =
    '<div class="card-head"><div class="no">'+(i+1)+'</div>'+
    '<div class="tag"></div><div class="len"></div></div>'+
    '<div class="text" contenteditable="plaintext-only" spellcheck="false"></div>'+

    '<button class="btn-edit">编辑</button></div>';
  card.querySelector('.tag').textContent = TAGS[i];
  const textEl = card.querySelector('.text');
  textEl.textContent = q;
  const lenEl = card.querySelector('.len');
  let dirty = false;
  lenEl.textContent = q.length + ' 字';
  textEl.addEventListener('input', ()=>{ dirty = true; });
  const btn = card.querySelector('.btn-copy');
  btn.addEventListener('click', ()=>{
    // 未编辑 -> 复制原始字符串（逐字节等于原文）；编辑过 -> 复制编辑后内容
    const payload = dirty ? textEl.innerText : q;
    copy(payload).then(ok=>{
      if(ok){
        btn.classList.add('done'); btn.textContent='已复制 ✓';
        toast('第 '+(i+1)+' 条已复制');
        setTimeout(()=>{btn.classList.remove('done');btn.textContent='复制';},1400);
      }else{ toast('复制失败，请长按手动选择'); }
    });
  });
  card.querySelector('.btn-edit').addEventListener('click', ()=>{
    textEl.focus();
    const r=document.createRange(); r.selectNodeContents(textEl);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
    toast('已选中文字，可直接修改');
  });
  listEl.appendChild(card);
});
document.getElementById('copyAll').addEventListener('click', ()=>{
  // 10 条按顺序拼起来 === 原文，直接用 RAW，原始换行一字不改
  copy(RAW).then(ok=>toast(ok?'已按顺序复制 10 条（原文原始换行）':'复制失败，请长按手动选择'));
});
document.getElementById('copyNum').addEventListener('click', ()=>{
  const arr = Array.from(listEl.querySelectorAll('.text')).map(el=>el.innerText);
  const joined = arr.map((t,i)=>(i+1)+'.'+t).join('\n');
  copy(joined).then(ok=>toast(ok?'已复制带序号版（1. 2. 3. …）':'复制失败，请长按手动选择'));
});

/* ---------- 微信号复制（头部咨询 / 底部技术支持） ---------- */
function bindCopyId(btnId, idId, value, tip){
  const btn = document.getElementById(btnId);
  const idEl = document.getElementById(idId);
  if(!btn || !idEl) return;
  const handler = ()=>{
    copy(value).then(ok=>{
      if(ok){
        toast(tip + '：' + value);
        btn.classList.add('done');
        const old = btn.textContent;
        btn.textContent = '已复制 ✓';
        setTimeout(()=>{ btn.classList.remove('done'); btn.textContent = old; }, 1400);
      }else{
        toast('复制失败，请长按微信号手动复制');
      }
    });
  };
  btn.addEventListener('click', handler);
  idEl.addEventListener('click', handler);
}
bindCopyId('copyWx', 'wxId', 'Jul1_LX520', '咨询微信已复制');
bindCopyId('copyTech', 'techWx', 'not_every', '技术支持微信已复制');

<script>
/* ---------- 真机横向滑动拦截 ----------
   iOS Safari 会忽略 viewport 上的 overflow-x:hidden，横向手势依然能拖动整页（橡皮筋）。
   这里用三层兜底：
     1) touchmove 横向手势直接吞掉（正在编辑/选中文字时放行，保住「长按选中复制」）
     2) body 宽度锁死为布局视口宽度，防止地址栏收放 / 缩放造成视口偏移
     3) 任何时刻把 scrollX 归零
*/
(function(){
  function editing(){
    var ae = document.activeElement;
    if (ae && ae.isContentEditable) return true;
    var s = window.getSelection && window.getSelection();
    return !!(s && s.rangeCount && !s.isCollapsed);
  }
  function lockWidth(){
    var w = document.documentElement.clientWidth;
    if (w && document.body.style.width !== w + 'px'){
      document.body.style.width = w + 'px';
    }
  }
  function zeroX(){
    if (window.pageXOffset) window.scrollTo(0, window.pageYOffset);
  }

  lockWidth();
  window.addEventListener('resize', lockWidth);
  window.addEventListener('orientationchange', function(){ setTimeout(lockWidth, 260); });
  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', function(){ lockWidth(); zeroX(); });
  }

  var sx = 0, sy = 0, stop = false, wasEditing = false;
  document.addEventListener('touchstart', function(e){
    var t = e.touches && e.touches[0];
    if (!t) return;
    sx = t.clientX; sy = t.clientY; stop = false;
    wasEditing = editing();
  }, {passive:true});

  document.addEventListener('touchmove', function(e){
    var t = e.touches && e.touches[0];
    if (!t) return;
    var dx = Math.abs(t.clientX - sx);
    var dy = Math.abs(t.clientY - sy);
    // 横向位移占主导 => 判定为横向拖动，直接吞掉（纵向滚动不受影响）
    if (!stop && !wasEditing && dx > 6 && dx > dy * 1.1){
      stop = true;
      if (e.cancelable) e.preventDefault();
    }
    zeroX();
  }, {passive:false});

  window.addEventListener('scroll', zeroX, {passive:true});
  window.addEventListener('orientationchange', function(){ setTimeout(zeroX, 260); });
})();
</script>
</script>
</body>
</html>
